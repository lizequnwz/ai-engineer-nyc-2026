<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">03 / EVALUATION ENGINEERING</text><text x="48" y="97" font-size="36" fill="#102E3A" font-family="Cambria">A balanced answer can conceal a fabricated adjustment</text><text fill="#50616A" font-size="22" x="48" y="141">Basis: final-answer scoring can reward zero variance even when the process violates the accounting </text><text fill="#50616A" font-size="22" x="48" y="170">task.</text></g><g id="find-gap" data-pptx-bounds="48 184 344 142"><rect x="48" y="184" width="344" height="142" fill="#E7F0EA" /><text x="66" y="213" fill="#075E52" font-weight="bold">01 / Find discrepancy</text><text fill="#132F3B" x="66" y="254">Supporting entry cannot be </text><text fill="#132F3B" x="66" y="280">found.</text></g><g id="unsupported-step" data-pptx-bounds="408 184 394 142"><rect x="408" y="184" width="394" height="142" fill="#E7F0EA" /><text x="426" y="213" fill="#075E52" font-weight="bold">02 / Take shortcut</text><text fill="#132F3B" x="426" y="254">Agent posts an unsupported </text><text fill="#132F3B" x="426" y="280">adjustment.</text></g><g id="apparent-success" data-pptx-bounds="818 184 414 142"><rect x="818" y="184" width="414" height="142" fill="#102E3A" /><text x="836" y="213" fill="#D5EF8C" font-weight="bold">03 / Appear successful</text><text fill="#FFFDF7" x="836" y="254">Variance = zero; accounting process </text><text fill="#FFFDF7" x="836" y="280">failed.</text></g><g id="tool-contract" data-pptx-bounds="48 350 1184 105"><line x1="48" y1="350" x2="1232" y2="350" stroke="#CBD4D1" /><text fill="#9B3025" font-weight="bold" x="48" y="384">Conflicting tool: only accepts a tying </text><text fill="#9B3025" font-weight="bold" x="48" y="410">reconciliation.</text><text fill="#075E52" font-weight="bold" x="660" y="384">Repair to test: accept a sourced explanation or flagged </text><text fill="#075E52" font-weight="bold" x="660" y="410">gap.</text></g><g id="lesson-0" data-pptx-bounds="48 478 376 178"><text x="48" y="503" font-size="24" fill="#075E52" font-family="Cambria">Behavior specification</text><text fill="#132F3B" x="48" y="545">First ask: applicable? Then: </text><text fill="#132F3B" x="48" y="571"><tspan>adhered? Not applicable is a</tspan> </text><text fill="#132F3B" x="48" y="597">separate state, not a pass.</text></g><g id="lesson-1" data-pptx-bounds="452 478 376 178"><text x="452" y="503" font-size="24" fill="#075E52" font-family="Cambria">Fork before the decision</text><text fill="#132F3B" x="452" y="545">Reconstruct state and test the </text><text fill="#132F3B" x="452" y="571"><tspan>incentive hypothesis. Prompt changes</tspan> </text><text fill="#132F3B" x="452" y="597"><tspan>alone sometimes helped; tool design</tspan> </text><text fill="#132F3B" x="452" y="623">mattered.</text></g><g id="lesson-2" data-pptx-bounds="856 478 376 178"><text x="856" y="503" font-size="24" fill="#075E52" font-family="Cambria">Verify beyond one replay</text><text fill="#132F3B" x="856" y="545">A simulated branch is cheaper and </text><text fill="#132F3B" x="856" y="571"><tspan>less faithful. Reproduce in the real</tspan> </text><text fill="#132F3B" x="856" y="597"><tspan>environment and inspect repeated</tspan> </text><text fill="#132F3B" x="856" y="623">trials and regressions.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Basis · Arize | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">18 / 37</text></g></svg>