<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7" />
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">03 / AN ACCOUNTABLE RELEASE JUDGMENT</text><text x="48" y="98" font-family="Cambria" font-size="36">Release with blockers, evidence and bounded exposure</text><text x="48" y="143" font-size="22">A clean finite suite supports a scoped decision; it cannot prove consequential failures impossible.</text></g>
<g id="blocking-conditions" data-pptx-bounds="48 184 1184 110"><rect x="48" y="184" width="1184" height="110" fill="#102E3A" /><text x="72" y="220" font-size="24" font-family="Cambria" fill="#D5EF8C">Declare noncompensating blockers before reviewing scores</text><text x="72" y="263" fill="#FFFDF7">Unauthorized access/action • unsupported consequential number • omitted required approval</text></g>
<g id="quality-economics" data-pptx-bounds="48 320 1184 63" fill="#132F3B"><text x="48" y="345">Review task acceptance, paired regressions, judge validity, uncertainty and total review/cost together.</text><text x="48" y="373">Excellent average utility does not offset a domain-defined blocking failure.</text></g>
<g id="evidence-packet" data-pptx-bounds="48 420 360 220" fill="#132F3B"><text x="48" y="449" font-size="24" font-family="Cambria" fill="#075E52">1 / Evidence packet</text><text x="48" y="494">Scope and versions; results by slice;</text><text x="48" y="522">traces; material regressions;</text><text x="48" y="550">expert disagreements; known limits</text><text x="48" y="578">and accepted exceptions.</text></g>
<g id="accountable-decision" data-pptx-bounds="440 420 360 220" fill="#132F3B"><text x="440" y="449" font-size="24" font-family="Cambria" fill="#075E52">2 / Named decision owner</text><text x="440" y="494">Investigate or promote within scope.</text><text x="440" y="522">Inadequate evidence warrants</text><text x="440" y="550">further work; authority remains</text><text x="440" y="578">outside automated diagnosis.</text></g>
<g id="staged-operation" data-pptx-bounds="832 420 400 220" fill="#132F3B"><text x="832" y="449" font-size="24" font-family="Cambria" fill="#075E52">3 / Bounded operation</text><text x="832" y="494">Monitor with explicit pause, rollback</text><text x="832" y="522">and renewed-review conditions.</text><text x="832" y="550">Broaden assessment when uncertainty</text><text x="832" y="578">could change the decision.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 670 1184 30" font-size="12" fill="#50616A"><text x="48" y="688">Proposed gate informed by banking, failure-study and Two Sigma accounts; no implemented bank threshold/rollback policy was captured.</text><text x="1232" y="688" text-anchor="end">17 / 37</text></g></svg>