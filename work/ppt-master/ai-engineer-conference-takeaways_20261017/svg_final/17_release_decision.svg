<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">03 / EVALUATION ENGINEERING</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">A repair must not hide a consequential regression</text><text x="48" y="141" font-size="22" fill="#50616A">Compare a vector of quality, critical defects, time and reviewer effort before expanding exposure.</text></g><g id="blocking-condition" data-pptx-bounds="48 180 1184 56"><rect x="48" y="180" width="1184" height="56" fill="#102E3A" /><text x="66" y="215" fill="#FFFDF7">A quality gain cannot offset prohibited access, fabricated support or an unapproved action.</text></g><g id="analysis-1" data-pptx-bounds="48 254 365 411"><text x="48" y="282" font-size="24" font-family="Cambria" fill="#075E52">Compare the whole vector</text><text fill="#132F3B" x="48" y="343">Sofia Jakovcevic’s release </text><text fill="#132F3B" x="48" y="370">describes a prompt repair that </text><text fill="#132F3B" x="48" y="397">improves safety while harming </text><text fill="#132F3B" x="48" y="424">completion. Preserve task/evidence </text><text fill="#132F3B" x="48" y="451">quality, critical defects, latency </text><text fill="#132F3B" x="48" y="478">and reviewer effort together. An </text><text fill="#132F3B" x="48" y="505">aggregate gain should trigger </text><text fill="#132F3B" x="48" y="532">inspection of important slices and </text><text fill="#132F3B" x="48" y="559">regressions rather than automatic </text><text fill="#132F3B" x="48" y="586">promotion.</text></g><g id="analysis-2" data-pptx-bounds="452 254 365 411"><text x="452" y="282" font-size="24" font-family="Cambria" fill="#075E52">Trust observed execution</text><text fill="#132F3B" x="452" y="343">Omni’s release emphasizes full </text><text fill="#132F3B" x="452" y="370">traces and gates that actually stop </text><text fill="#132F3B" x="452" y="397">work. Verify that the tool effect </text><text fill="#132F3B" x="452" y="424">or test occurred through runtime </text><text fill="#132F3B" x="452" y="451">records; an agent’s claim that it </text><text fill="#132F3B" x="452" y="478">passed is not independent evidence. </text><text fill="#132F3B" x="452" y="505">Protect evaluator inputs and </text><text fill="#132F3B" x="452" y="532">permitted tool/model access from </text><text fill="#132F3B" x="452" y="559">benchmark gaming.</text></g><g id="analysis-3" data-pptx-bounds="856 254 365 411"><text font-size="24" fill="#075E52" font-family="Cambria" x="856" y="282">Make the decision </text><text font-size="24" fill="#075E52" font-family="Cambria" x="856" y="314">reproducible</text><text fill="#132F3B" x="856" y="343">Retain task/data/evaluator </text><text fill="#132F3B" x="856" y="370">versions, failure examples, expert </text><text fill="#132F3B" x="856" y="397">disagreements, accepted exceptions </text><text fill="#132F3B" x="856" y="424">and the owner. Promote within a </text><text fill="#132F3B" x="856" y="451">stated scope, then monitor for </text><text fill="#132F3B" x="856" y="478">escaped failures with pause or </text><text fill="#132F3B" x="856" y="505">rollback conditions. Finite tests </text><text fill="#132F3B" x="856" y="532">support a bounded decision, not </text><text fill="#132F3B" x="856" y="559">proof that a critical failure </text><text fill="#132F3B" x="856" y="586">cannot occur.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Arize · Omni Analytics · Google DeepMind / Kaggle / LinqAlpha | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">17 / 37</text></g></svg>