<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">04 / CONTROLLED WORKFLOWS</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Enforce authority outside the proposed action</text><text x="48" y="141" font-size="22" fill="#50616A">Two Sigma makes ownership and scope visible; Bloomberg makes the execution boundary concrete.</text></g><g id="method-sequence" data-pptx-bounds="48 180 1184 56"><rect x="48.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="62.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Identity</text><rect x="347.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="361.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Policy check</text><rect x="647.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="661.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Authorized executor</text><rect x="946.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="960.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Audit + stop</text></g><g id="analysis-1" data-pptx-bounds="48 252 365 413"><text x="48" y="280" font-size="24" font-family="Cambria" fill="#075E52">Make the agent accountable</text><text fill="#132F3B" x="48" y="341">Register an owner, purpose, tools </text><text fill="#132F3B" x="48" y="368">and accessible resources. Use </text><text fill="#132F3B" x="48" y="395">short-lived scoped identity and </text><text fill="#132F3B" x="48" y="422">carry the user’s authority through </text><text fill="#132F3B" x="48" y="449">the tool path. A valid credential </text><text fill="#132F3B" x="48" y="476">or schema does not establish that a </text><text fill="#132F3B" x="48" y="503">business action is appropriate for </text><text fill="#132F3B" x="48" y="530">this case.</text></g><g id="analysis-2" data-pptx-bounds="452 252 365 413"><text x="452" y="280" font-size="24" font-family="Cambria" fill="#075E52">Test the actual boundary</text><text fill="#132F3B" x="452" y="341">Challenge cross-tenant queries, </text><text fill="#132F3B" x="452" y="368">revoked access, agent-to-agent </text><text fill="#132F3B" x="452" y="395">privilege escalation, retries and </text><text fill="#132F3B" x="452" y="422">budget exhaustion. Bloomberg </text><text fill="#132F3B" x="452" y="449">recommends deterministic invocation </text><text fill="#132F3B" x="452" y="476">checks and egress limits including </text><text fill="#132F3B" x="452" y="503">DNS. Verify that a denied action is </text><text fill="#132F3B" x="452" y="530">blocked and a halt condition stops </text><text fill="#132F3B" x="452" y="557">execution, rather than merely </text><text fill="#132F3B" x="452" y="584">producing an alert.</text></g><g id="analysis-3" data-pptx-bounds="856 252 365 413"><text font-family="Cambria" fill="#075E52" font-size="24" x="856" y="280">Treat memory as an input </text><text font-family="Cambria" fill="#075E52" font-size="24" x="856" y="312">surface</text><text fill="#132F3B" x="856" y="341">A hostile document can try to </text><text fill="#132F3B" x="856" y="368">persist an instruction for a future </text><text fill="#132F3B" x="856" y="395">run. Separate source content from </text><text fill="#132F3B" x="856" y="422">trusted procedure, control memory </text><text fill="#132F3B" x="856" y="449">writes and preserve provenance. </text><text fill="#132F3B" x="856" y="476">Independent approval triage can </text><text fill="#132F3B" x="856" y="503">reduce attention demands only if </text><text fill="#132F3B" x="856" y="530">its errors and enforcement role are </text><text fill="#132F3B" x="856" y="557">understood; it cannot silently </text><text fill="#132F3B" x="856" y="584">waive required approval.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Two Sigma · Bloomberg · Intuit Credit Karma | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">21 / 37</text></g></svg>