<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">03 / EVALUATION ENGINEERING</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Evaluate the outcome, behavior and authority</text><text x="48" y="141" font-size="22" fill="#50616A">A correct total cannot compensate for fabricated evidence, a prohibited shortcut or an unapproved send.</text></g><g id="method-sequence" data-pptx-bounds="48 180 1184 56"><rect x="48.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="62.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Outcome</text><rect x="347.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="361.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Behavior</text><rect x="647.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="661.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Authority</text><rect x="946.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="960.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Operating effort</text></g><g id="analysis-1" data-pptx-bounds="48 252 365 413"><text x="48" y="280" font-size="24" font-family="Cambria" fill="#075E52">Start from professional work</text><text fill="#132F3B" x="48" y="341">Vals emphasizes fully acceptable </text><text fill="#132F3B" x="48" y="368">outputs rather than only average </text><text fill="#132F3B" x="48" y="395">partial credit. Ramp’s bookkeeping </text><text fill="#132F3B" x="48" y="422">account defines task, synthetic </text><text fill="#132F3B" x="48" y="449">business world, trajectory and </text><text fill="#132F3B" x="48" y="476">accountant-authored rubric. Build </text><text fill="#132F3B" x="48" y="503">cases around the work a reviewer </text><text fill="#132F3B" x="48" y="530">accepts, with realistic missing and </text><text fill="#132F3B" x="48" y="557">messy evidence.</text></g><g id="analysis-2" data-pptx-bounds="452 252 365 413"><text x="452" y="280" font-size="24" font-family="Cambria" fill="#075E52">Construct diagnostic variants</text><text fill="#132F3B" x="452" y="341">The Air Canada release describes </text><text fill="#132F3B" x="452" y="368">writing an expected answer first, </text><text fill="#132F3B" x="452" y="395">then creating evidence-containing </text><text fill="#132F3B" x="452" y="422">inputs. Add removed evidence, </text><text fill="#132F3B" x="452" y="449">planted violations and </text><text fill="#132F3B" x="452" y="476">meaning-preserving edits. Validate </text><text fill="#132F3B" x="452" y="503">realism and the answer key; </text><text fill="#132F3B" x="452" y="530">synthetic generation can produce </text><text fill="#132F3B" x="452" y="557">shortcuts that make the test </text><text fill="#132F3B" x="452" y="584">artificially easy.</text></g><g id="analysis-3" data-pptx-bounds="856 252 365 413"><text font-family="Cambria" fill="#075E52" font-size="24" x="856" y="280">Keep blockers outside the </text><text font-family="Cambria" fill="#075E52" font-size="24" x="856" y="312">average</text><text fill="#132F3B" x="856" y="341">A correct total cannot offset </text><text fill="#132F3B" x="856" y="368">fabricated evidence, unauthorized </text><text fill="#132F3B" x="856" y="395">access or an unapproved send. Use </text><text fill="#132F3B" x="856" y="422">exact assertions where available, </text><text fill="#132F3B" x="856" y="449">calibrated domain rubrics for </text><text fill="#132F3B" x="856" y="476">judgment and a separate behavior </text><text fill="#132F3B" x="856" y="503">verdict. Keep full cost, latency, </text><text fill="#132F3B" x="856" y="530">coverage and reviewer effort beside </text><text fill="#132F3B" x="856" y="557">quality.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Vals AI · Ramp · Basis · Air Canada | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">13 / 37</text></g></svg>