<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="section"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#102E3A" />
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#FFFDF7"><text x="48" y="55" font-size="16" fill="#D5EF8C">03 / BUILDING EVALUATIONS</text><text font-family="Cambria" font-size="36" x="48" y="98">Evaluate the complete job</text><text font-family="Cambria" font-size="36" x="48" y="141">against an acceptance contract</text></g>
<g id="task-contract" data-pptx-bounds="48 190 560 274"><rect x="48" y="190" width="560" height="274" fill="#E7F0EA" /><text x="72" y="231" font-size="24" font-family="Cambria" fill="#075E52">Specify the permitted completion</text><text fill="#132F3B" x="72" y="279">Request + input snapshot + sources/tools/actions.</text><text fill="#132F3B" x="72" y="307">Required output and supporting evidence.</text><text fill="#132F3B" x="72" y="335">Clarification and abstention conditions.</text><text fill="#132F3B" x="72" y="363">Prohibited actions and critical blockers.</text><text x="72" y="429" font-size="18" fill="#50616A">Ramp’s task framing starts with the job the user needed.</text></g>
<g id="case-coverage" data-pptx-bounds="640 190 592 274"><text x="640" y="231" font-size="24" font-family="Cambria" fill="#D5EF8C">Build cases that expose failure paths</text><text fill="#FFFDF7" x="640" y="279">Ordinary and difficult work; ambiguity; missing facts;</text><text fill="#FFFDF7" x="640" y="307">denied actions; known regressions.</text><text fill="#FFFDF7" x="640" y="365">Record what failure each case tests. A correct output</text><text fill="#FFFDF7" x="640" y="393">can conceal an unacceptable trajectory. Open-ended</text><text fill="#FFFDF7" x="640" y="421">jobs may permit several acceptable answers.</text></g>
<g id="independent-dimensions" data-pptx-bounds="48 503 1184 146"><line x1="48" y1="504" x2="1232" y2="504" stroke="#50616A" /><text x="48" y="544" font-size="22" fill="#D5EF8C">Keep diagnostics and acceptance distinct.</text><text fill="#FFFDF7" x="48" y="585">Score usefulness, evidence, safety, experience, latency, full cost and review effort independently.</text><text fill="#FFFDF7" x="48" y="613">Predeclare blockers; version cases and evaluators; retain expert disagreement and separate tuning from assessment.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 671 1184 29" font-size="12" fill="#E7F0EA"><text x="48" y="689">Sources: Ramp, failure-study and banking accounts. Proposed method; Comet/NatWest affiliation remains unresolved in source metadata.</text><text x="1232" y="689" text-anchor="end">13 / 37</text></g></svg>