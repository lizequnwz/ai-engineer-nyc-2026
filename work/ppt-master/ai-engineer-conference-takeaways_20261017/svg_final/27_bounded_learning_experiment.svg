<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">05 / AI ENGINEER GROWTH</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Prove one improvement through a bounded experiment</text><text x="48" y="141" font-size="22" fill="#50616A">One realistic task and one diagnosed failure can develop the full engineering discipline.</text></g><g id="method-sequence" data-pptx-bounds="48 180 1184 56"><rect x="48.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="62.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Baseline</text><rect x="347.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="361.5" y="215" font-size="18" fill="#075E52" font-weight="bold">One hypothesis</text><rect x="647.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="661.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Paired assessment</text><rect x="946.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="960.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Learning packet</text></g><g id="analysis-1" data-pptx-bounds="48 252 365 413"><text x="48" y="280" font-size="24" font-family="Cambria" fill="#075E52">Build a reviewable baseline</text><text fill="#132F3B" x="48" y="341">Interview a practitioner and choose </text><text fill="#132F3B" x="48" y="368">a historical task with known </text><text fill="#132F3B" x="48" y="395">accepted work. Preserve its input </text><text fill="#132F3B" x="48" y="422">snapshot and permitted tools. Write </text><text fill="#132F3B" x="48" y="449">exact checks, a short expert rubric </text><text fill="#132F3B" x="48" y="476">and one critical behavior </text><text fill="#132F3B" x="48" y="503">expectation before measuring the </text><text fill="#132F3B" x="48" y="530">candidate.</text></g><g id="analysis-2" data-pptx-bounds="452 252 365 413"><text x="452" y="280" font-size="24" font-family="Cambria" fill="#075E52">Vary one hypothesis</text><text fill="#132F3B" x="452" y="341">Try a skill ablation, a narrower </text><text fill="#132F3B" x="452" y="368">context or a repaired tool </text><text fill="#132F3B" x="452" y="395">incentive. Add an answer-first </text><text fill="#132F3B" x="452" y="422">missing-evidence case and a </text><text fill="#132F3B" x="452" y="449">next-period memory case. Repeat </text><text fill="#132F3B" x="452" y="476">when stochastic variation matters, </text><text fill="#132F3B" x="452" y="503">keep held-out assessment and </text><text fill="#132F3B" x="452" y="530">inspect regressions as well as the </text><text fill="#132F3B" x="452" y="557">average.</text></g><g id="analysis-3" data-pptx-bounds="856 252 365 413"><text x="856" y="280" font-size="24" font-family="Cambria" fill="#075E52">Publish the learning packet</text><text fill="#132F3B" x="856" y="341">Retain the trace, </text><text fill="#132F3B" x="856" y="368">baseline/candidate results, </text><text fill="#132F3B" x="856" y="395">important disagreement, total </text><text fill="#132F3B" x="856" y="422">review effort and the current </text><text fill="#132F3B" x="856" y="449">artifact. State what improved, what </text><text fill="#132F3B" x="856" y="476">failed and what remains uncertain. </text><text fill="#132F3B" x="856" y="503">This develops product judgment, </text><text fill="#132F3B" x="856" y="530">debugging and evaluation together; </text><text fill="#132F3B" x="856" y="557">it is an optional learning exercise </text><text fill="#132F3B" x="856" y="584">rather than a project commitment.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Basis · Ramp · Air Canada · Capital One | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">27 / 37</text></g></svg>