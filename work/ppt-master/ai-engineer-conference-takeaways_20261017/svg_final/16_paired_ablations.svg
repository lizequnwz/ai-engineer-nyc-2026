<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">03 / EVALUATION ENGINEERING</text><text x="48" y="97" font-size="36" fill="#102E3A" font-family="Cambria">Memory must refresh facts as the business moves on</text><text fill="#50616A" font-size="22" x="48" y="141">Ryan Stevens’s Ramp article tests reusable procedure in later-period synthetic worlds; the fixture </text><text fill="#50616A" font-size="22" x="48" y="170">below is invented.</text></g><g id="paired-variants" data-pptx-bounds="48 184 1184 172" data-pptx-replace-with="table" data-pptx-fallback-sha256="45bb8eaabbd1b56d90774a562ee40b4b920b70a13158ed11087696928511edb3"><metadata type="application/json">{"schema": "ppt-master.semantic-table.v2", "name": "paired-variants", "x": 48, "y": 184, "width": 1184, "height": 172, "column_widths": [300, 300, 300, 284], "row_heights": [48, 62, 62], "style": {"font_family": "Arial", "font_size": 18, "header_font_size": 18, "header_fill": "#102E3A", "header_text": "#FFFDF7", "body_text": "#132F3B", "padding": {"left": 16, "right": 16, "top": 8, "bottom": 8}, "valign": "middle"}, "defaults": {"cell": {"align": "l", "borders": {"left": {"style": "none"}, "right": {"style": "none"}, "top": {"style": "none"}, "bottom": {"style": "solid", "color": "#CBD4D1", "width": 1}}}}, "columns": [{"text": "Invented period", "bold": true}, {"text": "Invoices", "bold": true}, {"text": "Ledger", "bold": true}, {"text": "Unexplained gap", "bold": true}], "rows": [["January", "12,400", "12,000", "400"], ["February", "15,000", "13,900", "1,100"]]}</metadata><rect x="48" y="184" width="1184" height="48" fill="#102E3A" /><text x="64" y="214" font-size="18" fill="#FFFDF7" font-weight="bold">Invented period</text><text x="364" y="214" font-size="18" fill="#FFFDF7" font-weight="bold">Invoices</text><text x="664" y="214" font-size="18" fill="#FFFDF7" font-weight="bold">Ledger</text><text x="964" y="214" font-size="18" fill="#FFFDF7" font-weight="bold">Unexplained gap</text><line x1="48" y1="232" x2="1232" y2="232" stroke="#CBD4D1" /><text x="64" y="269.0" font-size="18" fill="#132F3B">January</text><text x="364" y="269.0" font-size="18" fill="#132F3B">12,400</text><text x="664" y="269.0" font-size="18" fill="#132F3B">12,000</text><text x="964" y="269.0" font-size="18" fill="#132F3B">400</text><line x1="48" y1="294" x2="1232" y2="294" stroke="#CBD4D1" /><text x="64" y="331.0" font-size="18" fill="#132F3B">February</text><text x="364" y="331.0" font-size="18" fill="#132F3B">15,000</text><text x="664" y="331.0" font-size="18" fill="#132F3B">13,900</text><text x="964" y="331.0" font-size="18" fill="#132F3B">1,100</text><line x1="48" y1="356" x2="1232" y2="356" stroke="#CBD4D1" /></g><g id="stale-memory" data-pptx-bounds="48 384 420 112"><rect x="48" y="384" width="420" height="112" fill="#E7F0EA" /><text x="66" y="413" fill="#075E52" font-weight="bold">Stale fact</text><text x="66" y="454" fill="#132F3B">“Last month the gap was 400.”</text></g><g id="reusable-procedure" data-pptx-bounds="492 384 740 112"><rect x="492" y="384" width="740" height="112" fill="#102E3A" /><text x="510" y="413" fill="#D5EF8C" font-weight="bold">Reusable procedure</text><text x="510" y="454" fill="#FFFDF7">Fetch current records → match IDs → explain or flag the gap.</text></g><g id="lesson-0" data-pptx-bounds="48 521 376 136"><text x="48" y="546" font-size="24" fill="#075E52" font-family="Cambria">Test temporal transfer</text><text fill="#132F3B" x="48" y="588">Refresh amounts; retain the method. </text><text fill="#132F3B" x="48" y="614"><tspan>Add a changed approval rule as a</tspan> </text><text fill="#132F3B" x="48" y="640">separate proposed test.</text></g><g id="lesson-1" data-pptx-bounds="452 521 376 136"><text x="452" y="546" font-size="24" fill="#075E52" font-family="Cambria">Inspect regressions</text><text fill="#132F3B" x="452" y="588">Reported gain: +5.7 score points </text><text fill="#132F3B" x="452" y="614"><tspan>over skills alone. Later worlds</tspan> </text><text fill="#132F3B" x="452" y="640">improve and regress.</text></g><g id="lesson-2" data-pptx-bounds="856 521 376 136"><text x="856" y="546" font-size="24" fill="#075E52" font-family="Cambria">Keep the scope</text><text fill="#132F3B" x="856" y="588">Separate written account, not the </text><text fill="#132F3B" x="856" y="614"><tspan>keynote. Invented amounts grant no</tspan> </text><text fill="#132F3B" x="856" y="640">permission to post.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Ramp | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">16 / 37</text></g></svg>