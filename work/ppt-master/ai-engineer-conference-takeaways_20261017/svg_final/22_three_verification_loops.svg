<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">04 / CONTROLLED WORKFLOWS</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Make verification cheap, independent and repeatable</text><text x="48" y="141" font-size="22" fill="#50616A">Sonar motivates independent checks; Capital One argues for lowering the cost of engineering rigor.</text></g><g id="analysis-1" data-pptx-bounds="48 193 365 472"><text x="48" y="221" font-size="24" font-family="Cambria" fill="#075E52">Creation: prevent and inspect</text><text fill="#132F3B" x="48" y="283">Supply intent, constraints, shared </text><text fill="#132F3B" x="48" y="310">test fixtures and fast low-noise </text><text fill="#132F3B" x="48" y="337">checks while work is generated. </text><text fill="#132F3B" x="48" y="364">Keep deterministic checks for </text><text fill="#132F3B" x="48" y="391">properties that can be asserted </text><text fill="#132F3B" x="48" y="418">exactly. Another model’s agreement </text><text fill="#132F3B" x="48" y="445">or a quick approval does not </text><text fill="#132F3B" x="48" y="472">replace independent evidence of </text><text fill="#132F3B" x="48" y="499">correctness.</text></g><g id="analysis-2" data-pptx-bounds="452 193 365 472"><text font-family="Cambria" fill="#075E52" font-size="24" x="452" y="221">Release: verify the complete </text><text font-family="Cambria" fill="#075E52" font-size="24" x="452" y="253">change</text><text fill="#132F3B" x="452" y="283">Test interfaces, permissions, </text><text fill="#132F3B" x="452" y="310">financial invariants and </text><text fill="#132F3B" x="452" y="337">representative regressions. Inspect </text><text fill="#132F3B" x="452" y="364">the current saved artifact after </text><text fill="#132F3B" x="452" y="391">the last edit. Keep the evidence </text><text fill="#132F3B" x="452" y="418">and the decision owner together; a </text><text fill="#132F3B" x="452" y="445">check that can be bypassed or does </text><text fill="#132F3B" x="452" y="472">not halt the relevant action is an </text><text fill="#132F3B" x="452" y="499">incomplete gate.</text></g><g id="analysis-3" data-pptx-bounds="856 193 365 472"><text font-family="Cambria" fill="#075E52" font-size="24" x="856" y="221">Operation: reproduce and </text><text font-family="Cambria" fill="#075E52" font-size="24" x="856" y="253">repair</text><text fill="#132F3B" x="856" y="283">Capture escaped failures, </text><text fill="#132F3B" x="856" y="310">reconstruct their context and </text><text fill="#132F3B" x="856" y="337">verify the repair against other </text><text fill="#132F3B" x="856" y="364">work. The confidence product in </text><text fill="#132F3B" x="856" y="391">Sonar’s talk is conceptual, and its </text><text fill="#132F3B" x="856" y="418">code-size illustration is </text><text fill="#132F3B" x="856" y="445">workload-specific. Neither supplies </text><text fill="#132F3B" x="856" y="472">a calibrated assurance formula or a </text><text fill="#132F3B" x="856" y="499">universal limit on agent-generated </text><text fill="#132F3B" x="856" y="526">software.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Sonar · Capital One | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">22 / 37</text></g></svg>