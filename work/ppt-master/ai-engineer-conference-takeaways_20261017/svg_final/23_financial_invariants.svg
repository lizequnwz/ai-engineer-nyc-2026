<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">04 / CONTROLLED WORKFLOWS</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Long-running work needs state and deliberate recovery</text><text x="48" y="141" font-size="22" fill="#50616A">Arca explains event-driven service work; Perpetual explains compiled and approved execution.</text></g><g id="method-sequence" data-pptx-bounds="48 180 1184 56"><rect x="48.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="62.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Interpret</text><rect x="347.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="361.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Validate / approve</text><rect x="647.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="661.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Wait / resume</text><rect x="946.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="960.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Resolve outcome</text></g><g id="analysis-1" data-pptx-bounds="48 252 365 413"><text x="48" y="280" font-size="24" font-family="Cambria" fill="#075E52">Persist the handoff</text><text fill="#132F3B" x="48" y="341">Keep the goal, approved plan, </text><text fill="#132F3B" x="48" y="368">completed work, evidence and next </text><text fill="#132F3B" x="48" y="395">responsible party outside a </text><text fill="#132F3B" x="48" y="422">disposable run. Wake on a client </text><text fill="#132F3B" x="48" y="449">reply, approval, settlement event </text><text fill="#132F3B" x="48" y="476">or deadline. A new invocation </text><text fill="#132F3B" x="48" y="503">should know what happened and what </text><text fill="#132F3B" x="48" y="530">remains, without assuming every </text><text fill="#132F3B" x="48" y="557">prior action failed.</text></g><g id="analysis-2" data-pptx-bounds="452 252 365 413"><text x="452" y="280" font-size="24" font-family="Cambria" fill="#075E52">Freeze the approved action</text><text fill="#132F3B" x="452" y="341">Perpetual separates provisional </text><text fill="#132F3B" x="452" y="368">interpretation from a compiled plan </text><text fill="#132F3B" x="452" y="395">and binds approval to the exact </text><text fill="#132F3B" x="452" y="422">outgoing payload. Clarification or </text><text fill="#132F3B" x="452" y="449">refusal can be correct outcomes. </text><text fill="#132F3B" x="452" y="476">Changes to a client reply must not </text><text fill="#132F3B" x="452" y="503">silently rewrite the approved </text><text fill="#132F3B" x="452" y="530">parent plan or inherit permission </text><text fill="#132F3B" x="452" y="557">for a different action.</text></g><g id="analysis-3" data-pptx-bounds="856 252 365 413"><text font-size="24" fill="#075E52" font-family="Cambria" x="856" y="280">Distinguish unknown from </text><text font-size="24" fill="#075E52" font-family="Cambria" x="856" y="312">failed</text><text fill="#132F3B" x="856" y="341">A timeout after an external write </text><text fill="#132F3B" x="856" y="368">can leave the outcome unknown. </text><text fill="#132F3B" x="856" y="395">Blind retries can duplicate an </text><text fill="#132F3B" x="856" y="422">action. Route uncertainty to </text><text fill="#132F3B" x="856" y="449">reconciliation or manual review; </text><text fill="#132F3B" x="856" y="476">test interruptions around the </text><text fill="#132F3B" x="856" y="503">side-effect boundary. Vanguard’s </text><text fill="#132F3B" x="856" y="530">separate modernization story </text><text fill="#132F3B" x="856" y="557">reinforces invariants and </text><text fill="#132F3B" x="856" y="584">observability, not unconstrained </text><text fill="#132F3B" x="856" y="611">autonomy.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Arca · Perpetual · Vanguard | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">23 / 37</text></g></svg>