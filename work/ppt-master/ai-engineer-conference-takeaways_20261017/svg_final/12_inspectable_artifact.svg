<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">02 / GROUNDED EVIDENCE</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Keep evidence intact through the exported artifact</text><text font-size="22" fill="#50616A" x="48" y="141">A source-backed chat response is insufficient if the saved workbook, report or presentation becomes </text><text font-size="22" fill="#50616A" x="48" y="170">stale.</text></g><g id="method-sequence" data-pptx-bounds="48 180 1184 56"><rect x="48.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="62.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Source + meaning</text><rect x="347.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="361.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Calculation</text><rect x="647.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="661.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Review</text><rect x="946.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="960.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Current artifact</text></g><g id="analysis-1" data-pptx-bounds="48 252 365 413"><text x="48" y="280" font-size="24" font-family="Cambria" fill="#075E52">Preserve the claim chain</text><text fill="#132F3B" x="48" y="341">OpenAI’s finance presentation </text><text fill="#132F3B" x="48" y="368">connects source passages and tables </text><text fill="#132F3B" x="48" y="395">to charts and reusable artifacts. </text><text fill="#132F3B" x="48" y="422">Carry the material value, period, </text><text fill="#132F3B" x="48" y="449">unit and source into the </text><text fill="#132F3B" x="48" y="476">deliverable. Reconcile the document </text><text fill="#132F3B" x="48" y="503">with the current evidence after a </text><text fill="#132F3B" x="48" y="530">correction rather than treating </text><text fill="#132F3B" x="48" y="557">export as a cosmetic step.</text></g><g id="analysis-2" data-pptx-bounds="452 252 365 413"><text x="452" y="280" font-size="24" font-family="Cambria" fill="#075E52">Check collaborative scope</text><text fill="#132F3B" x="452" y="341">Compound AI describes shared deal </text><text fill="#132F3B" x="452" y="368">threads, an agent inbox and longer </text><text fill="#132F3B" x="452" y="395">artifact work. Permissions must </text><text fill="#132F3B" x="452" y="422">follow participants and source </text><text fill="#132F3B" x="452" y="449">material, not only the connector. </text><text fill="#132F3B" x="452" y="476">Inspect workbook depth, file </text><text fill="#132F3B" x="452" y="503">coverage and final fidelity </text><text fill="#132F3B" x="452" y="530">separately; vendor architecture is </text><text fill="#132F3B" x="452" y="557">not independently verified Office </text><text fill="#132F3B" x="452" y="584">parity.</text></g><g id="analysis-3" data-pptx-bounds="856 252 365 413"><text font-size="24" fill="#075E52" font-family="Cambria" x="856" y="280">Review the current saved </text><text font-size="24" fill="#075E52" font-family="Cambria" x="856" y="312">artifact</text><text fill="#132F3B" x="856" y="341">Use a write–render–check–fix loop </text><text fill="#132F3B" x="856" y="368">and inspect again after the final </text><text fill="#132F3B" x="856" y="395">edit. Our acceptance contract </text><text fill="#132F3B" x="856" y="422">checks the actual report the team </text><text fill="#132F3B" x="856" y="449">will share, including stale </text><text fill="#132F3B" x="856" y="476">sources, truncated tables and </text><text fill="#132F3B" x="856" y="503">missing caveats. Passing code or an </text><text fill="#132F3B" x="856" y="530">older preview cannot establish that </text><text fill="#132F3B" x="856" y="557">the current artifact is usable.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: OpenAI · Compound AI | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">12 / 37</text></g></svg>