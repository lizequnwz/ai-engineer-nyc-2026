<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7" />
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#8B411C">04 / SYNTHETIC REVIEW PACKET — FICTIONAL CLIENT A</text><text x="48" y="98" font-family="Cambria" font-size="36">A useful draft does not grant authority to act</text><text x="48" y="143" font-size="22">Authorized facts → agent preparation → professional judgment → separately permitted execution</text></g>
<g id="fictional-arithmetic" data-pptx-bounds="48 184 1184 147"><rect x="48" y="184" width="1184" height="147" fill="#102E3A" /><text x="72" y="218" font-size="16" fill="#D5EF8C">ANNUAL USD / ALL VALUES INVENTED</text><text x="72" y="272" font-size="24" font-family="Cambria" fill="#FFFDF7">Income $120,000 − recorded expenses $84,000 = arithmetic difference $36,000</text><text x="72" y="311" fill="#E7F0EA">This is not disposable capacity, an insurance need or a suitability finding.</text></g>
<g id="prepare" data-pptx-bounds="48 371 360 264" fill="#132F3B"><text x="48" y="402" font-size="24" font-family="Cambria" fill="#075E52">Make the draft reviewable</text><text x="48" y="451">Expose inputs, calculations,</text><text x="48" y="479">missing facts, assumptions and</text><text x="48" y="507">proposed conclusions.</text><text x="48" y="565">Subtraction alone cannot support</text><text x="48" y="593">a recommendation. Missing</text><text x="48" y="621">information stays explicit.</text></g>
<g id="professional-review" data-pptx-bounds="440 371 360 264" fill="#132F3B"><text x="440" y="402" font-size="24" font-family="Cambria" fill="#075E52">Make review a decision</text><text x="440" y="451">Range describes parallel drafting</text><text x="440" y="479">while a planner serves another</text><text x="440" y="507">client, followed by adjustment.</text><text x="440" y="565">Measure accepted work after</text><text x="440" y="593">corrections, not the number</text><text x="440" y="621">of generated drafts.</text></g>
<g id="execution-authority" data-pptx-bounds="832 371 400 264" fill="#132F3B"><text x="832" y="402" font-size="24" font-family="Cambria" fill="#075E52">Enforce execution separately</text><text x="832" y="451">Wise’s program separates proposals</text><text x="832" y="479">from authority. Draft review does not</text><text x="832" y="507">authorize a send or transaction.</text><text x="832" y="565">A service checks user/case/action</text><text x="832" y="593">permission and records who</text><text x="832" y="621">approved what.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 670 1184 30" font-size="12" fill="#50616A"><text x="48" y="688">Sources: Range notes and Wise agenda. Proposed workflow, not a disclosed Range architecture or financial-advice result.</text><text x="1232" y="688" text-anchor="end">20 / 37</text></g></svg>