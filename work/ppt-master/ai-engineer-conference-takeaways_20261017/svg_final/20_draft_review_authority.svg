<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">04 / CONTROLLED WORKFLOWS</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Let agents iterate inside explicitly gated stages</text><text x="48" y="141" font-size="22" fill="#50616A">Coinbase’s framework places bounded draft/check/refine loops inside a forward-moving policy workflow.</text></g><g id="synthetic-draft" data-pptx-bounds="48 180 1184 56"><rect x="48" y="180" width="1184" height="56" fill="#E7F0EA" /><text x="66" y="215" fill="#075E52">Invented draft: $120k income − $84k expenses = $36k arithmetic difference; not suitability or permission.</text></g><g id="analysis-1" data-pptx-bounds="48 254 365 411"><text x="48" y="282" font-size="24" font-family="Cambria" fill="#075E52">Define the stage contract</text><text fill="#132F3B" x="48" y="343">Specify the allowed inputs, </text><text fill="#132F3B" x="48" y="370">checkable output, iteration budget </text><text fill="#132F3B" x="48" y="397">and human takeover condition. The </text><text fill="#132F3B" x="48" y="424">loop can improve a draft while the </text><text fill="#132F3B" x="48" y="451">outer workflow waits for the </text><text fill="#132F3B" x="48" y="478">required acceptance or approval. </text><text fill="#132F3B" x="48" y="505">Faster generation can shift the </text><text fill="#132F3B" x="48" y="532">bottleneck to review rather than </text><text fill="#132F3B" x="48" y="559">remove it.</text></g><g id="analysis-2" data-pptx-bounds="452 254 365 411"><text font-size="24" fill="#075E52" font-family="Cambria" x="452" y="282">Keep professional judgment </text><text font-size="24" fill="#075E52" font-family="Cambria" x="452" y="314">visible</text><text fill="#132F3B" x="452" y="343">The invented annual packet below </text><text fill="#132F3B" x="452" y="370">subtracts $84k recorded expenses </text><text fill="#132F3B" x="452" y="397">from $120k income: $36k is only an </text><text fill="#132F3B" x="452" y="424">arithmetic difference. It </text><text fill="#132F3B" x="452" y="451">establishes neither disposable </text><text fill="#132F3B" x="452" y="478">capacity nor suitability. Review </text><text fill="#132F3B" x="452" y="505">the facts, gaps, assumptions and </text><text fill="#132F3B" x="452" y="532">conclusions before the work can be </text><text fill="#132F3B" x="452" y="559">considered accepted.</text></g><g id="analysis-3" data-pptx-bounds="856 254 365 411"><text font-size="24" fill="#075E52" font-family="Cambria" x="856" y="282">Separate review from </text><text font-size="24" fill="#075E52" font-family="Cambria" x="856" y="314">permission</text><text fill="#132F3B" x="856" y="343">Range preserves planner review; </text><text fill="#132F3B" x="856" y="370">Perpetual binds approval to an </text><text fill="#132F3B" x="856" y="397">exact payload. Accepting a draft is </text><text fill="#132F3B" x="856" y="424">not permission to send or transact. </text><text fill="#132F3B" x="856" y="451">A separate enforcing boundary </text><text fill="#132F3B" x="856" y="478">checks user, case, resource and </text><text fill="#132F3B" x="856" y="505">action, and retains the approval </text><text fill="#132F3B" x="856" y="532">and outcome evidence.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Coinbase · Range · Perpetual | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">20 / 37</text></g></svg>