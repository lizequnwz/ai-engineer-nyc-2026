<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7" />
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">01 / A LADDER OF CLAIMS</text><text x="48" y="98" font-family="Cambria" font-size="36">Adoption is only the first rung of business value</text><text x="48" y="143" font-size="22">Each stronger claim requires a different comparison and additional evidence.</text></g>
<g id="value-ladder" data-pptx-bounds="48 190 1184 189">
<g><rect x="48" y="190" width="260" height="189" fill="#E7F0EA" /><text x="68" y="229" font-family="Cambria" font-size="24" fill="#075E52">1 / Adoption</text><text fill="#132F3B" x="68" y="281">Who uses it, for which</text><text fill="#132F3B" x="68" y="309">tasks and cohorts?</text></g>
<g id="p06-use-to-work" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="319 221 24 42" fill="#075E52" stroke="none"><path d="M 319 221 L 331 221 L 343 242 L 331 263 L 319 263 L 331 242 Z" /></g>
<g><rect x="356" y="190" width="260" height="189" fill="#E7F0EA" /><text x="376" y="229" font-family="Cambria" font-size="24" fill="#075E52">2 / Accepted work</text><text fill="#132F3B" x="376" y="281">Quality, critical failures</text><text fill="#132F3B" x="376" y="309">and reviewer effort.</text></g>
<g id="p06-work-to-process" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="627 221 24 42" fill="#075E52" stroke="none"><path d="M 627 221 L 639 221 L 651 242 L 639 263 L 627 263 L 639 242 Z" /></g>
<g><rect x="664" y="190" width="260" height="189" fill="#E7F0EA" /><text x="684" y="229" font-family="Cambria" font-size="24" fill="#075E52">3 / Process change</text><text fill="#132F3B" x="684" y="281">Time, throughput,</text><text fill="#132F3B" x="684" y="309">capacity and reliability.</text></g>
<g id="p06-process-to-value" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="935 221 24 42" fill="#075E52" stroke="none"><path d="M 935 221 L 947 221 L 959 242 L 947 263 L 935 263 L 947 242 Z" /></g>
<g><rect x="972" y="190" width="260" height="189" fill="#102E3A" /><text font-family="Cambria" font-size="24" fill="#D5EF8C" x="992" y="229">4 / Attributable</text><text font-family="Cambria" font-size="24" fill="#D5EF8C" x="992" y="260">value</text><text fill="#FFFDF7" x="992" y="313">Credible alternative,</text><text fill="#FFFDF7" x="992" y="341">full cost and uncertainty.</text></g></g>
<g id="credible-alternative" data-pptx-bounds="48 413 1184 99" fill="#132F3B"><text x="48" y="442">Contour described roughly three months of AI/non-AI workflow tracking. No random assignment,</text><text x="48" y="470">controls or causal alpha estimate was captured. Ask what would have happened otherwise, at what</text><text x="48" y="498">quality, effort and timing; the reported window is not a universal ROI-validation period.</text></g>
<g id="point-in-time" data-pptx-bounds="48 544 1184 96" fill="#132F3B"><text x="48" y="573">Preserve information available when an idea was generated, its reasoning, reviewer response and decision.</text><text x="48" y="601">This prevents hindsight from rewriting success. Report process improvement separately from returns</text><text x="48" y="629">affected by markets, selection and other drivers; high adoption can still coexist with heavy rework.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 670 1184 30" font-size="12" fill="#50616A"><text x="48" y="688">Source: Contour attendee account. Ladder and measurement requirements are our proposed framework.</text><text x="1232" y="688" text-anchor="end">06 / 37</text></g></svg>