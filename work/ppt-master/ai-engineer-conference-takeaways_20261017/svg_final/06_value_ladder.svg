<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">01 / FINANCE STRATEGY</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Process measures precede claims of financial impact</text><text x="48" y="141" font-size="22" fill="#50616A">Adoption, useful output, process change and financial outcomes require different evidence.</text></g><g id="method-sequence" data-pptx-bounds="48 180 1184 56"><rect x="48.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="62.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Use</text><rect x="347.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="361.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Accepted work</text><rect x="647.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="661.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Process change</text><rect x="946.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="960.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Attributable value</text></g><g id="analysis-1" data-pptx-bounds="48 252 365 413"><text x="48" y="280" font-size="24" font-family="Cambria" fill="#075E52">Define useful output first</text><text fill="#132F3B" x="48" y="341">Contour’s official release </text><text fill="#132F3B" x="48" y="368">describes live research comparisons </text><text fill="#132F3B" x="48" y="395">and cost per useful insight, </text><text fill="#132F3B" x="48" y="422">including repair effort. Define </text><text fill="#132F3B" x="48" y="449">useful insight, eligible work and </text><text fill="#132F3B" x="48" y="476">the comparison before looking at </text><text fill="#132F3B" x="48" y="503">outcomes. Its description does not </text><text fill="#132F3B" x="48" y="530">disclose enough assignment, sample </text><text fill="#132F3B" x="48" y="557">or control detail to establish </text><text fill="#132F3B" x="48" y="584">causal alpha.</text></g><g id="analysis-2" data-pptx-bounds="452 252 365 413"><text x="452" y="280" font-size="24" font-family="Cambria" fill="#075E52">Keep the decision record</text><text fill="#132F3B" x="452" y="341">Preserve what was known when an </text><text fill="#132F3B" x="452" y="368">idea was proposed, its sources, </text><text fill="#132F3B" x="452" y="395">reasoning, reviewer response and </text><text fill="#132F3B" x="452" y="422">subsequent decision. Agents </text><text fill="#132F3B" x="452" y="449">revisiting an old idea may improve </text><text fill="#132F3B" x="452" y="476">timing or attention; a later </text><text fill="#132F3B" x="452" y="503">profitable position still depends </text><text fill="#132F3B" x="452" y="530">on markets, selection, sizing and </text><text fill="#132F3B" x="452" y="557">human action.</text></g><g id="analysis-3" data-pptx-bounds="856 252 365 413"><text x="856" y="280" font-size="24" font-family="Cambria" fill="#075E52">Inspect the denominator</text><text fill="#132F3B" x="856" y="341">Jellyfish includes human salary and </text><text fill="#132F3B" x="856" y="368">AI spend per merged PR, and </text><text fill="#132F3B" x="856" y="395">inspects reverts/change size. That </text><text fill="#132F3B" x="856" y="422">observational engineering proxy </text><text fill="#132F3B" x="856" y="449">suggests measuring accepted work </text><text fill="#132F3B" x="856" y="476">with quality counterchecks. It does </text><text fill="#132F3B" x="856" y="503">not establish that spending more </text><text fill="#132F3B" x="856" y="530">causes improvement or that a merged </text><text fill="#132F3B" x="856" y="557">PR equals business value.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Contour Asset Management · Jellyfish | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">06 / 37</text></g></svg>