<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="section"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#102E3A" />
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#FFFDF7"><text x="48" y="55" font-size="16" fill="#D5EF8C">02 / GROUNDED AGENTS</text><text x="48" y="98" font-family="Cambria" font-size="36">Ground the question in time, meaning and access</text><text x="48" y="143" font-size="22" fill="#E7F0EA">The evidence boundary precedes a persuasive answer.</text></g>
<g id="evidence-path" data-pptx-bounds="48 195 1184 170"><line x1="66" y1="211" x2="1214" y2="211" stroke="#50616A" stroke-width="2" /><text x="48" y="254" font-size="24" font-family="Cambria" fill="#D5EF8C">1 / Request</text><text font-size="18" fill="#FFFDF7" x="48" y="302">Entity, task,</text><text font-size="18" fill="#FFFDF7" x="48" y="328">information cutoff.</text><text x="291" y="254" font-size="24" font-family="Cambria" fill="#D5EF8C">2 / Boundary</text><text font-size="18" fill="#FFFDF7" x="291" y="302">Allowed sources,</text><text font-size="18" fill="#FFFDF7" x="291" y="328">access/effective time.</text><text x="534" y="254" font-size="24" font-family="Cambria" fill="#D5EF8C">3 / Meaning</text><text font-size="18" fill="#FFFDF7" x="534" y="302">Ontology, metrics,</text><text font-size="18" fill="#FFFDF7" x="534" y="328">definitions/versions.</text><text x="777" y="254" font-size="24" font-family="Cambria" fill="#D5EF8C">4 / Context</text><text font-size="18" fill="#FFFDF7" x="777" y="302">Relevant evidence,</text><text font-size="18" fill="#FFFDF7" x="777" y="328">conflicts and gaps.</text><text x="1020" y="254" font-size="24" font-family="Cambria" fill="#D5EF8C">5 / Answer</text><text font-size="18" fill="#FFFDF7" x="1020" y="302">Supported claims,</text><text font-size="18" fill="#FFFDF7" x="1020" y="328">explicit uncertainty.</text></g>
<g id="vault" data-pptx-bounds="48 405 360 235" fill="#FFFDF7"><text x="48" y="437" font-size="24" font-family="Cambria" fill="#D5EF8C">Scope the investment question</text><text x="48" y="483">Vault combines internal/external</text><text x="48" y="511">research, news and transcripts.</text><text x="48" y="539">Market, country, concept and time</text><text x="48" y="567">organize the knowledge; the</text><text x="48" y="595">request still defines relevance.</text></g>
<g id="permissions" data-pptx-bounds="440 405 360 235" fill="#FFFDF7"><text x="440" y="437" font-size="24" font-family="Cambria" fill="#D5EF8C">Enforce retrieval access</text><text x="440" y="483">The separate Bridgewater /</text><text x="440" y="511">turbopuffer program case</text><text x="440" y="539">describes retrieval permissions.</text><text x="440" y="567">Test current-user access and</text><text x="440" y="595">revocation, not credentials alone.</text></g>
<g id="definitions" data-pptx-bounds="832 405 400 235" fill="#FFFDF7"><text x="832" y="437" font-size="24" font-family="Cambria" fill="#D5EF8C">Carry business meaning</text><text x="832" y="483">Use the intended metric, entity,</text><text x="832" y="511">period and source version.</text><text x="832" y="539">Surface conflicts and missing facts.</text><text x="832" y="567">Reported Vault/PAT production</text><text x="832" y="595">use is not an independent result.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32" font-size="12" fill="#E7F0EA"><text x="48" y="686">Sources: Vault notes; separate permissions session is agenda-only. Path is proposed synthesis, not a disclosed complete company architecture.</text><text x="1232" y="686" text-anchor="end">08 / 37</text></g></svg>