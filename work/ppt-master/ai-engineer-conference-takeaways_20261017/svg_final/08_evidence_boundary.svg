<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">02 / GROUNDED EVIDENCE</text><text x="48" y="97" font-size="36" fill="#102E3A" font-family="Cambria">A changing belief needs a dated evidence trail</text><text fill="#50616A" font-size="22" x="48" y="141">Citadel Securities distinguishes reported status from evidence-supported status and preserves the </text><text fill="#50616A" font-size="22" x="48" y="170">reasons for change.</text></g><g id="earlier-record" data-pptx-bounds="48 184 332 150"><rect x="48" y="184" width="332" height="150" fill="#E7F0EA" /><text x="66" y="213" fill="#075E52" font-weight="bold">Earlier / monthly deck</text><text fill="#132F3B" x="66" y="254">Reported project status: </text><text fill="#132F3B" x="66" y="280">green.</text></g><g id="new-evidence" data-pptx-bounds="396 184 374 150"><rect x="396" y="184" width="374" height="150" fill="#E7F0EA" /><text x="414" y="213" fill="#075E52" font-weight="bold">Newer / message or attachment</text><text fill="#132F3B" x="414" y="254">An unresolved dependency changes </text><text fill="#132F3B" x="414" y="280">the assessment.</text></g><g id="retained-history" data-pptx-bounds="786 184 446 186"><rect x="786" y="184" width="446" height="186" fill="#102E3A" /><text x="804" y="213" fill="#D5EF8C" font-weight="bold">Retain both records</text><text fill="#FFFDF7" x="804" y="254">Reported status ≠ evidence-supported </text><text fill="#FFFDF7" x="804" y="280">status. Keep the reason for change.</text></g><g id="source-boundary" data-pptx-bounds="48 357 708 47"><text x="48" y="381" font-size="18" fill="#50616A">Reconstruction of a narrated example; no prediction result is measured.</text></g><g id="lesson-0" data-pptx-bounds="48 430 376 224"><text x="48" y="455" font-size="24" fill="#075E52" font-family="Cambria">Do not overwrite history</text><text fill="#132F3B" x="48" y="497">Attach evidence, source and </text><text fill="#132F3B" x="48" y="523"><tspan>observation time. Earlier snapshots</tspan> </text><text fill="#132F3B" x="48" y="549">must reflect what was knowable then.</text></g><g id="lesson-1" data-pptx-bounds="452 430 376 224"><text x="452" y="455" font-size="24" fill="#075E52" font-family="Cambria">Govern the commit</text><text fill="#132F3B" x="452" y="497">Models propose updates; code and </text><text fill="#132F3B" x="452" y="523"><tspan>people accept corrections. Preserve</tspan> </text><text fill="#132F3B" x="452" y="549">contradictions and aging evidence.</text></g><g id="lesson-2" data-pptx-bounds="856 430 376 224"><text x="856" y="455" font-size="24" fill="#075E52" font-family="Cambria">Missing signal ≠ zero</text><text fill="#132F3B" x="856" y="497">A quiet feed may be a collection </text><text fill="#132F3B" x="856" y="523"><tspan>failure. Track source health and</tspan> </text><text fill="#132F3B" x="856" y="549"><tspan>mark uncertainty before inferring</tspan> </text><text fill="#132F3B" x="856" y="575">progress.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Bridgewater · Citadel Securities | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">08 / 37</text></g></svg>