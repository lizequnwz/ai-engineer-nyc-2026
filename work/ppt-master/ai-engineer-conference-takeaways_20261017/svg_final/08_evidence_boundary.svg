<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">02 / GROUNDED EVIDENCE</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Ground facts and memory in time and access</text><text x="48" y="141" font-size="22" fill="#50616A">Scope the question and keep changing beliefs attached to dated evidence, access and correction history.</text></g><g id="analysis-1" data-pptx-bounds="48 193 365 472"><text x="48" y="221" font-size="24" font-family="Cambria" fill="#075E52">Set the evidence boundary</text><text fill="#132F3B" x="48" y="283">Bridgewater’s Vault organizes </text><text fill="#132F3B" x="48" y="310">research by source, market, </text><text fill="#132F3B" x="48" y="337">country, concept and discussed </text><text fill="#132F3B" x="48" y="364">period. Apply entitlements and time </text><text fill="#132F3B" x="48" y="391">constraints before synthesis. A </text><text fill="#132F3B" x="48" y="418">correct answer to a neighboring </text><text fill="#132F3B" x="48" y="445">period, entity or definition is </text><text fill="#132F3B" x="48" y="472">still a failure of the requested </text><text fill="#132F3B" x="48" y="499">task.</text></g><g id="analysis-2" data-pptx-bounds="452 193 365 472"><text x="452" y="221" font-size="24" font-family="Cambria" fill="#075E52">Preserve changing beliefs</text><text fill="#132F3B" x="452" y="283">Citadel Securities separates </text><text fill="#132F3B" x="452" y="310">reported project status from </text><text fill="#132F3B" x="452" y="337">evidence-based status, keeps </text><text fill="#132F3B" x="452" y="364">historical records, ages claims and </text><text fill="#132F3B" x="452" y="391">compares earlier predictions with </text><text fill="#132F3B" x="452" y="418">later outcomes. Models propose </text><text fill="#132F3B" x="452" y="445">updates; code and people decide </text><text fill="#132F3B" x="452" y="472">what enters the record. This is </text><text fill="#132F3B" x="452" y="499">richer than retrieving the latest </text><text fill="#132F3B" x="452" y="526">matching sentence.</text></g><g id="analysis-3" data-pptx-bounds="856 193 365 472"><text font-size="24" fill="#075E52" font-family="Cambria" x="856" y="221">Treat missing signals </text><text font-size="24" fill="#075E52" font-family="Cambria" x="856" y="253">honestly</text><text fill="#132F3B" x="856" y="283">A quiet source can mean a </text><text fill="#132F3B" x="856" y="310">collection problem rather than </text><text fill="#132F3B" x="856" y="337">inactivity. Preserve last observed </text><text fill="#132F3B" x="856" y="364">time, source health and correction </text><text fill="#132F3B" x="856" y="391">history; unknown is not zero. Our </text><text fill="#132F3B" x="856" y="418">combined evidence contract adds </text><text fill="#132F3B" x="856" y="445">versioned definitions and as-of </text><text fill="#132F3B" x="856" y="472">snapshots, without claiming a </text><text fill="#132F3B" x="856" y="499">single firm implemented every </text><text fill="#132F3B" x="856" y="526">field.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Bridgewater · Citadel Securities | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">08 / 37</text></g></svg>