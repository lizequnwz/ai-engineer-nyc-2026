<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7" />
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">05 / TECHNICAL FLUENCY IN A REAL WORKFLOW</text><text x="48" y="98" font-family="Cambria" font-size="36">Connect domain, system and measurement fluency</text><text x="48" y="143" font-size="22">Develop the responsibilities together; no one must be the sole expert in all five.</text></g>
<g id="five-responsibilities" data-pptx-bounds="48 184 356 450"><rect x="48" y="184" width="356" height="450" fill="#102E3A" /><text x="72" y="225" font-size="16" fill="#D5EF8C">ONE ACCEPTED WORKFLOW</text><text font-family="Cambria" font-size="24" fill="#FFFDF7" x="72" y="288">Domain translation</text><text font-family="Cambria" font-size="24" fill="#FFFDF7" x="72" y="353">Data reasoning</text><text font-family="Cambria" font-size="24" fill="#FFFDF7" x="72" y="418">System design</text><text font-family="Cambria" font-size="24" fill="#FFFDF7" x="72" y="483">Evaluation</text><text font-family="Cambria" font-size="24" fill="#FFFDF7" x="72" y="548">Evidence communication</text></g>
<g id="translate-meaning" data-pptx-bounds="436 184 796 126" fill="#132F3B"><text x="436" y="217" font-size="24" font-family="Cambria" fill="#075E52">Translate expert judgment into reproducible inputs</text><text x="436" y="259">Ask which facts matter, why a step exists and when to clarify.</text><text x="436" y="287">Connect that judgment to entity, period, units, definitions and transformations.</text></g>
<g id="connect-controls-tests" data-pptx-bounds="436 340 796 126" fill="#132F3B"><line x1="436" y1="341" x2="1232" y2="341" stroke="#CBD4D1" /><text x="436" y="376" font-size="24" font-family="Cambria" fill="#075E52">Connect system boundaries to observable tests</text><text x="436" y="418">Draw ownership, allowed actions, state and exceptions. Challenge the</text><text x="436" y="446">workflow and its judge with serious false passes, task success and full cost.</text></g>
<g id="communicate-decision" data-pptx-bounds="436 496 796 138" fill="#132F3B"><line x1="436" y1="497" x2="1232" y2="497" stroke="#CBD4D1" /><text x="436" y="532" font-size="24" font-family="Cambria" fill="#075E52">Explain the evidence-backed decision</text><text x="436" y="574">Describe task, mechanism, comparison, result and uncertainty together.</text><text x="436" y="602">Deployment differs from effectiveness; useful output differs from causal value.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 666 1184 34" font-size="12" fill="#50616A"><text x="48" y="684">Proposed competency framework drawn from the conference mechanisms; not a hiring survey or a firm’s validated career model.</text><text x="1232" y="684" text-anchor="end">25 / 37</text></g></svg>