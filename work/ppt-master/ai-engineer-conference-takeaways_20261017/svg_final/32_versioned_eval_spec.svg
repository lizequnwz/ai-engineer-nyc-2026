<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7" />
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">APPENDIX / COMPACT EVALUATION SPECIFICATION</text><text x="48" y="98" font-family="Cambria" font-size="36">Version the evaluation contract with the decision</text><text x="48" y="143" font-size="22">A judge or rubric change can alter reported quality even when the agent is unchanged.</text></g>
<g id="illustrative-schema" data-pptx-bounds="48 184 560 450"><rect x="48" y="184" width="560" height="450" fill="#102E3A" /><text x="72" y="222" font-size="16" fill="#D5EF8C">ILLUSTRATIVE SCHEMA / NOT A RUNNABLE FRAMEWORK</text><text font-family="Consolas" fill="#FFFDF7" font-size="16" x="72" y="276">task: draft_review_packet </text><text font-family="Consolas" fill="#FFFDF7" font-size="16" x="72" y="310">snapshot: approved_inputs_v1 </text><text font-family="Consolas" fill="#FFFDF7" font-size="16" x="72" y="344">acceptance: reviewed_complete_output </text><text font-family="Consolas" fill="#FFFDF7" font-size="16" x="72" y="378">critical: unauthorized_access, </text><text font-family="Consolas" fill="#FFFDF7" font-size="16" x="72" y="406">          unsupported_number </text><text font-family="Consolas" fill="#FFFDF7" font-size="16" x="72" y="440">cases: common, missing, difficult, regression </text><text font-family="Consolas" fill="#FFFDF7" font-size="16" x="72" y="474">judge: model + rubric + threshold + version </text><text font-family="Consolas" fill="#FFFDF7" font-size="16" x="72" y="508">compare: baseline_vs_candidate </text><text font-family="Consolas" fill="#FFFDF7" font-size="16" x="72" y="542">decision: accountable_owner</text></g>
<g id="permitted-completion" data-pptx-bounds="640 184 592 125" fill="#132F3B"><text x="640" y="217" font-size="24" font-family="Cambria" fill="#075E52">Define the permitted completion</text><text x="640" y="259">Outputs, action limits and clarification/abstention. </text><text x="640" y="287">Unauthorized access fails; correct refusal can succeed.</text></g>
<g id="version-evaluator" data-pptx-bounds="640 340 592 125" fill="#132F3B"><line x1="640" y1="341" x2="1232" y2="341" stroke="#CBD4D1" /><text x="640" y="376" font-size="24" font-family="Cambria" fill="#075E52">Version the evaluator, not only the system</text><text x="640" y="418">Retain judge model, prompt, rubric and threshold. </text><text x="640" y="446">Recalibrate on reviewed cases when they or users change.</text></g>
<g id="decision-specific-evidence" data-pptx-bounds="640 496 592 146" fill="#132F3B"><line x1="640" y1="497" x2="1232" y2="497" stroke="#CBD4D1" /><text x="640" y="532" font-size="24" font-family="Cambria" fill="#075E52">Select evidence for the decision</text><text x="640" y="574">Model choice, less review and greater execution authority </text><text x="640" y="602">require different evidence. Finite tests support a scoped </text><text x="640" y="630">judgment with known limits, not proof of zero failure.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 667 1184 33" font-size="12" fill="#50616A"><text x="48" y="685">Proposed schema informed by Ramp and the system-failure discussion. Adapt the contract to the actual task and consequence.</text><text x="1232" y="685" text-anchor="end">32 / 37</text></g></svg>