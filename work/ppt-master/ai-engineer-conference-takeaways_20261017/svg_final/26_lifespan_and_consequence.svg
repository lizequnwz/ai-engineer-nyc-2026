<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">05 / AI ENGINEER GROWTH</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Match rigor to consequences and dependencies</text><text x="48" y="141" font-size="22" fill="#50616A">Failure consequences, replacement cost, dependencies and maintenance burden define the decision.</text></g><g id="analysis-1" data-pptx-bounds="48 193 365 472"><text x="48" y="221" font-size="24" font-family="Cambria" fill="#075E52">Reassess as the tool grows</text><text fill="#132F3B" x="48" y="283">A one-use helper can become a </text><text fill="#132F3B" x="48" y="310">shared process with downstream </text><text fill="#132F3B" x="48" y="337">dependents. Revisit who relies on </text><text fill="#132F3B" x="48" y="364">it, which failures matter and how </text><text fill="#132F3B" x="48" y="391">recovery works. Isolation and </text><text fill="#132F3B" x="48" y="418">limited scope can reduce exposure, </text><text fill="#132F3B" x="48" y="445">but a label such as prototype or </text><text fill="#132F3B" x="48" y="472">temporary is not an enforcing </text><text fill="#132F3B" x="48" y="499">control.</text></g><g id="analysis-2" data-pptx-bounds="452 193 365 472"><text x="452" y="221" font-size="24" font-family="Cambria" fill="#075E52">Invest in the cheap safe path</text><text fill="#132F3B" x="452" y="283">Provide standard choices, test </text><text fill="#132F3B" x="452" y="310">fixtures/fakes and quick low-noise </text><text fill="#132F3B" x="452" y="337">feedback. Make it easier to create </text><text fill="#132F3B" x="452" y="364">a complete working slice with </text><text fill="#132F3B" x="452" y="391">checks than to postpone them. </text><text fill="#132F3B" x="452" y="418">Shared verification infrastructure </text><text fill="#132F3B" x="452" y="445">compounds across tasks and allows </text><text fill="#132F3B" x="452" y="472">practitioners to focus on the </text><text fill="#132F3B" x="452" y="499">remaining judgment.</text></g><g id="analysis-3" data-pptx-bounds="856 193 365 472"><text font-size="24" fill="#075E52" font-family="Cambria" x="856" y="221">Apply the same standard to </text><text font-size="24" fill="#075E52" font-family="Cambria" x="856" y="253">artifacts</text><text fill="#132F3B" x="856" y="283">For a report or presentation, </text><text fill="#132F3B" x="856" y="310">acceptance includes the current </text><text fill="#132F3B" x="856" y="337">saved output, its evidence and </text><text fill="#132F3B" x="856" y="364">readability. For a financial </text><text fill="#132F3B" x="856" y="391">action, it includes authorization </text><text fill="#132F3B" x="856" y="418">and recovery. Match the check to </text><text fill="#132F3B" x="856" y="445">the actual consequence; neither </text><text fill="#132F3B" x="856" y="472">code generation speed nor another </text><text fill="#132F3B" x="856" y="499">agent’s confidence resolves that </text><text fill="#132F3B" x="856" y="526">decision.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Capital One · Sonar | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">26 / 37</text></g></svg>