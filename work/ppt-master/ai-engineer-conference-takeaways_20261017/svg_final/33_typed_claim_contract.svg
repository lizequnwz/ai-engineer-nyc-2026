<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7" />
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#8B411C">APPENDIX / SYNTHETIC TYPED CLAIM</text><text x="48" y="98" font-family="Cambria" font-size="36">Keep the typed claim attached to its derivation</text><text x="48" y="143" font-size="22">AsterCo’s growth value is a ratio; its revenue inputs are USD millions.</text></g>
<g id="typed-claim" data-pptx-bounds="48 184 560 450"><g id="p33-typed-claim-document" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="foldedCorner" data-pptx-frame="48 184 560 450" fill="#E7F0EA" stroke="none"><path d="M 48 184 L 608 184 L 608 559 L 533 634 L 48 634 Z" /><path d="M 533 634 L 548 574 L 608 559 Z" fill="#BDC5C0" /><path d="M 533 634 L 548 574 L 608 559 L 533 634 L 48 634 L 48 184 L 608 184 L 608 559" fill="none" /></g><text x="72" y="222" font-size="16" fill="#075E52">ALL ENTITIES, VALUES AND DOCUMENTS INVENTED</text><text font-family="Consolas" fill="#132F3B" font-size="16" x="72" y="280">entity: AsterCo </text><text font-family="Consolas" fill="#132F3B" font-size="16" x="72" y="314">metric: annual_revenue_growth </text><text font-family="Consolas" fill="#132F3B" font-size="16" x="72" y="348">period: FY2025 </text><text font-family="Consolas" fill="#132F3B" font-size="16" x="72" y="382">unit: ratio </text><text font-family="Consolas" fill="#132F3B" font-size="16" x="72" y="416">value: 0.20 </text><text font-family="Consolas" fill="#132F3B" font-size="16" x="72" y="450">inputs: D1=100; D3=120  # USD_m </text><text font-family="Consolas" fill="#132F3B" font-size="16" x="72" y="484">as_of: 2026-03-01 </text><text font-family="Consolas" fill="#132F3B" font-size="16" x="72" y="518">calculation: (120 - 100) / 100</text></g>
<g id="metric-unit" data-pptx-bounds="640 184 592 125" fill="#132F3B"><text x="640" y="217" font-size="24" font-family="Cambria" fill="#075E52">0.20 growth ≠ USD120m revenue</text><text x="640" y="259">Preserve entity, metric definition, period and unit. </text><text x="640" y="287">A document match cannot establish a valid comparison.</text></g>
<g id="source-identity" data-pptx-bounds="640 340 592 125" fill="#132F3B"><line x1="640" y1="341" x2="1232" y2="341" stroke="#CBD4D1" /><text x="640" y="376" font-size="24" font-family="Cambria" fill="#075E52">Retain source identity and eligibility</text><text x="640" y="418">Document, passage, version and available-as-of time. </text><text x="640" y="446">Publication, reporting period and access are distinct.</text></g>
<g id="correction-propagation" data-pptx-bounds="640 496 592 146" fill="#132F3B"><line x1="640" y1="497" x2="1232" y2="497" stroke="#CBD4D1" /><text x="640" y="532" font-size="24" font-family="Cambria" fill="#075E52">Propagate corrections through artifacts</text><text x="640" y="574">Recompute dependent claims, charts and tables; </text><text x="640" y="602">retain earlier values and change reasons. Verify export </text><text x="640" y="630">has preserved units, periods and evidence links.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 667 1184 33" font-size="12" fill="#50616A"><text x="48" y="685">Proposed contract informed by Kepler and Bridgewater, not verified coverage of either implementation. All AsterCo data is synthetic.</text><text x="1232" y="685" text-anchor="end">33 / 37</text></g></svg>