<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">REFERENCE / RECORDING REVIEW</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">The recordings clarify methods and expose open questions</text><text x="48" y="141" font-size="22" fill="#50616A">Keep clarified mechanisms, separate talk editions and specific unanswered questions visible.</text></g><g id="analysis-1" data-pptx-bounds="48 195 365 470"><text x="48" y="223" font-size="24" font-family="Cambria" fill="#075E52">Clarified</text><text fill="#132F3B" x="48" y="285">Bridgewater’s metric is </text><text fill="#132F3B" x="48" y="312">precision@10 and its product </text><text fill="#132F3B" x="48" y="339">direction is proactive </text><text fill="#132F3B" x="48" y="366">participation. Range confirms an </text><text fill="#132F3B" x="48" y="393">owner and separate reviewer. Kepler </text><text fill="#132F3B" x="48" y="420">retains final post-processing. </text><text fill="#132F3B" x="48" y="447">Vanguard’s </text><text fill="#132F3B" x="48" y="474">seven-days-to-fifteen-minutes title </text><text fill="#132F3B" x="48" y="501">concerns mainframe-code research, </text><text fill="#132F3B" x="48" y="528">not investment research.</text></g><g id="analysis-2" data-pptx-bounds="452 195 365 470"><text x="452" y="223" font-size="24" font-family="Cambria" fill="#075E52">Keep editions separate</text><text fill="#132F3B" x="452" y="285">Ryan Stevens’s written Ramp </text><text fill="#132F3B" x="452" y="312">evaluation account differs from </text><text fill="#132F3B" x="452" y="339">Alexander Shevchenko’s keynote. </text><text fill="#132F3B" x="452" y="366">Kepler’s attended breakout and </text><text fill="#132F3B" x="452" y="393">next-day follow-up are different </text><text fill="#132F3B" x="452" y="420">editions. Range’s online index </text><text fill="#132F3B" x="452" y="447">label is October 13; attended notes </text><text fill="#132F3B" x="452" y="474">remain Day 2. An index label is not </text><text fill="#132F3B" x="452" y="501">a filming date.</text></g><g id="analysis-3" data-pptx-bounds="856 195 365 470"><text x="856" y="223" font-size="24" font-family="Cambria" fill="#075E52">Still open</text><text fill="#132F3B" x="856" y="285">Banking affiliation and </text><text fill="#132F3B" x="856" y="312">“roundedness,” provider spelling, </text><text fill="#132F3B" x="856" y="339">exact breakout retrieval defaults </text><text fill="#132F3B" x="856" y="366">and several result denominators </text><text fill="#132F3B" x="856" y="393">remain unresolved. Do not turn the </text><text fill="#132F3B" x="856" y="420">confidence metaphor or incident </text><text fill="#132F3B" x="856" y="447">coverage into a calibrated </text><text fill="#132F3B" x="856" y="474">assurance or incidence estimate. </text><text fill="#132F3B" x="856" y="501">Ask for the workload, population </text><text fill="#132F3B" x="856" y="528">and comparison needed.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: AIE NYC recordings, original notes, primary written follow-up and dated disclosures | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">36 / 37</text></g></svg>