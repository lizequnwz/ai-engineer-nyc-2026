<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7" />
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">APPENDIX / PRODUCTIVE UNCERTAINTY</text><text x="48" y="98" font-family="Cambria" font-size="36">Turn unknowns into engineering questions</text><text x="48" y="143" font-size="22">A useful follow-up identifies the inspection or test needed to support a stronger claim.</text></g>
<g id="checker-questions" data-pptx-bounds="48 184 360 268" fill="#132F3B"><text x="48" y="219" font-size="24" font-family="Cambria" fill="#075E52">What does the checker miss?</text><text x="48" y="267">For citation checks, judges or</text><text x="48" y="295">approval triage: which serious errors</text><text x="48" y="323">pass? What happens when support</text><text x="48" y="351">fails? Independent components can</text><text x="48" y="379">share blind spots. Request failures</text><text x="48" y="407">and adjudication procedures.</text></g>
<g id="measurement-questions" data-pptx-bounds="440 184 360 268" fill="#132F3B"><text x="440" y="219" font-size="24" font-family="Cambria" fill="#075E52">What does the result measure?</text><text x="440" y="267">Request baseline, task population;</text><text x="440" y="295">exclusions, sample, uncertainty</text><text x="440" y="323">and full human effort.</text><text x="440" y="351">Distinguish adoption, pilot,</text><text x="440" y="379">estimated opportunity and</text><text x="440" y="407">realized outcome. Retain disclosure</text><text x="440" y="435">dates when comparing firms.</text></g>
<g id="scope-questions" data-pptx-bounds="832 184 400 268" fill="#132F3B"><text x="832" y="219" font-size="24" font-family="Cambria" fill="#075E52">What scope was demonstrated?</text><text x="832" y="267">Clarify production scope, entitlements,</text><text x="832" y="295">model/data versions and stop conditions.</text><text x="832" y="323">A company affiliation does not establish</text><text x="832" y="351">deployment of every discussed technique.</text><text x="832" y="379">Mechanism and reported scale do not</text><text x="832" y="407">by themselves establish effectiveness.</text></g>
<g id="unresolved-source-details" data-pptx-bounds="48 488 1184 168"><rect x="48" y="488" width="1184" height="168" fill="#F1F4EE" /><text font-size="18" fill="#50616A" x="72" y="520">Keep unresolved terms explicit: “crunchable”, “roundedness”, reversed reactive/proactive wording and Comet/NatWest.</text><text font-size="18" fill="#50616A" x="72" y="546">Sonar’s roughly 50K-line example lacks model, workload and benchmark conditions; its confidence product is conceptual.</text><text font-size="18" fill="#50616A" x="72" y="572">Kepler’s rough retrieval settings are incomplete, so do not turn them into defaults. The failure study’s expected-loss</text><text font-size="18" fill="#50616A" x="72" y="598">product lacks defined events, conditioning and severity units; incident rankings and growth claims lack denominators</text><text font-size="18" fill="#50616A" x="72" y="624">and methods. These are clarification topics, not established thresholds, prevalence or expected-loss estimates.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 677 1184 23" font-size="12" fill="#50616A"><text x="48" y="695">Source context retained from OpenAI, Bridgewater, Kepler, Sonar, failure-study and banking notes.</text><text x="1232" y="695" text-anchor="end">36 / 37</text></g></svg>