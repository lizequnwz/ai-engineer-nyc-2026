<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">TAKEAWAYS &amp; DISCUSSION</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Agree acceptance, preserve evidence, test the repair</text><text x="48" y="141" font-size="22" fill="#50616A">Prepare valuable work, retain inspectable evidence and make the next change an accountable experiment.</text></g><g id="analysis-1" data-pptx-bounds="48 193 365 472"><text font-family="Cambria" fill="#075E52" font-size="24" x="48" y="221">Agree what completed work </text><text font-family="Cambria" fill="#075E52" font-size="24" x="48" y="253">means</text><text fill="#132F3B" x="48" y="283">Name the practitioner, accepted </text><text fill="#132F3B" x="48" y="310">work product and critical limits. </text><text fill="#132F3B" x="48" y="337">Compare quality, coverage and total </text><text fill="#132F3B" x="48" y="364">human effort against a credible </text><text fill="#132F3B" x="48" y="391">baseline. Preparation time, tool </text><text fill="#132F3B" x="48" y="418">volume and rollout scope answer </text><text fill="#132F3B" x="48" y="445">useful but different questions from </text><text fill="#132F3B" x="48" y="472">financial impact.</text></g><g id="analysis-2" data-pptx-bounds="452 193 365 472"><text x="452" y="221" font-size="24" font-family="Cambria" fill="#075E52">Preserve the evidence chain</text><text fill="#132F3B" x="452" y="283">Carry entity, meaning, period, </text><text fill="#132F3B" x="452" y="310">source version, access and </text><text fill="#132F3B" x="452" y="337">calculation through the final </text><text fill="#132F3B" x="452" y="364">artifact. Give memory a correction </text><text fill="#132F3B" x="452" y="391">and aging policy. Keep professional </text><text fill="#132F3B" x="452" y="418">review and permission to act as </text><text fill="#132F3B" x="452" y="445">separate events, with durable </text><text fill="#132F3B" x="452" y="472">workflow state between them.</text></g><g id="analysis-3" data-pptx-bounds="856 193 365 472"><text x="856" y="221" font-size="24" font-family="Cambria" fill="#075E52">Make the next change a test</text><text fill="#132F3B" x="856" y="283">Choose one failure mechanism and a </text><text fill="#132F3B" x="856" y="310">bounded comparison. Score final </text><text fill="#132F3B" x="856" y="337">output, consequential behavior and </text><text fill="#132F3B" x="856" y="364">authority; inspect paired </text><text fill="#132F3B" x="856" y="391">regressions. Preserve the case and </text><text fill="#132F3B" x="856" y="418">correction so improvement becomes a </text><text fill="#132F3B" x="856" y="445">team asset rather than a lesson one </text><text fill="#132F3B" x="856" y="472">person must rediscover.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Range · Kepler · Basis · Blackstone / Norm.ai · Citadel Securities | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">28 / 37</text></g></svg>