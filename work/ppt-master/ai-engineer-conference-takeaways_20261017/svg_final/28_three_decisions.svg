<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="ending"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7" />
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">CONFERENCE REPORT-BACK / THE PRACTICAL RETURN</text><text x="48" y="98" font-family="Cambria" font-size="36">Return with three decisions and one comparison</text><text x="48" y="143" font-size="22">Choose the work, boundary and evidence before the next experiment.</text></g>
<g id="work" data-pptx-bounds="48 198 360 277" fill="#132F3B"><text x="48" y="236" font-size="36" font-family="Cambria" fill="#075E52">Work</text><text font-family="Cambria" font-size="24" x="48" y="278">Whose accepted output</text><text font-family="Cambria" font-size="24" x="48" y="308">matters?</text><text x="48" y="342">Name the bottleneck and the person</text><text x="48" y="370">whose work should improve.</text><text x="48" y="398">Choose a research insight, reviewed</text><text x="48" y="426">planning analysis or evidence-backed</text><text x="48" y="454">artifact before discussing tools.</text></g>
<g id="boundary" data-pptx-bounds="440 198 360 277" fill="#132F3B"><text x="440" y="236" font-size="36" font-family="Cambria" fill="#075E52">Boundary</text><text font-family="Cambria" font-size="24" x="440" y="278">What may the system</text><text font-family="Cambria" font-size="24" x="440" y="308">use and do?</text><text x="440" y="342">Sources, information cutoff,</text><text x="440" y="370">calculations, actions and retained</text><text x="440" y="398">human judgments. Define blockers</text><text x="440" y="426">and how missing evidence changes</text><text x="440" y="454">the task.</text></g>
<g id="evidence" data-pptx-bounds="832 198 400 277" fill="#132F3B"><text x="832" y="236" font-size="36" font-family="Cambria" fill="#075E52">Evidence</text><text x="832" y="289" font-size="24" font-family="Cambria">What would change the decision?</text><text x="832" y="342">Compare candidate and existing process</text><text x="832" y="370">on equivalent work and agreed</text><text x="832" y="398">acceptance. Include critical failures,</text><text x="832" y="426">all attempts, review effort and cost.</text></g>
<g id="comparison-decision" data-pptx-bounds="48 518 1184 124"><rect x="48" y="518" width="1184" height="124" fill="#102E3A" /><text x="72" y="558" font-size="24" font-family="Cambria" fill="#D5EF8C">Agree in advance what supports continuing, revising or retiring.</text><text fill="#FFFDF7" x="72" y="602">The report-back is a decision peers can assess. Keep uncertainty visible; conference claims alone</text><text fill="#FFFDF7" x="72" y="630">do not establish internal readiness. Owners, scope and timing remain explicit discussion decisions.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 670 1184 30" font-size="12" fill="#50616A"><text x="48" y="688">Synthesis of the conference mechanisms. This briefing announces no Fidelity project commitment.</text><text x="1232" y="688" text-anchor="end">28 / 37</text></g></svg>