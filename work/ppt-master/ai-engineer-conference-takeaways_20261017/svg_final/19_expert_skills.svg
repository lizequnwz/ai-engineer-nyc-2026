<g id="title" data-pptx-bounds="48 40 1184 120" fill="#FFFDF7"><text x="48" y="55" font-size="16" fill="#D5EF8C">04 / RELIABLE WORKFLOWS &amp; SKILLS</text><text font-family="Cambria" font-size="36" x="48" y="98">Skills must encode expert reasons,</text><text font-family="Cambria" font-size="36" x="48" y="141">questions and limits</text></g>
<g id="range-method" data-pptx-bounds="48 188 836 450" fill="#FFFDF7"><line x1="70" y1="219" x2="70" y2="585" stroke="#50616A" stroke-width="2" />
<g><circle cx="70" cy="219" r="20" fill="#075E52" /><text x="70" y="225" text-anchor="middle" font-size="18" fill="#D5EF8C">1</text><text x="110" y="225" font-size="24" font-family="Cambria" fill="#D5EF8C">Pick</text><text x="245" y="220">Repeated work with recognizable expert acceptance.</text></g>
<g><circle cx="70" cy="310" r="20" fill="#075E52" /><text x="70" y="316" text-anchor="middle" font-size="18" fill="#D5EF8C">2</text><text x="110" y="316" font-size="24" font-family="Cambria" fill="#D5EF8C">Teach</text><text x="245" y="304">Narrate a representative case and why decisions are made;</text><text x="245" y="332">distinguish general knowledge from the firm’s method.</text></g>
<g><circle cx="70" cy="401" r="20" fill="#075E52" /><text x="70" y="407" text-anchor="middle" font-size="18" fill="#D5EF8C">3</text><text x="110" y="407" font-size="24" font-family="Cambria" fill="#D5EF8C">Pack</text><text x="245" y="395">Required inputs, authorized sources, questions, boundaries,</text><text x="245" y="423">exceptions and handoffs. Missing facts change the workflow.</text></g>
<g><circle cx="70" cy="492" r="20" fill="#075E52" /><text x="70" y="498" text-anchor="middle" font-size="18" fill="#D5EF8C">4</text><text x="110" y="498" font-size="24" font-family="Cambria" fill="#D5EF8C">Test</text><text x="245" y="486">Ordinary, difficult, incomplete and conflicting-instruction cases.</text><text x="245" y="514">Check clarification, handoff and unsupported conclusions.</text></g>
<g><circle cx="70" cy="583" r="20" fill="#075E52" /><text x="70" y="589" text-anchor="middle" font-size="18" fill="#D5EF8C">5</text><text x="110" y="589" font-size="24" font-family="Cambria" fill="#D5EF8C">Ship</text><text x="245" y="577">Owner, reviewer, change history and retested revisions.</text><text x="245" y="605">Maintain a professional instruction as practice changes.</text></g></g>
<g id="range-story" data-pptx-bounds="916 188 316 450"><rect x="916" y="188" width="316" height="450" fill="none" stroke="#50616A" /><text x="938" y="232" font-size="24" font-family="Cambria" fill="#D5EF8C">Range’s contribution</text><text font-size="18" fill="#FFFDF7" x="938" y="285">Planners write and maintain</text><text font-size="18" fill="#FFFDF7" x="938" y="311">skills and peer-review them</text><text font-size="18" fill="#FFFDF7" x="938" y="337">like plans.</text><text font-size="18" fill="#E7F0EA" x="938" y="421">The five steps are in the notes;</text><text font-size="18" fill="#E7F0EA" x="938" y="447">ownership and peer review add</text><text font-size="18" fill="#E7F0EA" x="938" y="473">official agenda detail.</text><text font-size="18" fill="#E7F0EA" x="938" y="499">Operational use is reported;</text><text font-size="18" fill="#E7F0EA" x="938" y="525">no measured net gain</text><text font-size="18" fill="#E7F0EA" x="938" y="551">was captured.</text></g>
