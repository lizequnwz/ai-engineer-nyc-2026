<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">04 / CONTROLLED WORKFLOWS</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Expert skills need owners, reasons and boundaries</text><text x="48" y="141" font-size="22" fill="#50616A">Range’s skill encodes the professional method; client-facing recommendations remain reviewed.</text></g><g id="method-sequence" data-pptx-bounds="48 180 1184 56"><rect x="48.0" y="180" width="225.6" height="56" fill="#E7F0EA" /><text x="62.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Pick</text><rect x="287.6" y="180" width="225.6" height="56" fill="#E7F0EA" /><text x="301.6" y="215" font-size="18" fill="#075E52" font-weight="bold">Teach</text><rect x="527.2" y="180" width="225.6" height="56" fill="#E7F0EA" /><text x="541.2" y="215" font-size="18" fill="#075E52" font-weight="bold">Pack</text><rect x="766.8" y="180" width="225.6" height="56" fill="#E7F0EA" /><text x="780.8" y="215" font-size="18" fill="#075E52" font-weight="bold">Test</text><rect x="1006.4" y="180" width="225.6" height="56" fill="#E7F0EA" /><text x="1020.4" y="215" font-size="18" fill="#075E52" font-weight="bold">Ship</text></g><g id="analysis-1" data-pptx-bounds="48 252 365 413"><text x="48" y="280" font-size="24" font-family="Cambria" fill="#075E52">Pick and teach a whole task</text><text fill="#132F3B" x="48" y="341">Choose repeated work whose success </text><text fill="#132F3B" x="48" y="368">a professional can recognize. Use </text><text fill="#132F3B" x="48" y="395">prior cases to explain what </text><text fill="#132F3B" x="48" y="422">information matters, how the firm </text><text fill="#132F3B" x="48" y="449">reasons and why a branch exists. A </text><text fill="#132F3B" x="48" y="476">recording of clicks without the </text><text fill="#132F3B" x="48" y="503">reason cannot reliably guide a new </text><text fill="#132F3B" x="48" y="530">or incomplete situation.</text></g><g id="analysis-2" data-pptx-bounds="452 252 365 413"><text x="452" y="280" font-size="24" font-family="Cambria" fill="#075E52">Pack the boundaries</text><text fill="#132F3B" x="452" y="341">Include required inputs, </text><text fill="#132F3B" x="452" y="368">clarification questions, </text><text fill="#132F3B" x="452" y="395">exceptions, stopping conditions and </text><text fill="#132F3B" x="452" y="422">the handoff. Test missing facts and </text><text fill="#132F3B" x="452" y="449">conflicting instructions as well as </text><text fill="#132F3B" x="452" y="476">ordinary completion. The speaker’s </text><text fill="#132F3B" x="452" y="503">five-to-ten-case routine starts </text><text fill="#132F3B" x="452" y="530">iteration; it does not demonstrate </text><text fill="#132F3B" x="452" y="557">statistical reliability or replace </text><text fill="#132F3B" x="452" y="584">broader assessment.</text></g><g id="analysis-3" data-pptx-bounds="856 252 365 413"><text x="856" y="280" font-size="24" font-family="Cambria" fill="#075E52">Ship with maintenance</text><text fill="#132F3B" x="856" y="341">Assign an owner and a separate </text><text fill="#132F3B" x="856" y="368">reviewer, keep the method current </text><text fill="#132F3B" x="856" y="395">and retest changes. Range’s agent </text><text fill="#132F3B" x="856" y="422">sends nothing and every </text><text fill="#132F3B" x="856" y="449">recommendation is reviewed by a </text><text fill="#132F3B" x="856" y="476">planner. Measure corrected, </text><text fill="#132F3B" x="856" y="503">accepted work before claiming </text><text fill="#132F3B" x="856" y="530">capacity gains; the transcript </text><text fill="#132F3B" x="856" y="557">provides a method rather than a </text><text fill="#132F3B" x="856" y="584">controlled outcome study.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Range | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">19 / 37</text></g></svg>