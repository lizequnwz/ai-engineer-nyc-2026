<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="toc"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7" />
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">THE OPERATING ARGUMENT</text><text x="48" y="98" font-family="Cambria" font-size="36">Five disciplines make financial AI dependable</text><text x="48" y="143" font-size="22">The model is one component of a complete, reviewable job.</text></g>
<g id="five-chapters" data-pptx-bounds="48 190 1184 226">
<g><rect x="48" y="190" width="211" height="226" fill="#E7F0EA" /><text x="68" y="230" font-size="24" font-family="Cambria" fill="#075E52">01 / Strategy</text><text fill="#132F3B" x="68" y="282">Define valuable </text><text fill="#132F3B" x="68" y="310">accepted work </text><text fill="#132F3B" x="68" y="338">and credible </text><text fill="#132F3B" x="68" y="366">economics.</text></g>
<g><rect x="291" y="190" width="211" height="226" fill="#E7F0EA" /><text x="311" y="230" font-size="24" font-family="Cambria" fill="#075E52">02 / Grounding</text><text fill="#132F3B" x="311" y="282">Preserve evidence, </text><text fill="#132F3B" x="311" y="310">meaning, time, </text><text fill="#132F3B" x="311" y="338">source versions </text><text fill="#132F3B" x="311" y="366">and access.</text></g>
<g><rect x="534" y="190" width="211" height="226" fill="#E7F0EA" /><text x="554" y="230" font-size="24" font-family="Cambria" fill="#075E52">03 / Evaluation</text><text fill="#132F3B" x="554" y="282">Test the complete </text><text fill="#132F3B" x="554" y="310">task, judge, </text><text fill="#132F3B" x="554" y="338">selection policy </text><text fill="#132F3B" x="554" y="366">and release.</text></g>
<g><rect x="777" y="190" width="211" height="226" fill="#E7F0EA" /><text x="797" y="230" font-size="24" font-family="Cambria" fill="#075E52">04 / Workflows</text><text fill="#132F3B" x="797" y="282">Encode methods, </text><text fill="#132F3B" x="797" y="310">enforce authority </text><text fill="#132F3B" x="797" y="338">and verify at </text><text fill="#132F3B" x="797" y="366">several boundaries.</text></g>
<g><rect x="1020" y="190" width="212" height="226" fill="#102E3A" /><text x="1040" y="230" font-size="24" font-family="Cambria" fill="#D5EF8C">05 / Growth</text><text fill="#FFFDF7" x="1040" y="282">Own the loop </text><text fill="#FFFDF7" x="1040" y="310">from user need </text><text fill="#FFFDF7" x="1040" y="338">to verified </text><text fill="#FFFDF7" x="1040" y="366">improvement.</text></g></g>
<g id="connected-method" data-pptx-bounds="48 452 1184 184" fill="#132F3B"><text x="48" y="480">Start with the bottleneck: Bridgewater’s relevant evidence, Range’s expert planning or wealth preparation </text><text x="48" y="508">and follow-through. Name the accepted output and scarce resource before choosing tools.</text><text x="48" y="564">Then trace sources, definitions, access, actions and corrections through the delivered artifact. </text><text x="48" y="592">Ramp’s ablations and Arize’s trace analysis motivate one bounded comparison: change, assess and decide.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 669 1184 31" font-size="12" fill="#50616A"><text x="48" y="687">Our synthesis of conference mechanisms. A model choice or benchmark does not resolve the whole workflow.</text><text x="1232" y="687" text-anchor="end">02 / 37</text></g></svg>