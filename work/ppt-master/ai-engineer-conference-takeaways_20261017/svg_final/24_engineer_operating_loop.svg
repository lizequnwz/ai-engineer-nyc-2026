<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="section"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#102E3A" />
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#FFFDF7"><text x="48" y="55" font-size="16" fill="#D5EF8C">05 / GROWING AS AN AI ENGINEER</text><text x="48" y="98" font-family="Cambria" font-size="36">Own the loop from user need to verified improvement</text><text x="48" y="143" font-size="22" fill="#E7F0EA">The professional contribution is a defensible change, supported by observable evidence.</text></g>
<g id="growth-loop" data-pptx-bounds="48 196 1184 168"><line x1="48" y1="211" x2="1232" y2="211" stroke="#50616A" stroke-width="2" /><text x="48" y="262" font-size="24" font-family="Cambria" fill="#D5EF8C">Frame</text><text x="48" y="312" fill="#FFFDF7">Define accepted work.</text><text x="356" y="262" font-size="24" font-family="Cambria" fill="#D5EF8C">Build</text><text x="356" y="312" fill="#FFFDF7">A complete working slice.</text><text x="664" y="262" font-size="24" font-family="Cambria" fill="#D5EF8C">Learn</text><text x="664" y="312" fill="#FFFDF7">Traces, cases and failures.</text><text x="972" y="262" font-size="24" font-family="Cambria" fill="#D5EF8C">Operate</text><text fill="#FFFDF7" x="972" y="312">Verify, release</text><text fill="#FFFDF7" x="972" y="340">and observe.</text></g>
<g id="instrument-task" data-pptx-bounds="48 405 560 235" fill="#FFFDF7"><text x="48" y="437" font-size="24" font-family="Cambria" fill="#D5EF8C">Make failure reconstructable</text><text x="48" y="486">Capture request, source context, intermediate actions,</text><text x="48" y="514">result, evaluation and versions together.</text><text x="48" y="574">A useful trace explains why a workflow failed.</text><text x="48" y="602">Arize’s diagnosis account and Ramp’s task/ablation</text><text x="48" y="630">methods motivate the operating habit.</text></g>
<g id="portfolio-of-decisions" data-pptx-bounds="640 405 592 235" fill="#FFFDF7"><text x="640" y="437" font-size="24" font-family="Cambria" fill="#D5EF8C">Build a portfolio of reviewed decisions</text><text x="640" y="486">Reproducible failures → baseline comparisons → repairs</text><text x="640" y="514">→ release decisions → observed tradeoffs.</text><text x="640" y="574">Keep diagnosis, proposed fix, validation and release</text><text x="640" y="602">authority distinct. A longer tool list does not establish</text><text x="640" y="630">diagnostic accuracy or autonomous remediation.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 672 1184 28" font-size="12" fill="#E7F0EA"><text x="48" y="690">Sources: Arize, Ramp and failure-study accounts. This growth framework is our synthesis.</text><text x="1232" y="690" text-anchor="end">24 / 37</text></g></svg>