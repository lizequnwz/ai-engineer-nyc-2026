<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">02 / GROUNDED EVIDENCE</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Resolve the fact; compute; verify the final claim</text><text x="48" y="141" font-size="22" fill="#50616A">Wrong source, fact and arithmetic need different checks; verify final generation too.</text></g><g id="method-sequence" data-pptx-bounds="48 180 1184 56"><rect x="48.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="62.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Eligible source</text><rect x="347.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="361.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Exact fact</text><rect x="647.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="661.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Code calculation</text><rect x="946.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="960.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Final claim check</text></g><g id="analysis-1" data-pptx-bounds="48 252 365 413"><text x="48" y="280" font-size="24" font-family="Cambria" fill="#075E52">Use a structured fact</text><text fill="#132F3B" x="48" y="341">The standalone breakout description </text><text fill="#132F3B" x="48" y="368">names value, unit, scale and </text><text fill="#132F3B" x="48" y="395">period. The next-day transcript </text><text fill="#132F3B" x="48" y="422">describes fact identifiers resolved </text><text fill="#132F3B" x="48" y="449">by software while a model plans. </text><text fill="#132F3B" x="48" y="476">Preserve the source anchor and </text><text fill="#132F3B" x="48" y="503">calculation inputs; a valid </text><text fill="#132F3B" x="48" y="530">identifier still needs the correct </text><text fill="#132F3B" x="48" y="557">entity, definition and version.</text></g><g id="analysis-2" data-pptx-bounds="452 252 365 413"><text x="452" y="280" font-size="24" font-family="Cambria" fill="#075E52">Keep access on every path</text><text fill="#132F3B" x="452" y="341">Exact lookup does not bypass </text><text fill="#132F3B" x="452" y="368">authorization. Search, direct </text><text fill="#132F3B" x="452" y="395">reads, calculation inputs and </text><text fill="#132F3B" x="452" y="422">output references must remain </text><text fill="#132F3B" x="452" y="449">within the user and tenant scope. </text><text fill="#132F3B" x="452" y="476">Test revoked access and empty </text><text fill="#132F3B" x="452" y="503">evidence as well as the successful </text><text fill="#132F3B" x="452" y="530">path; a citation chip does not </text><text fill="#132F3B" x="452" y="557">enforce permission.</text></g><g id="analysis-3" data-pptx-bounds="856 252 365 413"><text x="856" y="280" font-size="24" font-family="Cambria" fill="#075E52">Verify what the user receives</text><text fill="#132F3B" x="856" y="341">The main-stage transcript </text><text fill="#132F3B" x="856" y="368">explicitly retains post-processing </text><text fill="#132F3B" x="856" y="395">because generation can invent </text><text fill="#132F3B" x="856" y="422">numbers afterward. The breakout </text><text fill="#132F3B" x="856" y="449">description says unverifiable </text><text fill="#132F3B" x="856" y="476">figures are stripped. Our </text><text fill="#132F3B" x="856" y="503">requirement is stronger: correct, </text><text fill="#132F3B" x="856" y="530">remove or escalate the unsupported </text><text fill="#132F3B" x="856" y="557">material claim, rather than leave </text><text fill="#132F3B" x="856" y="584">persuasive prose with broken </text><text fill="#132F3B" x="856" y="611">support.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Kepler | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">10 / 37</text></g></svg>