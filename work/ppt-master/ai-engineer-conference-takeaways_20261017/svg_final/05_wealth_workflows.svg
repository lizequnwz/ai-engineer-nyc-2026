<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">01 / FINANCE STRATEGY</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Wealth agents prepare; professionals retain authority</text><text x="48" y="141" font-size="22" fill="#50616A">Range, Arca and Perpetual reveal complementary patterns for expertise, handoffs and approved execution.</text></g><g id="analysis-1" data-pptx-bounds="48 193 365 472"><text x="48" y="221" font-size="24" font-family="Cambria" fill="#075E52">Turn expertise into a method</text><text fill="#132F3B" x="48" y="283">Range’s skill records reasons, </text><text fill="#132F3B" x="48" y="310">required questions, exceptions and </text><text fill="#132F3B" x="48" y="337">stopping conditions. An owner </text><text fill="#132F3B" x="48" y="364">maintains it and a separate </text><text fill="#132F3B" x="48" y="391">reviewer checks it. The planner </text><text fill="#132F3B" x="48" y="418">reviews every recommendation before </text><text fill="#132F3B" x="48" y="445">client delivery. Five to ten </text><text fill="#132F3B" x="48" y="472">examples are a starting test </text><text fill="#132F3B" x="48" y="499">routine, not sufficient release </text><text fill="#132F3B" x="48" y="526">assurance.</text></g><g id="analysis-2" data-pptx-bounds="452 193 365 472"><text x="452" y="221" font-size="24" font-family="Cambria" fill="#075E52">Continue across real delays</text><text fill="#132F3B" x="452" y="283">Arca’s tax-payment illustration </text><text fill="#132F3B" x="452" y="310">spans replies, approvals, trades </text><text fill="#132F3B" x="452" y="337">and settlement. Long horizon means </text><text fill="#132F3B" x="452" y="364">durable shared plans and </text><text fill="#132F3B" x="452" y="391">event-driven resumption, rather </text><text fill="#132F3B" x="452" y="418">than continuous model thought. </text><text fill="#132F3B" x="452" y="445">Track who owns the next action, </text><text fill="#132F3B" x="452" y="472">what event wakes the task and which </text><text fill="#132F3B" x="452" y="499">approval is still required.</text></g><g id="analysis-3" data-pptx-bounds="856 193 365 472"><text x="856" y="221" font-size="24" font-family="Cambria" fill="#075E52">Bind approval to the action</text><text fill="#132F3B" x="856" y="283">Perpetual describes typed </text><text fill="#132F3B" x="856" y="310">interpretation, a validating </text><text fill="#132F3B" x="856" y="337">compiler and immutable approved </text><text fill="#132F3B" x="856" y="364">plans. Approval attaches to the </text><text fill="#132F3B" x="856" y="391">exact outgoing payload; an unknown </text><text fill="#132F3B" x="856" y="418">dispatch outcome goes to manual </text><text fill="#132F3B" x="856" y="445">review. Historical Morgan Stanley, </text><text fill="#132F3B" x="856" y="472">UBS and RBC disclosures remain </text><text fill="#132F3B" x="856" y="499">useful preparation/knowledge </text><text fill="#132F3B" x="856" y="526">examples with their original dates.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Range · Arca · Perpetual | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">05 / 37</text></g></svg>