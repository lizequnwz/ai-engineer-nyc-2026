<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">01 / FINANCE STRATEGY</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Design for a reviewed financial work product</text><text x="48" y="141" font-size="22" fill="#50616A">Coatue decomposes decisions; Apollo/Redding Ridge reconciles sources; Range preserves planner review.</text></g><g id="analysis-1" data-pptx-bounds="48 193 365 472"><text x="48" y="221" font-size="24" font-family="Cambria" fill="#075E52">Decompose the decision</text><text fill="#132F3B" x="48" y="283">Coatue models investing as context </text><text fill="#132F3B" x="48" y="310">transformed into selection, size </text><text fill="#132F3B" x="48" y="337">and timing. Break the work into </text><text fill="#132F3B" x="48" y="364">collection, interpretation, </text><text fill="#132F3B" x="48" y="391">checking and judgment. A step may </text><text fill="#132F3B" x="48" y="418">use code, classical ML, an LLM or a </text><text fill="#132F3B" x="48" y="445">person; the objective is a sound </text><text fill="#132F3B" x="48" y="472">decision process rather than </text><text fill="#132F3B" x="48" y="499">maximum LLM coverage.</text></g><g id="analysis-2" data-pptx-bounds="452 193 365 472"><text x="452" y="221" font-size="24" font-family="Cambria" fill="#075E52">Observe the real workflow</text><text fill="#132F3B" x="452" y="283">Apollo/Redding Ridge describes </text><text fill="#132F3B" x="452" y="310">portfolio preparation for PM </text><text fill="#132F3B" x="452" y="337">refinement and recurring financing </text><text fill="#132F3B" x="452" y="364">reports followed by team QA. </text><text fill="#132F3B" x="452" y="391">Reconciliation means learning why </text><text fill="#132F3B" x="452" y="418">one feed is authoritative, not </text><text fill="#132F3B" x="452" y="445">merely joining files. Define which </text><text fill="#132F3B" x="452" y="472">deliverable is accepted, who checks </text><text fill="#132F3B" x="452" y="499">it and which corrections remain.</text></g><g id="analysis-3" data-pptx-bounds="856 193 365 472"><text font-size="24" fill="#075E52" font-family="Cambria" x="856" y="221">Preserve professional </text><text font-size="24" fill="#075E52" font-family="Cambria" x="856" y="253">attention</text><text fill="#132F3B" x="856" y="283">Range drafts planning work while </text><text fill="#132F3B" x="856" y="310">professionals serve clients; the </text><text fill="#132F3B" x="856" y="337">planner reviews recommendations and </text><text fill="#132F3B" x="856" y="364">the agent sends nothing. Time saved </text><text fill="#132F3B" x="856" y="391">becomes valuable when it improves </text><text fill="#132F3B" x="856" y="418">accepted capacity or attention to </text><text fill="#132F3B" x="856" y="445">consequential judgment. Draft </text><text fill="#132F3B" x="856" y="472">volume alone does not establish </text><text fill="#132F3B" x="856" y="499">better advice, revenue or </text><text fill="#132F3B" x="856" y="526">investment outcomes.</text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Coatue · Apollo / Redding Ridge / Rowspace · Range | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">03 / 37</text></g></svg>