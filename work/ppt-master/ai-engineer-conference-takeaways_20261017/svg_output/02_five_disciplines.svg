<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="toc"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7"/>
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">THE OPERATING ARGUMENT</text><text x="48" y="98" font-family="Cambria" font-size="36">Five disciplines make financial AI dependable</text><text x="48" y="143" font-size="22">The model is one component of a complete, reviewable job.</text></g>
<g id="five-chapters" data-pptx-bounds="48 190 1184 226">
<g><rect x="48" y="190" width="211" height="226" fill="#E7F0EA"/><text x="68" y="230" font-size="24" font-family="Cambria" fill="#075E52">01 / Strategy</text><text x="68" y="282" fill="#132F3B">Define valuable<tspan x="68" dy="28">accepted work</tspan><tspan x="68" dy="28">and credible</tspan><tspan x="68" dy="28">economics.</tspan></text></g>
<g><rect x="291" y="190" width="211" height="226" fill="#E7F0EA"/><text x="311" y="230" font-size="24" font-family="Cambria" fill="#075E52">02 / Grounding</text><text x="311" y="282" fill="#132F3B">Preserve evidence,<tspan x="311" dy="28">meaning, time,</tspan><tspan x="311" dy="28">source versions</tspan><tspan x="311" dy="28">and access.</tspan></text></g>
<g><rect x="534" y="190" width="211" height="226" fill="#E7F0EA"/><text x="554" y="230" font-size="24" font-family="Cambria" fill="#075E52">03 / Evaluation</text><text x="554" y="282" fill="#132F3B">Test the complete<tspan x="554" dy="28">task, judge,</tspan><tspan x="554" dy="28">selection policy</tspan><tspan x="554" dy="28">and release.</tspan></text></g>
<g><rect x="777" y="190" width="211" height="226" fill="#E7F0EA"/><text x="797" y="230" font-size="24" font-family="Cambria" fill="#075E52">04 / Workflows</text><text x="797" y="282" fill="#132F3B">Encode methods,<tspan x="797" dy="28">enforce authority</tspan><tspan x="797" dy="28">and verify at</tspan><tspan x="797" dy="28">several boundaries.</tspan></text></g>
<g><rect x="1020" y="190" width="212" height="226" fill="#102E3A"/><text x="1040" y="230" font-size="24" font-family="Cambria" fill="#D5EF8C">05 / Growth</text><text x="1040" y="282" fill="#FFFDF7">Own the loop<tspan x="1040" dy="28">from user need</tspan><tspan x="1040" dy="28">to verified</tspan><tspan x="1040" dy="28">improvement.</tspan></text></g></g>
<g id="connected-method" data-pptx-bounds="48 452 1184 184" fill="#132F3B"><text x="48" y="480">Start with the bottleneck: Bridgewater’s relevant evidence, Range’s expert planning or wealth preparation<tspan x="48" dy="28">and follow-through. Name the accepted output and scarce resource before choosing tools.</tspan></text><text x="48" y="564">Then trace sources, definitions, access, actions and corrections through the delivered artifact.<tspan x="48" dy="28">Ramp’s ablations and Arize’s trace analysis motivate one bounded comparison: change, assess and decide.</tspan></text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 669 1184 31" font-size="12" fill="#50616A"><text x="48" y="687">Our synthesis of conference mechanisms. A model choice or benchmark does not resolve the whole workflow.</text><text x="1232" y="687" text-anchor="end">02 / 37</text></g></svg>
