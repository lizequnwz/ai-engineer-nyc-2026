<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">02 / GROUNDED EVIDENCE</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Keep evidence intact through the exported artifact</text><text x="48" y="141" font-size="22" fill="#50616A">A source-backed chat response is insufficient if the saved workbook, report or presentation becomes <tspan x="48" dy="29">stale.</tspan></text></g><g id="method-sequence" data-pptx-bounds="48 180 1184 56"><rect x="48.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="62.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Source + meaning</text><rect x="347.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="361.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Calculation</text><rect x="647.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="661.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Review</text><rect x="946.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="960.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Current artifact</text></g><g id="analysis-1" data-pptx-bounds="48 252 365 413"><text x="48" y="280" font-size="24" font-family="Cambria" fill="#075E52">Preserve the claim chain</text><text x="48" y="341" fill="#132F3B">OpenAI’s finance presentation <tspan x="48" dy="27">connects source passages and tables </tspan><tspan x="48" dy="27">to charts and reusable artifacts. </tspan><tspan x="48" dy="27">Carry the material value, period, </tspan><tspan x="48" dy="27">unit and source into the </tspan><tspan x="48" dy="27">deliverable. Reconcile the document </tspan><tspan x="48" dy="27">with the current evidence after a </tspan><tspan x="48" dy="27">correction rather than treating </tspan><tspan x="48" dy="27">export as a cosmetic step.</tspan></text></g><g id="analysis-2" data-pptx-bounds="452 252 365 413"><text x="452" y="280" font-size="24" font-family="Cambria" fill="#075E52">Check collaborative scope</text><text x="452" y="341" fill="#132F3B">Compound AI describes shared deal <tspan x="452" dy="27">threads, an agent inbox and longer </tspan><tspan x="452" dy="27">artifact work. Permissions must </tspan><tspan x="452" dy="27">follow participants and source </tspan><tspan x="452" dy="27">material, not only the connector. </tspan><tspan x="452" dy="27">Inspect workbook depth, file </tspan><tspan x="452" dy="27">coverage and final fidelity </tspan><tspan x="452" dy="27">separately; vendor architecture is </tspan><tspan x="452" dy="27">not independently verified Office </tspan><tspan x="452" dy="27">parity.</tspan></text></g><g id="analysis-3" data-pptx-bounds="856 252 365 413"><text x="856" y="280" font-size="24" font-family="Cambria" fill="#075E52">Review the current saved <tspan x="856" dy="32">artifact</tspan></text><text x="856" y="341" fill="#132F3B">Use a write–render–check–fix loop <tspan x="856" dy="27">and inspect again after the final </tspan><tspan x="856" dy="27">edit. Our acceptance contract </tspan><tspan x="856" dy="27">checks the actual report the team </tspan><tspan x="856" dy="27">will share, including stale </tspan><tspan x="856" dy="27">sources, truncated tables and </tspan><tspan x="856" dy="27">missing caveats. Passing code or an </tspan><tspan x="856" dy="27">older preview cannot establish that </tspan><tspan x="856" dy="27">the current artifact is usable.</tspan></text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: OpenAI · Compound AI | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">12 / 37</text></g></svg>
