<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7"/>
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">03 / THE FAILURE-TO-IMPROVEMENT PATH</text><text x="48" y="98" font-family="Cambria" font-size="36">Turn failures into reviewed experiments</text><text x="48" y="143" font-size="22">Trace analysis proposes a repair; evidence and accountable judgment authorize its use.</text></g>
<g id="improvement-sequence" data-pptx-bounds="48 195 1184 144"><text x="48" y="246" font-size="24" font-family="Cambria" fill="#075E52">1 / Observe</text><text x="48" y="295" font-size="18" fill="#132F3B">Traces and corrections.</text>
<g id="p18-observe-to-adjudicate" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="319 221 24 42" fill="#075E52" stroke="none"><path d="M 319 221 L 331 221 L 343 242 L 331 263 L 319 263 L 331 242 Z"/></g>
<text x="356" y="246" font-size="24" font-family="Cambria" fill="#075E52">2 / Adjudicate</text><text x="356" y="295" font-size="18" fill="#132F3B">Reproduce the failure.</text>
<g id="p18-adjudicate-to-test" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="627 221 24 42" fill="#075E52" stroke="none"><path d="M 627 221 L 639 221 L 651 242 L 639 263 L 627 263 L 639 242 Z"/></g>
<text x="664" y="246" font-size="24" font-family="Cambria" fill="#075E52">3 / Test a repair</text><text x="664" y="295" font-size="18" fill="#132F3B">Regressions + assessment.</text>
<g id="p18-test-to-release" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="935 221 24 42" fill="#075E52" stroke="none"><path d="M 935 221 L 947 221 L 959 242 L 947 263 L 935 263 L 947 242 Z"/></g>
<text x="972" y="246" font-size="24" font-family="Cambria" fill="#075E52">4 / Release in scope</text><text x="972" y="295" font-size="18" fill="#132F3B">Monitor; pause or roll back.</text></g>
<g id="trace-record" data-pptx-bounds="48 371 710 268"><rect x="48" y="371" width="710" height="268" fill="#E7F0EA"/><text x="72" y="411" font-size="24" font-family="Cambria" fill="#075E52">Capture enough context to explain why</text><text x="72" y="460" fill="#132F3B">Request, available sources and permissions, tool interactions,<tspan x="72" dy="28">output, human correction and relevant versions.</tspan></text><text x="72" y="548" fill="#132F3B">Triage evidence, reasoning, runtime and evaluator defects.<tspan x="72" dy="28">Create a versioned case, propose a specific change and test</tspan><tspan x="72" dy="28">against regressions plus separately retained assessment cases.</tspan></text></g>
<g id="controlled-release" data-pptx-bounds="790 371 442 268" fill="#132F3B"><text x="790" y="411" font-size="24" font-family="Cambria" fill="#075E52">Keep access and release explicit</text><text x="790" y="460">Trace access follows existing rules.<tspan x="790" dy="28">Observe escaped defects, corrections,</tspan><tspan x="790" dy="28">drift and operating cost after release.</tspan></text><text x="790" y="575" font-size="18" fill="#50616A">Arize’s account establishes no measured diagnosis<tspan x="790" dy="26">accuracy or autonomous remediation. Upstart’s</tspan><tspan x="790" dy="26">announced improvement loops were being built.</tspan></text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 670 1184 30" font-size="12" fill="#50616A"><text x="48" y="688">Sources: Arize/Ramp/failure-study notes; Upstart agenda. Adjudication, assessment separation and release controls are proposed synthesis.</text><text x="1232" y="688" text-anchor="end">18 / 37</text></g></svg>
