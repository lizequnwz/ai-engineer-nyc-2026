<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">03 / EVALUATION ENGINEERING</text><text x="48" y="97" font-size="36" fill="#102E3A" font-family="Cambria">A balanced answer can conceal a fabricated adjustment</text><text x="48" y="141" font-size="22" fill="#50616A">Basis: final-answer scoring can reward zero variance even when the process violates the accounting <tspan x="48" dy="29">task.</tspan></text></g><g id="find-gap" data-pptx-bounds="48 184 344 142"><rect x="48" y="184" width="344" height="142" fill="#E7F0EA" /><text x="66" y="213" fill="#075E52" font-weight="bold">01 / Find discrepancy</text><text x="66" y="254" fill="#132F3B">Supporting entry cannot be <tspan x="66" dy="26">found.</tspan></text></g><g id="unsupported-step" data-pptx-bounds="408 184 394 142"><rect x="408" y="184" width="394" height="142" fill="#E7F0EA" /><text x="426" y="213" fill="#075E52" font-weight="bold">02 / Take shortcut</text><text x="426" y="254" fill="#132F3B">Agent posts an unsupported <tspan x="426" dy="26">adjustment.</tspan></text></g><g id="apparent-success" data-pptx-bounds="818 184 414 142"><rect x="818" y="184" width="414" height="142" fill="#102E3A" /><text x="836" y="213" fill="#D5EF8C" font-weight="bold">03 / Appear successful</text><text x="836" y="254" fill="#FFFDF7">Variance = zero; accounting process <tspan x="836" dy="26">failed.</tspan></text></g><g id="tool-contract" data-pptx-bounds="48 350 1184 105"><line x1="48" y1="350" x2="1232" y2="350" stroke="#CBD4D1" /><text x="48" y="384" fill="#9B3025" font-weight="bold">Conflicting tool: only accepts a tying <tspan x="48" dy="26">reconciliation.</tspan></text><text x="660" y="384" fill="#075E52" font-weight="bold">Repair to test: accept a sourced explanation or flagged <tspan x="660" dy="26">gap.</tspan></text></g><g id="lesson-0" data-pptx-bounds="48 478 376 178"><text x="48" y="503" font-size="24" fill="#075E52" font-family="Cambria">Behavior specification</text><text x="48" y="545" fill="#132F3B">First ask: applicable? Then: <tspan x="48" dy="26">adhered? Not applicable is a</tspan> <tspan x="48" dy="26">separate state, not a pass.</tspan></text></g><g id="lesson-1" data-pptx-bounds="452 478 376 178"><text x="452" y="503" font-size="24" fill="#075E52" font-family="Cambria">Fork before the decision</text><text x="452" y="545" fill="#132F3B">Reconstruct state and test the <tspan x="452" dy="26">incentive hypothesis. Prompt changes</tspan> <tspan x="452" dy="26">alone sometimes helped; tool design</tspan> <tspan x="452" dy="26">mattered.</tspan></text></g><g id="lesson-2" data-pptx-bounds="856 478 376 178"><text x="856" y="503" font-size="24" fill="#075E52" font-family="Cambria">Verify beyond one replay</text><text x="856" y="545" fill="#132F3B">A simulated branch is cheaper and <tspan x="856" dy="26">less faithful. Reproduce in the real</tspan> <tspan x="856" dy="26">environment and inspect repeated</tspan> <tspan x="856" dy="26">trials and regressions.</tspan></text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Basis · Arize | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">18 / 37</text></g></svg>
