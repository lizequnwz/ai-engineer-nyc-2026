<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">03 / EVALUATION ENGINEERING</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Evaluate the outcome, behavior and authority</text><text x="48" y="141" font-size="22" fill="#50616A">A correct total cannot compensate for fabricated evidence, a prohibited shortcut or an unapproved send.</text></g><g id="method-sequence" data-pptx-bounds="48 180 1184 56"><rect x="48.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="62.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Outcome</text><rect x="347.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="361.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Behavior</text><rect x="647.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="661.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Authority</text><rect x="946.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="960.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Operating effort</text></g><g id="analysis-1" data-pptx-bounds="48 252 365 413"><text x="48" y="280" font-size="24" font-family="Cambria" fill="#075E52">Start from professional work</text><text x="48" y="341" fill="#132F3B">Vals emphasizes fully acceptable <tspan x="48" dy="27">outputs rather than only average </tspan><tspan x="48" dy="27">partial credit. Ramp’s bookkeeping </tspan><tspan x="48" dy="27">account defines task, synthetic </tspan><tspan x="48" dy="27">business world, trajectory and </tspan><tspan x="48" dy="27">accountant-authored rubric. Build </tspan><tspan x="48" dy="27">cases around the work a reviewer </tspan><tspan x="48" dy="27">accepts, with realistic missing and </tspan><tspan x="48" dy="27">messy evidence.</tspan></text></g><g id="analysis-2" data-pptx-bounds="452 252 365 413"><text x="452" y="280" font-size="24" font-family="Cambria" fill="#075E52">Construct diagnostic variants</text><text x="452" y="341" fill="#132F3B">The Air Canada release describes <tspan x="452" dy="27">writing an expected answer first, </tspan><tspan x="452" dy="27">then creating evidence-containing </tspan><tspan x="452" dy="27">inputs. Add removed evidence, </tspan><tspan x="452" dy="27">planted violations and </tspan><tspan x="452" dy="27">meaning-preserving edits. Validate </tspan><tspan x="452" dy="27">realism and the answer key; </tspan><tspan x="452" dy="27">synthetic generation can produce </tspan><tspan x="452" dy="27">shortcuts that make the test </tspan><tspan x="452" dy="27">artificially easy.</tspan></text></g><g id="analysis-3" data-pptx-bounds="856 252 365 413"><text x="856" y="280" font-size="24" font-family="Cambria" fill="#075E52">Keep blockers outside the <tspan x="856" dy="32">average</tspan></text><text x="856" y="341" fill="#132F3B">A correct total cannot offset <tspan x="856" dy="27">fabricated evidence, unauthorized </tspan><tspan x="856" dy="27">access or an unapproved send. Use </tspan><tspan x="856" dy="27">exact assertions where available, </tspan><tspan x="856" dy="27">calibrated domain rubrics for </tspan><tspan x="856" dy="27">judgment and a separate behavior </tspan><tspan x="856" dy="27">verdict. Keep full cost, latency, </tspan><tspan x="856" dy="27">coverage and reviewer effort beside </tspan><tspan x="856" dy="27">quality.</tspan></text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Vals AI · Ramp · Basis · Air Canada | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">13 / 37</text></g></svg>
