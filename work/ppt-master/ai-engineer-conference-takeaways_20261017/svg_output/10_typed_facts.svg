<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">02 / GROUNDED EVIDENCE</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Resolve the fact; compute; verify the final claim</text><text x="48" y="141" font-size="22" fill="#50616A">Wrong source, fact and arithmetic need different checks; verify final generation too.</text></g><g id="method-sequence" data-pptx-bounds="48 180 1184 56"><rect x="48.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="62.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Eligible source</text><rect x="347.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="361.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Exact fact</text><rect x="647.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="661.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Code calculation</text><rect x="946.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="960.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Final claim check</text></g><g id="analysis-1" data-pptx-bounds="48 252 365 413"><text x="48" y="280" font-size="24" font-family="Cambria" fill="#075E52">Use a structured fact</text><text x="48" y="341" fill="#132F3B">The standalone breakout description <tspan x="48" dy="27">names value, unit, scale and </tspan><tspan x="48" dy="27">period. The next-day transcript </tspan><tspan x="48" dy="27">describes fact identifiers resolved </tspan><tspan x="48" dy="27">by software while a model plans. </tspan><tspan x="48" dy="27">Preserve the source anchor and </tspan><tspan x="48" dy="27">calculation inputs; a valid </tspan><tspan x="48" dy="27">identifier still needs the correct </tspan><tspan x="48" dy="27">entity, definition and version.</tspan></text></g><g id="analysis-2" data-pptx-bounds="452 252 365 413"><text x="452" y="280" font-size="24" font-family="Cambria" fill="#075E52">Keep access on every path</text><text x="452" y="341" fill="#132F3B">Exact lookup does not bypass <tspan x="452" dy="27">authorization. Search, direct </tspan><tspan x="452" dy="27">reads, calculation inputs and </tspan><tspan x="452" dy="27">output references must remain </tspan><tspan x="452" dy="27">within the user and tenant scope. </tspan><tspan x="452" dy="27">Test revoked access and empty </tspan><tspan x="452" dy="27">evidence as well as the successful </tspan><tspan x="452" dy="27">path; a citation chip does not </tspan><tspan x="452" dy="27">enforce permission.</tspan></text></g><g id="analysis-3" data-pptx-bounds="856 252 365 413"><text x="856" y="280" font-size="24" font-family="Cambria" fill="#075E52">Verify what the user receives</text><text x="856" y="341" fill="#132F3B">The main-stage transcript <tspan x="856" dy="27">explicitly retains post-processing </tspan><tspan x="856" dy="27">because generation can invent </tspan><tspan x="856" dy="27">numbers afterward. The breakout </tspan><tspan x="856" dy="27">description says unverifiable </tspan><tspan x="856" dy="27">figures are stripped. Our </tspan><tspan x="856" dy="27">requirement is stronger: correct, </tspan><tspan x="856" dy="27">remove or escalate the unsupported </tspan><tspan x="856" dy="27">material claim, rather than leave </tspan><tspan x="856" dy="27">persuasive prose with broken </tspan><tspan x="856" dy="27">support.</tspan></text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Kepler | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">10 / 37</text></g></svg>
