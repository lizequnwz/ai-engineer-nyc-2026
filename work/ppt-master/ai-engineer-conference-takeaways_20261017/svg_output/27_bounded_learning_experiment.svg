<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">05 / AI ENGINEER GROWTH</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Prove one improvement through a bounded experiment</text><text x="48" y="141" font-size="22" fill="#50616A">One realistic task and one diagnosed failure can develop the full engineering discipline.</text></g><g id="method-sequence" data-pptx-bounds="48 180 1184 56"><rect x="48.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="62.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Baseline</text><rect x="347.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="361.5" y="215" font-size="18" fill="#075E52" font-weight="bold">One hypothesis</text><rect x="647.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="661.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Paired assessment</text><rect x="946.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="960.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Learning packet</text></g><g id="analysis-1" data-pptx-bounds="48 252 365 413"><text x="48" y="280" font-size="24" font-family="Cambria" fill="#075E52">Build a reviewable baseline</text><text x="48" y="341" fill="#132F3B">Interview a practitioner and choose <tspan x="48" dy="27">a historical task with known </tspan><tspan x="48" dy="27">accepted work. Preserve its input </tspan><tspan x="48" dy="27">snapshot and permitted tools. Write </tspan><tspan x="48" dy="27">exact checks, a short expert rubric </tspan><tspan x="48" dy="27">and one critical behavior </tspan><tspan x="48" dy="27">expectation before measuring the </tspan><tspan x="48" dy="27">candidate.</tspan></text></g><g id="analysis-2" data-pptx-bounds="452 252 365 413"><text x="452" y="280" font-size="24" font-family="Cambria" fill="#075E52">Vary one hypothesis</text><text x="452" y="341" fill="#132F3B">Try a skill ablation, a narrower <tspan x="452" dy="27">context or a repaired tool </tspan><tspan x="452" dy="27">incentive. Add an answer-first </tspan><tspan x="452" dy="27">missing-evidence case and a </tspan><tspan x="452" dy="27">next-period memory case. Repeat </tspan><tspan x="452" dy="27">when stochastic variation matters, </tspan><tspan x="452" dy="27">keep held-out assessment and </tspan><tspan x="452" dy="27">inspect regressions as well as the </tspan><tspan x="452" dy="27">average.</tspan></text></g><g id="analysis-3" data-pptx-bounds="856 252 365 413"><text x="856" y="280" font-size="24" font-family="Cambria" fill="#075E52">Publish the learning packet</text><text x="856" y="341" fill="#132F3B">Retain the trace, <tspan x="856" dy="27">baseline/candidate results, </tspan><tspan x="856" dy="27">important disagreement, total </tspan><tspan x="856" dy="27">review effort and the current </tspan><tspan x="856" dy="27">artifact. State what improved, what </tspan><tspan x="856" dy="27">failed and what remains uncertain. </tspan><tspan x="856" dy="27">This develops product judgment, </tspan><tspan x="856" dy="27">debugging and evaluation together; </tspan><tspan x="856" dy="27">it is an optional learning exercise </tspan><tspan x="856" dy="27">rather than a project commitment.</tspan></text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Basis · Ramp · Air Canada · Capital One | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">27 / 37</text></g></svg>
