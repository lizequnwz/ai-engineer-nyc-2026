<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7"/>
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#8B411C">04 / SYNTHETIC REVIEW PACKET — FICTIONAL CLIENT A</text><text x="48" y="98" font-family="Cambria" font-size="36">A useful draft does not grant authority to act</text><text x="48" y="143" font-size="22">Authorized facts → agent preparation → professional judgment → separately permitted execution</text></g>
<g id="fictional-arithmetic" data-pptx-bounds="48 184 1184 147"><rect x="48" y="184" width="1184" height="147" fill="#102E3A"/><text x="72" y="218" font-size="16" fill="#D5EF8C">ANNUAL USD / ALL VALUES INVENTED</text><text x="72" y="272" font-size="24" font-family="Cambria" fill="#FFFDF7">Income $120,000 − recorded expenses $84,000 = arithmetic difference $36,000</text><text x="72" y="311" fill="#E7F0EA">This is not disposable capacity, an insurance need or a suitability finding.</text></g>
<g id="prepare" data-pptx-bounds="48 371 360 264" fill="#132F3B"><text x="48" y="402" font-size="24" font-family="Cambria" fill="#075E52">Make the draft reviewable</text><text x="48" y="451">Expose inputs, calculations,<tspan x="48" dy="28">missing facts, assumptions and</tspan><tspan x="48" dy="28">proposed conclusions.</tspan></text><text x="48" y="565">Subtraction alone cannot support<tspan x="48" dy="28">a recommendation. Missing</tspan><tspan x="48" dy="28">information stays explicit.</tspan></text></g>
<g id="professional-review" data-pptx-bounds="440 371 360 264" fill="#132F3B"><text x="440" y="402" font-size="24" font-family="Cambria" fill="#075E52">Make review a decision</text><text x="440" y="451">Range describes parallel drafting<tspan x="440" dy="28">while a planner serves another</tspan><tspan x="440" dy="28">client, followed by adjustment.</tspan></text><text x="440" y="565">Measure accepted work after<tspan x="440" dy="28">corrections, not the number</tspan><tspan x="440" dy="28">of generated drafts.</tspan></text></g>
<g id="execution-authority" data-pptx-bounds="832 371 400 264" fill="#132F3B"><text x="832" y="402" font-size="24" font-family="Cambria" fill="#075E52">Enforce execution separately</text><text x="832" y="451">Wise’s program separates proposals<tspan x="832" dy="28">from authority. Draft review does not</tspan><tspan x="832" dy="28">authorize a send or transaction.</tspan></text><text x="832" y="565">A service checks user/case/action<tspan x="832" dy="28">permission and records who</tspan><tspan x="832" dy="28">approved what.</tspan></text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 670 1184 30" font-size="12" fill="#50616A"><text x="48" y="688">Sources: Range notes and Wise agenda. Proposed workflow, not a disclosed Range architecture or financial-advice result.</text><text x="1232" y="688" text-anchor="end">20 / 37</text></g></svg>
