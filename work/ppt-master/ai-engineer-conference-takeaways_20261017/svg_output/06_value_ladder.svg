<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">01 / FINANCE STRATEGY</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Process measures precede claims of financial impact</text><text x="48" y="141" font-size="22" fill="#50616A">Adoption, useful output, process change and financial outcomes require different evidence.</text></g><g id="method-sequence" data-pptx-bounds="48 180 1184 56"><rect x="48.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="62.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Use</text><rect x="347.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="361.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Accepted work</text><rect x="647.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="661.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Process change</text><rect x="946.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="960.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Attributable value</text></g><g id="analysis-1" data-pptx-bounds="48 252 365 413"><text x="48" y="280" font-size="24" font-family="Cambria" fill="#075E52">Define useful output first</text><text x="48" y="341" fill="#132F3B">Contour’s official release <tspan x="48" dy="27">describes live research comparisons </tspan><tspan x="48" dy="27">and cost per useful insight, </tspan><tspan x="48" dy="27">including repair effort. Define </tspan><tspan x="48" dy="27">useful insight, eligible work and </tspan><tspan x="48" dy="27">the comparison before looking at </tspan><tspan x="48" dy="27">outcomes. Its description does not </tspan><tspan x="48" dy="27">disclose enough assignment, sample </tspan><tspan x="48" dy="27">or control detail to establish </tspan><tspan x="48" dy="27">causal alpha.</tspan></text></g><g id="analysis-2" data-pptx-bounds="452 252 365 413"><text x="452" y="280" font-size="24" font-family="Cambria" fill="#075E52">Keep the decision record</text><text x="452" y="341" fill="#132F3B">Preserve what was known when an <tspan x="452" dy="27">idea was proposed, its sources, </tspan><tspan x="452" dy="27">reasoning, reviewer response and </tspan><tspan x="452" dy="27">subsequent decision. Agents </tspan><tspan x="452" dy="27">revisiting an old idea may improve </tspan><tspan x="452" dy="27">timing or attention; a later </tspan><tspan x="452" dy="27">profitable position still depends </tspan><tspan x="452" dy="27">on markets, selection, sizing and </tspan><tspan x="452" dy="27">human action.</tspan></text></g><g id="analysis-3" data-pptx-bounds="856 252 365 413"><text x="856" y="280" font-size="24" font-family="Cambria" fill="#075E52">Inspect the denominator</text><text x="856" y="341" fill="#132F3B">Jellyfish includes human salary and <tspan x="856" dy="27">AI spend per merged PR, and </tspan><tspan x="856" dy="27">inspects reverts/change size. That </tspan><tspan x="856" dy="27">observational engineering proxy </tspan><tspan x="856" dy="27">suggests measuring accepted work </tspan><tspan x="856" dy="27">with quality counterchecks. It does </tspan><tspan x="856" dy="27">not establish that spending more </tspan><tspan x="856" dy="27">causes improvement or that a merged </tspan><tspan x="856" dy="27">PR equals business value.</tspan></text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Contour Asset Management · Jellyfish | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">06 / 37</text></g></svg>
