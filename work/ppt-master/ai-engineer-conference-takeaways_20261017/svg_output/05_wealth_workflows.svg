<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7"/>
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">01 / WEALTH MANAGEMENT PATTERNS</text><text x="48" y="98" font-family="Cambria" font-size="36">Wealth AI augments preparation,<tspan x="48" dy="43">knowledge and professional review</tspan></text></g>
<g id="range" data-pptx-bounds="48 184 560 180" fill="#132F3B"><rect x="48" y="184" width="560" height="180" fill="#E7F0EA"/><text x="70" y="217" font-size="24" font-family="Cambria" fill="#075E52">Range / expert-authored planning</text><text x="70" y="247" font-size="16" fill="#50616A">OCTOBER 2026 CONFERENCE ACCOUNT</text><text x="70" y="283">Planners encode their method; agents draft in parallel.<tspan x="70" dy="28">Planners review and adjust. Measure accepted work</tspan><tspan x="70" dy="28">after correction before claiming added capacity.</tspan></text></g>
<g id="morgan-stanley" data-pptx-bounds="640 184 592 180" fill="#132F3B"><rect x="640" y="184" width="592" height="180" fill="#F1F4EE"/><text x="662" y="217" font-size="24" font-family="Cambria" fill="#075E52">Morgan Stanley / meeting to follow-up</text><text x="662" y="247" font-size="16" fill="#50616A">JUNE 26, 2024 DISCLOSURE</text><text x="662" y="283">Consent-based Debrief notes, action items, advisor-<tspan x="662" dy="28">edited follow-up and CRM capture. Separate Assistant</tspan><tspan x="662" dy="28">adoption from measured Debrief productivity.</tspan></text></g>
<g id="ubs" data-pptx-bounds="48 388 560 180" fill="#132F3B"><rect x="48" y="388" width="560" height="180" fill="#F1F4EE"/><text x="70" y="421" font-size="24" font-family="Cambria" fill="#075E52">UBS / institutional knowledge</text><text x="70" y="451" font-size="16" fill="#50616A">FEBRUARY 4, 2025 DISCLOSURE</text><text x="70" y="487">Red supports advisor access to product information,<tspan x="70" dy="28">research and CIO knowledge. Access is a workflow</tspan><tspan x="70" dy="28">mechanism; rollout alone does not prove outcomes.</tspan></text></g>
<g id="rbc" data-pptx-bounds="640 388 592 180" fill="#132F3B"><rect x="640" y="388" width="592" height="180" fill="#E7F0EA"/><text x="662" y="421" font-size="24" font-family="Cambria" fill="#075E52">RBC / client-context preparation</text><text x="662" y="451" font-size="16" fill="#50616A">MARCH 27, 2025 INVESTOR MATERIALS</text><text x="662" y="487">Use relevant client information for meeting preparation.<tspan x="662" dy="28">US-pilot conversion and survey adoption/satisfaction</tspan><tspan x="662" dy="28">have different evidence scopes and measures.</tspan></text></g>
<g id="historical-boundary" data-pptx-bounds="48 599 1184 57"><text x="48" y="618" font-size="18" fill="#8B411C">These are dated workflow examples. Drafting, reported deployment and adoption differ from better advice,<tspan x="48" dy="26">universal current availability, measured net capacity or causal client and revenue outcomes.</tspan></text></g>
