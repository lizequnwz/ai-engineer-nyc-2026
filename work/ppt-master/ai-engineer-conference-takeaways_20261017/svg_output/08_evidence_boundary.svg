<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="section"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#102E3A"/>
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#FFFDF7"><text x="48" y="55" font-size="16" fill="#D5EF8C">02 / GROUNDED AGENTS</text><text x="48" y="98" font-family="Cambria" font-size="36">Ground the question in time, meaning and access</text><text x="48" y="143" font-size="22" fill="#E7F0EA">The evidence boundary precedes a persuasive answer.</text></g>
<g id="evidence-path" data-pptx-bounds="48 195 1184 170"><line x1="66" y1="211" x2="1214" y2="211" stroke="#50616A" stroke-width="2"/><text x="48" y="254" font-size="24" font-family="Cambria" fill="#D5EF8C">1 / Request</text><text x="48" y="302" font-size="18" fill="#FFFDF7">Entity, task,<tspan x="48" dy="26">information cutoff.</tspan></text><text x="291" y="254" font-size="24" font-family="Cambria" fill="#D5EF8C">2 / Boundary</text><text x="291" y="302" font-size="18" fill="#FFFDF7">Allowed sources,<tspan x="291" dy="26">access/effective time.</tspan></text><text x="534" y="254" font-size="24" font-family="Cambria" fill="#D5EF8C">3 / Meaning</text><text x="534" y="302" font-size="18" fill="#FFFDF7">Ontology, metrics,<tspan x="534" dy="26">definitions/versions.</tspan></text><text x="777" y="254" font-size="24" font-family="Cambria" fill="#D5EF8C">4 / Context</text><text x="777" y="302" font-size="18" fill="#FFFDF7">Relevant evidence,<tspan x="777" dy="26">conflicts and gaps.</tspan></text><text x="1020" y="254" font-size="24" font-family="Cambria" fill="#D5EF8C">5 / Answer</text><text x="1020" y="302" font-size="18" fill="#FFFDF7">Supported claims,<tspan x="1020" dy="26">explicit uncertainty.</tspan></text></g>
<g id="vault" data-pptx-bounds="48 405 360 235" fill="#FFFDF7"><text x="48" y="437" font-size="24" font-family="Cambria" fill="#D5EF8C">Scope the investment question</text><text x="48" y="483">Vault combines internal/external<tspan x="48" dy="28">research, news and transcripts.</tspan><tspan x="48" dy="28">Market, country, concept and time</tspan><tspan x="48" dy="28">organize the knowledge; the</tspan><tspan x="48" dy="28">request still defines relevance.</tspan></text></g>
<g id="permissions" data-pptx-bounds="440 405 360 235" fill="#FFFDF7"><text x="440" y="437" font-size="24" font-family="Cambria" fill="#D5EF8C">Enforce retrieval access</text><text x="440" y="483">The separate Bridgewater /<tspan x="440" dy="28">turbopuffer program case</tspan><tspan x="440" dy="28">describes retrieval permissions.</tspan><tspan x="440" dy="28">Test current-user access and</tspan><tspan x="440" dy="28">revocation, not credentials alone.</tspan></text></g>
<g id="definitions" data-pptx-bounds="832 405 400 235" fill="#FFFDF7"><text x="832" y="437" font-size="24" font-family="Cambria" fill="#D5EF8C">Carry business meaning</text><text x="832" y="483">Use the intended metric, entity,<tspan x="832" dy="28">period and source version.</tspan><tspan x="832" dy="28">Surface conflicts and missing facts.</tspan><tspan x="832" dy="28">Reported Vault/PAT production</tspan><tspan x="832" dy="28">use is not an independent result.</tspan></text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32" font-size="12" fill="#E7F0EA"><text x="48" y="686">Sources: Vault notes; separate permissions session is agenda-only. Path is proposed synthesis, not a disclosed complete company architecture.</text><text x="1232" y="686" text-anchor="end">08 / 37</text></g></svg>
