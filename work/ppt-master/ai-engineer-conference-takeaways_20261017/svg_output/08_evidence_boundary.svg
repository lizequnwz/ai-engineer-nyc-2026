<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">02 / GROUNDED EVIDENCE</text><text x="48" y="97" font-size="36" fill="#102E3A" font-family="Cambria">A changing belief needs a dated evidence trail</text><text x="48" y="141" font-size="22" fill="#50616A">Citadel Securities distinguishes reported status from evidence-supported status and preserves the <tspan x="48" dy="29">reasons for change.</tspan></text></g><g id="earlier-record" data-pptx-bounds="48 184 332 150"><rect x="48" y="184" width="332" height="150" fill="#E7F0EA" /><text x="66" y="213" fill="#075E52" font-weight="bold">Earlier / monthly deck</text><text x="66" y="254" fill="#132F3B">Reported project status: <tspan x="66" dy="26">green.</tspan></text></g><g id="new-evidence" data-pptx-bounds="396 184 374 150"><rect x="396" y="184" width="374" height="150" fill="#E7F0EA" /><text x="414" y="213" fill="#075E52" font-weight="bold">Newer / message or attachment</text><text x="414" y="254" fill="#132F3B">An unresolved dependency changes <tspan x="414" dy="26">the assessment.</tspan></text></g><g id="retained-history" data-pptx-bounds="786 184 446 186"><rect x="786" y="184" width="446" height="186" fill="#102E3A" /><text x="804" y="213" fill="#D5EF8C" font-weight="bold">Retain both records</text><text x="804" y="254" fill="#FFFDF7">Reported status ≠ evidence-supported <tspan x="804" dy="26">status. Keep the reason for change.</tspan></text></g><g id="source-boundary" data-pptx-bounds="48 357 708 47"><text x="48" y="381" font-size="18" fill="#50616A">Reconstruction of a narrated example; no prediction result is measured.</text></g><g id="lesson-0" data-pptx-bounds="48 430 376 224"><text x="48" y="455" font-size="24" fill="#075E52" font-family="Cambria">Do not overwrite history</text><text x="48" y="497" fill="#132F3B">Attach evidence, source and <tspan x="48" dy="26">observation time. Earlier snapshots</tspan> <tspan x="48" dy="26">must reflect what was knowable then.</tspan></text></g><g id="lesson-1" data-pptx-bounds="452 430 376 224"><text x="452" y="455" font-size="24" fill="#075E52" font-family="Cambria">Govern the commit</text><text x="452" y="497" fill="#132F3B">Models propose updates; code and <tspan x="452" dy="26">people accept corrections. Preserve</tspan> <tspan x="452" dy="26">contradictions and aging evidence.</tspan></text></g><g id="lesson-2" data-pptx-bounds="856 430 376 224"><text x="856" y="455" font-size="24" fill="#075E52" font-family="Cambria">Missing signal ≠ zero</text><text x="856" y="497" fill="#132F3B">A quiet feed may be a collection <tspan x="856" dy="26">failure. Track source health and</tspan> <tspan x="856" dy="26">mark uncertainty before inferring</tspan> <tspan x="856" dy="26">progress.</tspan></text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Bridgewater · Citadel Securities | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">08 / 37</text></g></svg>
