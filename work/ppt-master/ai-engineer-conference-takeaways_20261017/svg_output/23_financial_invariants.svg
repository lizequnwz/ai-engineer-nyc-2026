<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">04 / CONTROLLED WORKFLOWS</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Long-running work needs state and deliberate recovery</text><text x="48" y="141" font-size="22" fill="#50616A">Arca explains event-driven service work; Perpetual explains compiled and approved execution.</text></g><g id="method-sequence" data-pptx-bounds="48 180 1184 56"><rect x="48.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="62.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Interpret</text><rect x="347.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="361.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Validate / approve</text><rect x="647.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="661.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Wait / resume</text><rect x="946.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="960.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Resolve outcome</text></g><g id="analysis-1" data-pptx-bounds="48 252 365 413"><text x="48" y="280" font-size="24" font-family="Cambria" fill="#075E52">Persist the handoff</text><text x="48" y="341" fill="#132F3B">Keep the goal, approved plan, <tspan x="48" dy="27">completed work, evidence and next </tspan><tspan x="48" dy="27">responsible party outside a </tspan><tspan x="48" dy="27">disposable run. Wake on a client </tspan><tspan x="48" dy="27">reply, approval, settlement event </tspan><tspan x="48" dy="27">or deadline. A new invocation </tspan><tspan x="48" dy="27">should know what happened and what </tspan><tspan x="48" dy="27">remains, without assuming every </tspan><tspan x="48" dy="27">prior action failed.</tspan></text></g><g id="analysis-2" data-pptx-bounds="452 252 365 413"><text x="452" y="280" font-size="24" font-family="Cambria" fill="#075E52">Freeze the approved action</text><text x="452" y="341" fill="#132F3B">Perpetual separates provisional <tspan x="452" dy="27">interpretation from a compiled plan </tspan><tspan x="452" dy="27">and binds approval to the exact </tspan><tspan x="452" dy="27">outgoing payload. Clarification or </tspan><tspan x="452" dy="27">refusal can be correct outcomes. </tspan><tspan x="452" dy="27">Changes to a client reply must not </tspan><tspan x="452" dy="27">silently rewrite the approved </tspan><tspan x="452" dy="27">parent plan or inherit permission </tspan><tspan x="452" dy="27">for a different action.</tspan></text></g><g id="analysis-3" data-pptx-bounds="856 252 365 413"><text x="856" y="280" font-size="24" font-family="Cambria" fill="#075E52">Distinguish unknown from <tspan x="856" dy="32">failed</tspan></text><text x="856" y="341" fill="#132F3B">A timeout after an external write <tspan x="856" dy="27">can leave the outcome unknown. </tspan><tspan x="856" dy="27">Blind retries can duplicate an </tspan><tspan x="856" dy="27">action. Route uncertainty to </tspan><tspan x="856" dy="27">reconciliation or manual review; </tspan><tspan x="856" dy="27">test interruptions around the </tspan><tspan x="856" dy="27">side-effect boundary. Vanguard’s </tspan><tspan x="856" dy="27">separate modernization story </tspan><tspan x="856" dy="27">reinforces invariants and </tspan><tspan x="856" dy="27">observability, not unconstrained </tspan><tspan x="856" dy="27">autonomy.</tspan></text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Arca · Perpetual · Vanguard | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">23 / 37</text></g></svg>
