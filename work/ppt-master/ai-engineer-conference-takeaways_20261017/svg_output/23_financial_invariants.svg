<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">04 / CONTROLLED WORKFLOWS</text><text x="48" y="97" font-size="36" fill="#102E3A" font-family="Cambria">Unknown execution outcomes require deliberate recovery</text><text x="48" y="141" font-size="22" fill="#50616A">Perpetual constrains dispatch; Arca separately persists service plans through replies, approval and <tspan x="48" dy="29">settlement.</tspan></text></g><g id="perpetual-dispatch" data-pptx-bounds="48 184 764 142"><text x="48" y="208" font-size="16" fill="#075E52" font-weight="bold">PERPETUAL / EXACT-PAYLOAD APPROVAL</text><text x="48" y="254" font-size="24" fill="#102E3A" font-family="Cambria">Approve payload → dispatch request → timeout</text><text x="48" y="298" fill="#132F3B">Teaching reconstruction: an approved email request loses its response.</text></g><g id="world-sent" data-pptx-bounds="48 350 358 120"><rect x="48" y="350" width="358" height="120" fill="#E7F0EA" /><text x="66" y="379" fill="#075E52" font-weight="bold">Possible world A</text><text x="66" y="420" fill="#132F3B">The provider sent the email.</text></g><g id="world-not-sent" data-pptx-bounds="430 350 382 120"><rect x="430" y="350" width="382" height="120" fill="#E7F0EA" /><text x="448" y="379" fill="#075E52" font-weight="bold">Possible world B</text><text x="448" y="420" fill="#132F3B">The provider did not send it.</text></g><g id="unknown-outcome" data-pptx-bounds="48 494 764 162"><rect x="48" y="494" width="764" height="162" fill="#102E3A" /><text x="70" y="531" font-size="24" fill="#D5EF8C" font-family="Cambria">Outcome unknown ≠ failed</text><text x="70" y="577" font-size="22" fill="#FFFDF7">Reconcile observable state or route to manual review before <tspan x="70" dy="29">retry. A changed payload requires new authority.</tspan></text></g><g id="arca-waits" data-pptx-bounds="856 184 376 472"><text x="856" y="208" font-size="16" fill="#075E52" font-weight="bold">ARCA / DISTINCT SYSTEM</text><text x="856" y="251" font-size="24" fill="#102E3A" font-family="Cambria">Service spans days</text><text x="856" y="297" fill="#132F3B">A narrated tax-payment plan waits <tspan x="856" dy="26">for replies, approval, trades and</tspan> <tspan x="856" dy="26">settlement.</tspan></text><text x="856" y="435" fill="#132F3B">Persist the plan and next owner. <tspan x="856" dy="26">Wake on an event or deadline.</tspan></text><text x="856" y="560" font-size="18" fill="#50616A">Illustrative story; no measured <tspan x="856" dy="24">reliability result. The timeout at left</tspan> <tspan x="856" dy="24">is not a reported incident.</tspan></text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Arca · Perpetual · Vanguard | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">23 / 37</text></g></svg>
