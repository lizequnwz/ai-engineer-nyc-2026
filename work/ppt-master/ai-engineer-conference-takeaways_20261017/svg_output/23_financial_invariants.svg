<g id="observable-invariants" data-pptx-bounds="48 440 560 208" fill="#132F3B"><text x="48" y="470" font-size="24" font-family="Cambria" fill="#075E52">Observe financial behavior directly</text><text x="48" y="516">No missing or duplicate transactions; consistent state;<tspan x="48" dy="28">database idempotency; controlled retries and recovery;</tspan><tspan x="48" dy="28">reviewable reconciliation at the relevant boundaries.</tspan></text><text x="48" y="628" font-size="18">Faster generation cannot prove those invariants hold.</text></g>
<g id="ai-contribution" data-pptx-bounds="640 440 592 208" fill="#132F3B"><text x="640" y="470" font-size="24" font-family="Cambria" fill="#075E52">Isolate AI’s contribution to the change</text><text x="640" y="516">The abstract says AI helped maintain two codebases;<tspan x="640" dy="28">incremental benefit was not isolated. Compare equivalent</tspan><tspan x="640" dy="28">changes, correctness, review/rework and operating cost.</tspan></text><text x="640" y="628" font-size="18">This case does not prescribe dual systems for another product.</text></g>
