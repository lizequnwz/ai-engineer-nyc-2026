<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">01 / FINANCE STRATEGY</text><text x="48" y="97" font-size="36" fill="#102E3A" font-family="Cambria">Reconcile inputs before preparing the work product</text><text x="48" y="141" font-size="22" fill="#50616A">Apollo / Redding Ridge: learn source precedence, prepare a portfolio, preserve PM judgment and <tspan x="48" dy="29">recurring QA.</tspan></text></g><g id="source-adjudication" data-pptx-bounds="48 184 380 164"><rect x="48" y="184" width="380" height="164" fill="#E7F0EA" /><text x="66" y="213" fill="#075E52" font-weight="bold">01 / Resolve conflicting feeds</text><text x="66" y="254" fill="#132F3B">Which source governs this task, <tspan x="66" dy="26">and why?</tspan></text></g><g id="portfolio-draft" data-pptx-bounds="444 184 380 164"><rect x="444" y="184" width="380" height="164" fill="#E7F0EA" /><text x="462" y="213" fill="#075E52" font-weight="bold">02 / Prepare a mock portfolio</text><text x="462" y="254" fill="#132F3B">Agent prepares; portfolio manager <tspan x="462" dy="26">refines.</tspan></text></g><g id="recurring-qa" data-pptx-bounds="840 184 392 164"><rect x="840" y="184" width="392" height="164" fill="#E7F0EA" /><text x="858" y="213" fill="#075E52" font-weight="bold">Separate / recurring reports</text><text x="858" y="254" fill="#132F3B">Warehouse financing and trade <tspan x="858" dy="26">reconciliation.</tspan></text></g><g id="lesson-0" data-pptx-bounds="48 394 376 260"><text x="48" y="419" font-size="24" fill="#075E52" font-family="Cambria">Observe the actual workflow</text><text x="48" y="461" fill="#132F3B">Embedded engineers learn source <tspan x="48" dy="26">precedence and professional</tspan> <tspan x="48" dy="26">exceptions before automating</tspan> <tspan x="48" dy="26">preparation.</tspan></text></g><g id="lesson-1" data-pptx-bounds="452 394 376 260"><text x="452" y="419" font-size="24" fill="#075E52" font-family="Cambria">Keep judgment explicit</text><text x="452" y="461" fill="#132F3B">The described structured-credit <tspan x="452" dy="26">workflow retains PM refinement and</tspan> <tspan x="452" dy="26">daily QA; it is not unconstrained</tspan> <tspan x="452" dy="26">portfolio management.</tspan></text></g><g id="lesson-2" data-pptx-bounds="856 394 376 260"><text x="856" y="419" font-size="24" fill="#075E52" font-family="Cambria">Measure accepted work</text><text x="856" y="461" fill="#132F3B">Days-to-minutes is reported. Full <tspan x="856" dy="26">review cost and a controlled</tspan> <tspan x="856" dy="26">comparison are not supplied; measure</tspan> <tspan x="856" dy="26">corrections and total cycle time.</tspan></text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Coatue · Apollo / Redding Ridge / Rowspace · Range | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">03 / 37</text></g></svg>
