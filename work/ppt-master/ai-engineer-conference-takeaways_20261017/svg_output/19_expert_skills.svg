<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">04 / CONTROLLED WORKFLOWS</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Expert skills need owners, reasons and boundaries</text><text x="48" y="141" font-size="22" fill="#50616A">Range’s skill encodes the professional method; client-facing recommendations remain reviewed.</text></g><g id="method-sequence" data-pptx-bounds="48 180 1184 56"><rect x="48.0" y="180" width="225.6" height="56" fill="#E7F0EA" /><text x="62.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Pick</text><rect x="287.6" y="180" width="225.6" height="56" fill="#E7F0EA" /><text x="301.6" y="215" font-size="18" fill="#075E52" font-weight="bold">Teach</text><rect x="527.2" y="180" width="225.6" height="56" fill="#E7F0EA" /><text x="541.2" y="215" font-size="18" fill="#075E52" font-weight="bold">Pack</text><rect x="766.8" y="180" width="225.6" height="56" fill="#E7F0EA" /><text x="780.8" y="215" font-size="18" fill="#075E52" font-weight="bold">Test</text><rect x="1006.4" y="180" width="225.6" height="56" fill="#E7F0EA" /><text x="1020.4" y="215" font-size="18" fill="#075E52" font-weight="bold">Ship</text></g><g id="analysis-1" data-pptx-bounds="48 252 365 413"><text x="48" y="280" font-size="24" font-family="Cambria" fill="#075E52">Pick and teach a whole task</text><text x="48" y="341" fill="#132F3B">Choose repeated work whose success <tspan x="48" dy="27">a professional can recognize. Use </tspan><tspan x="48" dy="27">prior cases to explain what </tspan><tspan x="48" dy="27">information matters, how the firm </tspan><tspan x="48" dy="27">reasons and why a branch exists. A </tspan><tspan x="48" dy="27">recording of clicks without the </tspan><tspan x="48" dy="27">reason cannot reliably guide a new </tspan><tspan x="48" dy="27">or incomplete situation.</tspan></text></g><g id="analysis-2" data-pptx-bounds="452 252 365 413"><text x="452" y="280" font-size="24" font-family="Cambria" fill="#075E52">Pack the boundaries</text><text x="452" y="341" fill="#132F3B">Include required inputs, <tspan x="452" dy="27">clarification questions, </tspan><tspan x="452" dy="27">exceptions, stopping conditions and </tspan><tspan x="452" dy="27">the handoff. Test missing facts and </tspan><tspan x="452" dy="27">conflicting instructions as well as </tspan><tspan x="452" dy="27">ordinary completion. The speaker’s </tspan><tspan x="452" dy="27">five-to-ten-case routine starts </tspan><tspan x="452" dy="27">iteration; it does not demonstrate </tspan><tspan x="452" dy="27">statistical reliability or replace </tspan><tspan x="452" dy="27">broader assessment.</tspan></text></g><g id="analysis-3" data-pptx-bounds="856 252 365 413"><text x="856" y="280" font-size="24" font-family="Cambria" fill="#075E52">Ship with maintenance</text><text x="856" y="341" fill="#132F3B">Assign an owner and a separate <tspan x="856" dy="27">reviewer, keep the method current </tspan><tspan x="856" dy="27">and retest changes. Range’s agent </tspan><tspan x="856" dy="27">sends nothing and every </tspan><tspan x="856" dy="27">recommendation is reviewed by a </tspan><tspan x="856" dy="27">planner. Measure corrected, </tspan><tspan x="856" dy="27">accepted work before claiming </tspan><tspan x="856" dy="27">capacity gains; the transcript </tspan><tspan x="856" dy="27">provides a method rather than a </tspan><tspan x="856" dy="27">controlled outcome study.</tspan></text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Range | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">19 / 37</text></g></svg>
