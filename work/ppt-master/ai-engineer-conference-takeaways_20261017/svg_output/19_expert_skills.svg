<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">04 / CONTROLLED WORKFLOWS</text><text x="48" y="97" font-size="36" fill="#102E3A" font-family="Cambria">Range drafts in parallel; planners retain authority</text><text x="48" y="141" font-size="22" fill="#50616A">An agent prepares the next analysis while a planner talks to the client; professional review governs <tspan x="48" dy="29">delivery.</tspan></text></g><g id="parallel-work" data-pptx-bounds="48 184 1184 152"><line x1="48" y1="184" x2="1232" y2="184" stroke="#CBD4D1" /><text x="48" y="216" font-size="16" fill="#075E52" font-weight="bold">PLANNER</text><text x="248" y="216" font-size="22" fill="#132F3B">Client conversation → professional review → controlled delivery</text><line x1="48" y1="248" x2="1232" y2="248" stroke="#CBD4D1" /><text x="48" y="282" font-size="16" fill="#075E52" font-weight="bold">AGENT</text><text x="248" y="282" font-size="22" fill="#132F3B">Parallel analysis → reviewable draft → no client send</text><line x1="48" y1="315" x2="1232" y2="315" stroke="#CBD4D1" /></g><g id="skill-method" data-pptx-bounds="48 352 1184 56"><rect x="48" y="352" width="1184" height="56" fill="#102E3A" /><text x="70" y="389" font-size="24" fill="#D5EF8C" font-family="Cambria">Pick  →  Teach  →  Pack  →  Test  →  Ship</text></g><g id="lesson-0" data-pptx-bounds="48 445 376 212"><text x="48" y="470" font-size="24" fill="#075E52" font-family="Cambria">Teach the reasons</text><text x="48" y="512" fill="#132F3B">Capture required facts, branching <tspan x="48" dy="26">questions and stopping conditions.</tspan> <tspan x="48" dy="26">Click sequences alone do not</tspan> <tspan x="48" dy="26">transfer judgment.</tspan></text></g><g id="lesson-1" data-pptx-bounds="452 445 376 212"><text x="452" y="470" font-size="24" fill="#075E52" font-family="Cambria">Test the exceptions</text><text x="452" y="512" fill="#132F3B">Missing or conflicting information <tspan x="452" dy="26">belongs in the cases. Five to ten</tspan> <tspan x="452" dy="26">cases starts iteration; it does not</tspan> <tspan x="452" dy="26">prove reliability.</tspan></text></g><g id="lesson-2" data-pptx-bounds="856 445 376 212"><text x="856" y="470" font-size="24" fill="#075E52" font-family="Cambria">Own the method</text><text x="856" y="512" fill="#132F3B">Assign an owner and separate <tspan x="856" dy="26">reviewer. Retest changes and measure</tspan> <tspan x="856" dy="26">accepted work plus correction effort</tspan> <tspan x="856" dy="26">before claiming capacity.</tspan></text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Range | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">19 / 37</text></g></svg>
