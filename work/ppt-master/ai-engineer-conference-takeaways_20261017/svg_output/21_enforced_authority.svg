<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#075E52"/></marker></defs><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7"/>
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">04 / PERMISSION IS A SYSTEM BOUNDARY</text><text x="48" y="98" font-family="Cambria" font-size="36">Enforce authority outside the agent’s proposal</text><text x="48" y="143" font-size="22">Make the permission path as explicit as the data path.</text></g>
<g id="authority-path" data-pptx-bounds="48 184 1184 247"><rect x="48" y="232" width="252" height="96" fill="#F1F4EE"/><text x="70" y="271" font-size="24" font-family="Cambria" fill="#075E52">Agent proposes</text><text x="70" y="307" font-size="18" fill="#132F3B">Requested action + context</text><line x1="307" y1="280" x2="389" y2="280" stroke="#075E52" stroke-width="2" marker-end="url(#arrow)"/>
<g id="p21-policy-decision" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="flowChartDecision" data-pptx-frame="400 211 220 138" fill="#E7F0EA" stroke="#075E52" stroke-width="2"><path d="M 400 280 L 510 211 L 620 280 L 510 349 Z"/></g><text x="510" y="275" text-anchor="middle" font-size="18" fill="#075E52">Check scope<tspan x="510" dy="26">and policy</tspan></text><line x1="630" y1="280" x2="828" y2="280" stroke="#075E52" stroke-width="2" marker-end="url(#arrow)"/><text x="676" y="259" font-size="18" fill="#075E52">Permitted</text><rect x="840" y="232" width="392" height="96" fill="#102E3A"/><text x="862" y="271" font-size="24" font-family="Cambria" fill="#D5EF8C">Authorized executor</text><text x="862" y="307" font-size="18" fill="#FFFDF7">Enforce user / case / resource / action</text><line x1="510" y1="354" x2="510" y2="378" stroke="#075E52" stroke-width="2" marker-end="url(#arrow)"/><rect x="290" y="389" width="440" height="42" fill="#E7F0EA"/><text x="510" y="416" text-anchor="middle" font-size="18" fill="#075E52">Deny or route required exception review</text></g>
<g id="owned-system" data-pptx-bounds="48 467 360 183" fill="#132F3B"><text x="48" y="496" font-size="24" font-family="Cambria" fill="#075E52">Owned systems</text><text x="48" y="539">Two Sigma describes owners,<tspan x="48" dy="28">products, tools, evaluations,</tspan><tspan x="48" dy="28">access declarations and risk scores.</tspan><tspan x="48" dy="28">A registry is not enforcement proof.</tspan></text></g>
<g id="scope-tests" data-pptx-bounds="440 467 360 183" fill="#132F3B"><text x="440" y="496" font-size="24" font-family="Cambria" fill="#075E52">Challenge the boundary</text><text x="440" y="539">Test revocation, cross-user access,<tspan x="440" dy="28">retries and duplicate requests.</tspan><tspan x="440" dy="28">A working credential does not prove</tspan><tspan x="440" dy="28">the business action is appropriate.</tspan></text></g>
<g id="fallible-triage" data-pptx-bounds="832 467 400 183" fill="#132F3B"><text x="832" y="496" font-size="24" font-family="Cambria" fill="#075E52">Approval triage is fallible</text><text x="832" y="539" font-size="18">The independent classifier’s type, accuracy<tspan x="832" dy="26">and power were unspecified. Test missed</tspan><tspan x="832" dy="26">consequential cases and needless</tspan><tspan x="832" dy="26">interruptions; independence cannot waive</tspan><tspan x="832" dy="26">required approval.</tspan></text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 673 1184 27" font-size="12" fill="#50616A"><text x="48" y="691">Sources: Two Sigma notes; Wise LOOP/versioned-policy agenda context. Combined control path is proposed synthesis.</text><text x="1232" y="691" text-anchor="end">21 / 37</text></g></svg>
