<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFDF7" /><g id="title" data-pptx-bounds="48 38 1184 140"><text x="48" y="54" font-size="16" fill="#075E52">04 / CONTROLLED WORKFLOWS</text><text x="48" y="97" font-size="36" font-family="Cambria" fill="#102E3A">Enforce authority outside the proposed action</text><text x="48" y="141" font-size="22" fill="#50616A">Two Sigma makes ownership and scope visible; Bloomberg makes the execution boundary concrete.</text></g><g id="method-sequence" data-pptx-bounds="48 180 1184 56"><rect x="48.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="62.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Identity</text><rect x="347.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="361.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Policy check</text><rect x="647.0" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="661.0" y="215" font-size="18" fill="#075E52" font-weight="bold">Authorized executor</text><rect x="946.5" y="180" width="285.5" height="56" fill="#E7F0EA" /><text x="960.5" y="215" font-size="18" fill="#075E52" font-weight="bold">Audit + stop</text></g><g id="analysis-1" data-pptx-bounds="48 252 365 413"><text x="48" y="280" font-size="24" font-family="Cambria" fill="#075E52">Make the agent accountable</text><text x="48" y="341" fill="#132F3B">Register an owner, purpose, tools <tspan x="48" dy="27">and accessible resources. Use </tspan><tspan x="48" dy="27">short-lived scoped identity and </tspan><tspan x="48" dy="27">carry the user’s authority through </tspan><tspan x="48" dy="27">the tool path. A valid credential </tspan><tspan x="48" dy="27">or schema does not establish that a </tspan><tspan x="48" dy="27">business action is appropriate for </tspan><tspan x="48" dy="27">this case.</tspan></text></g><g id="analysis-2" data-pptx-bounds="452 252 365 413"><text x="452" y="280" font-size="24" font-family="Cambria" fill="#075E52">Test the actual boundary</text><text x="452" y="341" fill="#132F3B">Challenge cross-tenant queries, <tspan x="452" dy="27">revoked access, agent-to-agent </tspan><tspan x="452" dy="27">privilege escalation, retries and </tspan><tspan x="452" dy="27">budget exhaustion. Bloomberg </tspan><tspan x="452" dy="27">recommends deterministic invocation </tspan><tspan x="452" dy="27">checks and egress limits including </tspan><tspan x="452" dy="27">DNS. Verify that a denied action is </tspan><tspan x="452" dy="27">blocked and a halt condition stops </tspan><tspan x="452" dy="27">execution, rather than merely </tspan><tspan x="452" dy="27">producing an alert.</tspan></text></g><g id="analysis-3" data-pptx-bounds="856 252 365 413"><text x="856" y="280" font-size="24" font-family="Cambria" fill="#075E52">Treat memory as an input <tspan x="856" dy="32">surface</tspan></text><text x="856" y="341" fill="#132F3B">A hostile document can try to <tspan x="856" dy="27">persist an instruction for a future </tspan><tspan x="856" dy="27">run. Separate source content from </tspan><tspan x="856" dy="27">trusted procedure, control memory </tspan><tspan x="856" dy="27">writes and preserve provenance. </tspan><tspan x="856" dy="27">Independent approval triage can </tspan><tspan x="856" dy="27">reduce attention demands only if </tspan><tspan x="856" dy="27">its errors and enforcement role are </tspan><tspan x="856" dy="27">understood; it cannot silently </tspan><tspan x="856" dy="27">waive required approval.</tspan></text></g><g id="footer" data-pptx-bounds="48 674 1184 26" fill="#50616A" font-size="12"><text x="48" y="692">Sources: Two Sigma · Bloomberg · Intuit Credit Karma | Reviewed October 25, 2026</text><text x="1232" y="692" text-anchor="end">21 / 37</text></g></svg>
