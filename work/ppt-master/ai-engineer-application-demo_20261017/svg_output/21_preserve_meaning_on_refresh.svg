<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7"/>
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">MEANING ACROSS ARTIFACT BOUNDARIES</text><text x="48" y="98" font-family="Cambria" font-size="36">Meaning must survive saved-data<tspan x="48" dy="43">transformations and refresh</tspan></text></g>
<g id="meaning-path" data-pptx-bounds="48 184 1184 285">
<rect x="48" y="184" width="290" height="285" fill="#E7F0EA"/><text x="68" y="224" font-size="24" font-family="Cambria" fill="#075E52">Source meaning</text><text x="68" y="276" font-size="18" fill="#132F3B">Current source SQL retains<tspan x="68" dy="26">canonical metric bindings.</tspan><tspan x="68" dy="26">Saved-SQL reshapes currently</tspan><tspan x="68" dy="26">omit that binding.</tspan></text>
<g id="p21-transform-arrow" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="rightArrow" data-pptx-frame="370 290 60 26" fill="#075E52" stroke="none"><path d="M 370 296.5 L 417 296.5 L 417 290 L 430 303 L 417 316 L 417 309.5 L 370 309.5 Z"/></g>
<rect x="452" y="184" width="312" height="285" fill="none" stroke="#075E52"/><text x="472" y="224" font-size="24" font-family="Cambria" fill="#075E52">Transformation gate</text><text x="472" y="276" font-size="18" fill="#132F3B">Carry identity through clear<tspan x="472" dy="26">projections and renames.</tspan><tspan x="472" dy="26">Scaled values or changed</tspan><tspan x="472" dy="26">aggregates need a new,</tspan><tspan x="472" dy="26">justified meaning.</tspan></text>
<g id="p21-refresh-arrow" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="rightArrow" data-pptx-frame="798 290 60 26" fill="#075E52" stroke="none"><path d="M 798 296.5 L 845 296.5 L 845 290 L 858 303 L 845 316 L 845 309.5 L 798 309.5 Z"/></g>
<rect x="880" y="184" width="352" height="285" fill="#102E3A"/><text x="900" y="224" font-size="24" font-family="Cambria" fill="#D5EF8C">Refresh gate</text><text x="900" y="276" font-size="18" fill="#FFFDF7">Current checks compare columns<tspan x="900" dy="26">and types, then copy old grain.</tspan><tspan x="900" dy="26">Also validate keys, time bucket,</tspan><tspan x="900" dy="26">aggregation/measure and scope;</tspan><tspan x="900" dy="26">check full-result key uniqueness.</tspan></text>
</g>
<g id="refresh-acceptance" data-pptx-bounds="48 501 1184 62" fill="#132F3B"><text x="48" y="524">Reject or clarify same-schema daily-to-monthly, duplicate-key or changed-measure refreshes.<tspan x="48" dy="28">Permit legitimate new values and typed empty results.</tspan></text></g>
<g id="completeness" data-pptx-bounds="48 592 1184 58"><text x="48" y="613" font-size="18" fill="#8B411C">Keep source completeness unknown when undeclared. Snapshot save time and the last transaction do not<tspan x="48" dy="26">establish completeness; preserved lineage and matching columns do not establish unchanged row meaning.</tspan></text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 666 1184 34" font-size="12" fill="#50616A"><text x="48" y="684">Oct 15 read-only review; proposed identity and grain checks. Anchors: text_to_sql/tools.py and presentation.py.</text><text x="1232" y="684" text-anchor="end">21 / 28</text></g>
