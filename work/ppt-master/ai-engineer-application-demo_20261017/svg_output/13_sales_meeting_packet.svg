<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7"/>
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">A USEFUL SALES WORK PRODUCT</text><text x="48" y="98" font-family="Cambria" font-size="36">Meeting prep should produce a<tspan x="48" dy="43">rep-reviewed advisor-sales packet</tspan></text></g>
<g id="why-meet" data-pptx-bounds="48 185 560 148"><text x="48" y="218" font-size="24" font-family="Cambria" fill="#075E52">01 / Why meet?</text><text x="48" y="260" fill="#132F3B">State the meeting objective, resolve the advisor<tspan x="48" dy="28">identity and recover prior commitments.</tspan></text></g>
<g id="what-changed" data-pptx-bounds="640 185 592 148"><text x="640" y="218" font-size="24" font-family="Cambria" fill="#075E52">02 / What changed?</text><text x="640" y="260" fill="#132F3B">Select relevant activity since the last interaction.<tspan x="640" dy="28">Keep period, scope and data coverage explicit.</tspan></text></g>
<g id="what-to-ask" data-pptx-bounds="48 354 560 150"><line x1="48" y1="355" x2="608" y2="355" stroke="#CBD4D1"/><text x="48" y="392" font-size="24" font-family="Cambria" fill="#075E52">03 / What should we ask?</text><text x="48" y="434" fill="#132F3B">Label commercial hypotheses and translate them<tspan x="48" dy="28">into discovery questions the rep can validate.</tspan></text></g>
<g id="what-to-bring" data-pptx-bounds="640 354 592 150"><line x1="640" y1="355" x2="1232" y2="355" stroke="#CBD4D1"/><text x="640" y="392" font-size="24" font-family="Cambria" fill="#075E52">04 / What should we bring?</text><text x="640" y="434" fill="#132F3B">Find current, approved product/share-class material<tspan x="640" dy="28">and flag requirements that remain unresolved.</tspan></text></g>
<g id="common-evidence" data-pptx-bounds="48 527 1184 112"><rect x="48" y="527" width="1184" height="112" fill="#102E3A"/><text x="72" y="565" font-size="22" fill="#D5EF8C">Every material number needs its meaning attached.</text><text x="72" y="604" fill="#FFFDF7">Carry entity, metric, period, units, snapshot and calculation; use effective-dated historical relationships.<tspan x="72" dy="28">Fidelity activity does not establish the advisor’s entire wallet.</tspan></text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 665 1184 35" font-size="12" fill="#50616A"><text x="48" y="683">End user: a Fidelity institutional salesperson serving advisors as distribution partners. Proposed preparation packet.</text><text x="1232" y="683" text-anchor="end">13 / 28</text></g>
</svg>
