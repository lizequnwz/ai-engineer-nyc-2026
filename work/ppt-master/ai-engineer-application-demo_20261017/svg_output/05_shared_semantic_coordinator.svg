<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">FIDELITY / PROPOSED OPERATING MODEL</text><text x="48" y="98" font-family="Cambria" font-size="36">A shared semantic coordinator can support<tspan x="48" dy="43">the complete business question</tspan></text></g>
