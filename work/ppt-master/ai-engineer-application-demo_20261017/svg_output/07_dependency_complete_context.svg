<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7"/>
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">SEMANTIC CONTEXT ENGINEERING</text><text x="48" y="98" font-family="Cambria" font-size="36">Select definitions by business role,<tspan x="48" dy="43">then close their dependencies</tspan></text></g>
<g id="authorization" data-pptx-bounds="48 184 1184 61"><rect x="48" y="184" width="1184" height="61" fill="#102E3A"/><text x="72" y="222" font-size="22" fill="#FFFDF7">First boundary: expose only metadata authorized for the user and resource.</text></g>
<g id="role-candidates" data-pptx-bounds="48 270 324 194" fill="#132F3B"><text x="48" y="300" font-size="24" font-family="Cambria" fill="#075E52">1 / Retrieve roles</text><text x="48" y="344">Candidate measures, dimensions,<tspan x="48" dy="28">filters, entities and time roles.</tspan><tspan x="48" dy="28">Keep unresolved ambiguity</tspan><tspan x="48" dy="28">visible.</tspan></text></g>
<g id="p07-retrieval-arrow" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="387 285 48 74" fill="#075E52" stroke="none"><path d="M 387 285 L 411 285 L 435 322 L 411 359 L 387 359 L 411 322 Z"/></g>
<g id="measure-dependencies" data-pptx-bounds="452 270 318 194" fill="#132F3B"><text x="452" y="300" font-size="24" font-family="Cambria" fill="#075E52">2 / Resolve meaning</text><text x="452" y="344">For selected measures, include<tspan x="452" dy="28">definitions, denominators,</tspan><tspan x="452" dy="28">physical mappings and</tspan><tspan x="452" dy="28">date rules.</tspan></text></g>
<g id="p07-closure-arrow" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="785 285 48 74" fill="#075E52" stroke="none"><path d="M 785 285 L 809 285 L 833 322 L 809 359 L 785 359 L 809 322 Z"/></g>
<g id="complete-package" data-pptx-bounds="850 270 382 194" fill="#132F3B"><text x="850" y="300" font-size="24" font-family="Cambria" fill="#075E52">3 / Complete the package</text><text x="850" y="344">Add keys, cardinality and required<tspan x="850" dy="28">join routes. A similar column name</tspan><tspan x="850" dy="28">does not prove the question</tspan><tspan x="850" dy="28">can be answered.</tspan></text></g>
<g id="version-and-test" data-pptx-bounds="48 499 1184 134"><rect x="48" y="499" width="1184" height="134" fill="#E7F0EA"/><text x="72" y="538" font-size="22" fill="#075E52">Reuse versioned catalog metadata; refresh source data independently.</text><text x="72" y="578" fill="#132F3B">As context shrinks, test required-definition and join coverage alongside final result correctness.<tspan x="72" dy="28">The goal is the smallest sufficient semantic package; missing definitions still require clarification.</tspan></text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 666 1184 34" font-size="12" fill="#50616A"><text x="48" y="684">Proposed retrieval design. Primary reference patterns: Snowflake VQR and Databricks Genie quality guidance (page 28).</text><text x="1232" y="684" text-anchor="end">07 / 28</text></g>
</svg>
