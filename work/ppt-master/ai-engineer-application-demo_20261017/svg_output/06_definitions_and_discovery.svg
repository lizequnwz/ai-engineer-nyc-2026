<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7"/>
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">DISCOVERY BEFORE SQL</text><text x="48" y="98" font-family="Cambria" font-size="36">Definitions and data discovery are useful<tspan x="48" dy="43">tasks in their own right</tspan></text></g>
<g id="illustrative-conversation" data-pptx-bounds="48 190 560 420">
<rect x="48" y="190" width="560" height="420" fill="#E7F0EA"/>
<text x="72" y="226" font-size="16" fill="#075E52">ILLUSTRATIVE RESPONSE PATH</text>
<text x="72" y="276" font-size="24" font-family="Cambria" fill="#102E3A">“What is the meaning of live?”</text>
<text x="72" y="329" fill="#132F3B">Look up the authoritative glossary or catalog.<tspan x="72" dy="28">If several definitions match, ask which applies.</tspan></text>
<line x1="72" y1="388" x2="584" y2="388" stroke="#CBD4D1"/>
<text x="72" y="431" fill="#132F3B">Explain the reviewed definition and its source.<tspan x="72" dy="28">Offer a supported example or useful next question.</tspan></text>
<text x="72" y="526" font-size="18" fill="#8B411C">The actual business meaning of “live” is unknown<tspan x="72" dy="26">in this review. Do not supply an invented meaning.</tspan></text>
</g>
<g id="capabilities" data-pptx-bounds="640 190 592 260" fill="#132F3B">
<text x="640" y="224" font-size="24" font-family="Cambria" fill="#075E52">Make the supported surface discoverable</text>
<text x="640" y="270">Offer “What can I ask?”, topic browsing and<tspan x="640" dy="28">supported example questions near the entry point.</tspan></text>
<text x="640" y="353">Explain unavailable data and unresolved terms.<tspan x="640" dy="28">A definition-only question needs metadata rather</tspan><tspan x="640" dy="28">than a source SQL query.</tspan></text>
</g>
<g id="discovery-acceptance" data-pptx-bounds="640 478 592 132"><line x1="640" y1="479" x2="1232" y2="479" stroke="#075E52" stroke-width="2"/><text x="640" y="517" font-size="24" font-family="Cambria" fill="#102E3A">Measure a useful response</text><text x="640" y="557" fill="#132F3B">Check definition correctness, helpful discovery,<tspan x="640" dy="28">useful next questions and time to useful response.</tspan></text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 666 1184 34" font-size="12" fill="#50616A"><text x="48" y="684">Proposed experience; grounded lookup and clarification replace an unsupported definition guess.</text><text x="1232" y="684" text-anchor="end">06 / 28</text></g>
</svg>
