<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">RANGE’S METHOD / PROPOSED SALES ADAPTATION</text><text x="48" y="98" font-family="Cambria" font-size="36">Sales specialists can encode preparation<tspan x="48" dy="43">as a maintained professional skill</tspan></text></g>
<g id="skill-method" data-pptx-bounds="48 184 822 450" fill="#132F3B">
<line x1="76" y1="215" x2="76" y2="587" stroke="#CBD4D1" stroke-width="2"/>
<g><circle cx="76" cy="215" r="23" fill="#075E52"/><text x="76" y="221" font-size="18" fill="#FFFDF7" text-anchor="middle">1</text><text x="118" y="220" font-size="24" font-family="Cambria" fill="#075E52">Pick</text><text x="250" y="215">Choose one repeated preparation workflow<tspan x="250" dy="28">with recognizable acceptance.</tspan></text></g>
<g><circle cx="76" cy="306" r="23" fill="#075E52"/><text x="76" y="312" font-size="18" fill="#FFFDF7" text-anchor="middle">2</text><text x="118" y="311" font-size="24" font-family="Cambria" fill="#075E52">Teach</text><text x="250" y="306">Capture why the salesperson or product specialist<tspan x="250" dy="28">takes each step, including exceptions.</tspan></text></g>
<g><circle cx="76" cy="397" r="23" fill="#075E52"/><text x="76" y="403" font-size="18" fill="#FFFDF7" text-anchor="middle">3</text><text x="118" y="402" font-size="24" font-family="Cambria" fill="#075E52">Pack</text><text x="250" y="397">Include facts, definitions, authorized sources,<tspan x="250" dy="28">clarifying questions and action limits.</tspan></text></g>
<g><circle cx="76" cy="488" r="23" fill="#075E52"/><text x="76" y="494" font-size="18" fill="#FFFDF7" text-anchor="middle">4</text><text x="118" y="493" font-size="24" font-family="Cambria" fill="#075E52">Test</text><text x="250" y="488">Use ordinary, ambiguous and consequential cases.<tspan x="250" dy="28">Missing information must change the workflow.</tspan></text></g>
<g><circle cx="76" cy="579" r="23" fill="#075E52"/><text x="76" y="585" font-size="18" fill="#FFFDF7" text-anchor="middle">5</text><text x="118" y="584" font-size="24" font-family="Cambria" fill="#075E52">Ship</text><text x="250" y="579">Assign an owner and reviewer; maintain change<tspan x="250" dy="28">history and retest revisions.</tspan></text></g>
</g>
<g id="maintained-method" data-pptx-bounds="902 184 330 450"><rect x="902" y="184" width="330" height="450" fill="#102E3A"/><text x="926" y="227" font-size="24" font-family="Cambria" fill="#D5EF8C">The skill is the method</text><text x="926" y="281" fill="#FFFDF7">Domain experts supply<tspan x="926" dy="28">reasons, questions and</tspan><tspan x="926" dy="28">exceptions, alongside</tspan><tspan x="926" dy="28">the steps.</tspan></text><text x="926" y="444" fill="#E7F0EA">Range’s financial-planning<tspan x="926" dy="28">use case provides the</tspan><tspan x="926" dy="28">method. Sales preparation</tspan><tspan x="926" dy="28">is our proposed transfer.</tspan></text></g>
