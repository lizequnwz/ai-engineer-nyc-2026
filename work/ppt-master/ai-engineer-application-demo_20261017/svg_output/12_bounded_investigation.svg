<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7"/>
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">BOUNDED AGENTIC ANALYSIS</text><text x="48" y="98" font-family="Cambria" font-size="36">Bounded investigation can make<tspan x="48" dy="43">complex questions inspectable</tspan></text></g>
<g id="investigation-question" data-pptx-bounds="48 178 1184 38"><text x="48" y="204" font-size="22" fill="#075E52">“Which advisors’ net flows fell, and which product families contributed?”</text></g>
<g id="resolve" data-pptx-bounds="48 233 200 239" fill="#132F3B"><text x="48" y="261" font-size="24" font-family="Cambria" fill="#075E52">1 / Resolve</text><text x="48" y="309">Confirm measure,<tspan x="48" dy="28">comparison window</tspan><tspan x="48" dy="28">and intended</tspan><tspan x="48" dy="28">advisor scope.</tspan></text></g>
<g id="p12-step-1-2" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="260 208 20 40" fill="#075E52" stroke="none"><path d="M 260 208 L 270 208 L 280 228 L 270 248 L 260 248 L 270 228 Z"/></g>
<g id="retrieve" data-pptx-bounds="294 233 200 239" fill="#132F3B"><text x="294" y="261" font-size="24" font-family="Cambria" fill="#075E52">2 / Retrieve</text><text x="294" y="309">Find advisor-level<tspan x="294" dy="28">change using</tspan><tspan x="294" dy="28">authorized data</tspan><tspan x="294" dy="28">and consistent dates.</tspan></text></g>
<g id="p12-step-2-3" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="506 208 20 40" fill="#075E52" stroke="none"><path d="M 506 208 L 516 208 L 526 228 L 516 248 L 506 248 L 516 228 Z"/></g>
<g id="contributions" data-pptx-bounds="540 233 200 239" fill="#132F3B"><text x="540" y="261" font-size="24" font-family="Cambria" fill="#075E52">3 / Decompose</text><text x="540" y="309">Calculate product-<tspan x="540" dy="28">family contributions</tspan><tspan x="540" dy="28">at compatible</tspan><tspan x="540" dy="28">aggregation grain.</tspan></text></g>
<g id="p12-step-3-4" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="752 208 20 40" fill="#075E52" stroke="none"><path d="M 752 208 L 762 208 L 772 228 L 762 248 L 752 248 L 762 228 Z"/></g>
<g id="reconcile" data-pptx-bounds="786 233 200 239" fill="#132F3B"><text x="786" y="261" font-size="24" font-family="Cambria" fill="#075E52">4 / Reconcile</text><text x="786" y="309">Check component<tspan x="786" dy="28">contributions against</tspan><tspan x="786" dy="28">the requested</tspan><tspan x="786" dy="28">total change.</tspan></text></g>
<g id="p12-step-4-5" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="998 208 20 40" fill="#075E52" stroke="none"><path d="M 998 208 L 1008 208 L 1018 228 L 1008 248 L 998 248 L 1008 228 Z"/></g>
<g id="explain" data-pptx-bounds="1032 233 200 239" fill="#132F3B"><text x="1032" y="261" font-size="24" font-family="Cambria" fill="#075E52">5 / Explain</text><text x="1032" y="309">Report supported<tspan x="1032" dy="28">findings, uncertainty</tspan><tspan x="1032" dy="28">and unresolved</tspan><tspan x="1032" dy="28">questions.</tspan></text></g>
<g id="repair-budget" data-pptx-bounds="48 490 1184 143"><rect x="48" y="490" width="1184" height="143" fill="#E7F0EA"/><text x="72" y="527" font-size="22" fill="#075E52">Make repair a controlled response to evidence</text><text x="72" y="566" fill="#132F3B">Use schema, execution or validation feedback within a predefined attempt and total-time budget.<tspan x="72" dy="28">Retain every attempt; finish unresolved or ask for clarification when needed. Check scope and access</tspan><tspan x="72" dy="28">at every step. Held-out answers stay outside runtime; arithmetic contribution is not a causal driver.</tspan></text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 665 1184 35" font-size="12" fill="#50616A"><text x="48" y="683">Proposed workflow. Evaluate it separately from semantic-context reduction to identify which change helps.</text><text x="1232" y="683" text-anchor="end">12 / 28</text></g>
</svg>
