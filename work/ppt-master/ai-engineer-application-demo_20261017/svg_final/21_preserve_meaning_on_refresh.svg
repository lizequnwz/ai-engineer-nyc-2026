<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7" />
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">MEANING ACROSS ARTIFACT BOUNDARIES</text><text font-size="36" font-family="Cambria" x="48" y="98">Meaning must survive saved-data</text><text font-size="36" font-family="Cambria" x="48" y="141">transformations and refresh</text></g>
<g id="meaning-path" data-pptx-bounds="48 184 1184 285">
<rect x="48" y="184" width="290" height="285" fill="#E7F0EA" /><text x="68" y="224" font-size="24" font-family="Cambria" fill="#075E52">Source meaning</text><text fill="#132F3B" font-size="18" x="68" y="276">Current source SQL retains</text><text fill="#132F3B" font-size="18" x="68" y="302">canonical metric bindings.</text><text fill="#132F3B" font-size="18" x="68" y="328">Saved-SQL reshapes currently</text><text fill="#132F3B" font-size="18" x="68" y="354">omit that binding.</text><g id="p21-transform-arrow" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="rightArrow" data-pptx-frame="370 290 60 26" fill="#075E52" stroke="none"><path d="M 370 296.5 L 417 296.5 L 417 290 L 430 303 L 417 316 L 417 309.5 L 370 309.5 Z" /></g>
<rect x="452" y="184" width="312" height="285" fill="none" stroke="#075E52" /><text x="472" y="224" font-size="24" font-family="Cambria" fill="#075E52">Transformation gate</text><text fill="#132F3B" font-size="18" x="472" y="276">Carry identity through clear</text><text fill="#132F3B" font-size="18" x="472" y="302">projections and renames.</text><text fill="#132F3B" font-size="18" x="472" y="328">Scaled values or changed</text><text fill="#132F3B" font-size="18" x="472" y="354">aggregates need a new,</text><text fill="#132F3B" font-size="18" x="472" y="380">justified meaning.</text><g id="p21-refresh-arrow" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="rightArrow" data-pptx-frame="798 290 60 26" fill="#075E52" stroke="none"><path d="M 798 296.5 L 845 296.5 L 845 290 L 858 303 L 845 316 L 845 309.5 L 798 309.5 Z" /></g>
<rect x="880" y="184" width="352" height="285" fill="#102E3A" /><text x="900" y="224" font-size="24" font-family="Cambria" fill="#D5EF8C">Refresh gate</text><text fill="#FFFDF7" font-size="18" x="900" y="276">Current checks compare columns</text><text fill="#FFFDF7" font-size="18" x="900" y="302">and types, then copy old grain.</text><text fill="#FFFDF7" font-size="18" x="900" y="328">Also validate keys, time bucket,</text><text fill="#FFFDF7" font-size="18" x="900" y="354">aggregation/measure and scope;</text><text fill="#FFFDF7" font-size="18" x="900" y="380">check full-result key uniqueness.</text></g>
<g id="refresh-acceptance" data-pptx-bounds="48 501 1184 62" fill="#132F3B"><text x="48" y="524">Reject or clarify same-schema daily-to-monthly, duplicate-key or changed-measure refreshes.</text><text x="48" y="552">Permit legitimate new values and typed empty results.</text></g>
<g id="completeness" data-pptx-bounds="48 592 1184 58"><text fill="#8B411C" font-size="18" x="48" y="613">Keep source completeness unknown when undeclared. Snapshot save time and the last transaction do not</text><text fill="#8B411C" font-size="18" x="48" y="639">establish completeness; preserved lineage and matching columns do not establish unchanged row meaning.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 666 1184 34" font-size="12" fill="#50616A"><text x="48" y="684">Oct 15 read-only review; proposed identity and grain checks. Anchors: text_to_sql/tools.py and presentation.py.</text><text x="1232" y="684" text-anchor="end">21 / 28</text></g>
</svg>