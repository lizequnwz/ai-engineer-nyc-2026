<g id="fidelity-next" data-pptx-bounds="48 194 560 248" fill="#FFFDF7"><text x="48" y="226" font-size="24" font-family="Cambria" fill="#D5EF8C">Fidelity / next working session</text><text x="48" y="274">Bring representative questions; select one domain.</text><text x="48" y="302">Agree entity, metric and date definitions, with</text><text x="48" y="330">trusted reference results.</text><text x="48" y="388">Instrument stage latency and observe how reps</text><text x="48" y="416">prepare for an advisor meeting.</text></g>
<g id="personal-next" data-pptx-bounds="640 194 592 248" fill="#FFFDF7"><text x="640" y="226" font-size="24" font-family="Cambria" fill="#D5EF8C">Personal agent / focused increments</text><text x="640" y="274">One count/forecast correctness fixture.</text><text x="640" y="302">One bound quantitative lead or callout.</text><text x="640" y="330">One numerical outcome oracle.</text><text x="640" y="388">Then connect one workspace assignment</text><text x="640" y="416">to a checked analytical result.</text></g>
<g id="shared-decision" data-pptx-bounds="48 476 1184 169"><line x1="48" y1="477" x2="1232" y2="477" stroke="#50616A" /><text x="48" y="526" font-size="24" font-family="Cambria" fill="#D5EF8C">Accepted work is the unit of progress.</text><text fill="#FFFDF7" x="48" y="572">Compare quality, consequential failures, total human effort and full known cost.</text><text fill="#FFFDF7" x="48" y="600">Record continue, revise or stop, with uncertainty visible. Agree owners, timing and thresholds together.</text></g>
