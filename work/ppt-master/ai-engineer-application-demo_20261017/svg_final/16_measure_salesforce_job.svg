<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7" />
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">WORKFLOW VALUE MUST BE OBSERVED</text><text font-size="36" font-family="Cambria" x="48" y="98">Measure the complete Salesforce job</text><text font-size="36" font-family="Cambria" x="48" y="141">before expanding the experience</text></g>
<g id="rep-journey" data-pptx-bounds="48 184 1184 173" fill="#132F3B"><rect x="48" y="184" width="1184" height="173" fill="#E7F0EA" /><text x="72" y="220" font-size="22" fill="#075E52">Observe the existing job, then put a scoped packet in the meeting record’s context.</text><text x="72" y="267">Where reps start → what they copy → whom they consult → what they verify → how they follow through</text><text x="72" y="320">Select one identifiable job, such as preparing for a meeting with a resolved advisor.</text></g>
<g id="paired-pilot" data-pptx-bounds="48 391 560 235" fill="#132F3B"><text x="48" y="420" font-size="24" font-family="Cambria" fill="#075E52">Compare a complete journey</text><text x="48" y="466">Use similar existing and assisted cases.</text><text x="48" y="494">Counterbalance preparation order where feasible</text><text x="48" y="522">to reduce learning effects.</text><text x="48" y="578">The baseline includes preparation, checking,</text><text x="48" y="606">rework and post-meeting action.</text></g>
<g id="workflow-outcomes" data-pptx-bounds="640 391 592 235" fill="#132F3B"><text x="640" y="420" font-size="24" font-family="Cambria" fill="#075E52">Measure the job’s useful outcomes</text><text x="640" y="466">Time to an accepted brief; active preparation,</text><text x="640" y="494">review and rework; useful questions and relevant</text><text x="640" y="522">omissions; return use; completed follow-through.</text><text x="640" y="578">Qualified opportunities and sales effects require</text><text x="640" y="606">separate outcome measurement and attribution.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 665 1184 35" font-size="12" fill="#50616A"><text x="48" y="683">Salesforce integration is underway. This is a proposed workflow study, not evidence of realized sales lift.</text><text x="1232" y="683" text-anchor="end">16 / 28</text></g>
