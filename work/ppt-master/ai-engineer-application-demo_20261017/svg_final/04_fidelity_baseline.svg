<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7" />
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">FIDELITY / REPORTED BASELINE</text><text font-size="36" font-family="Cambria" x="48" y="98">The current bottleneck spans usability,</text><text font-size="36" font-family="Cambria" x="48" y="141">context and evaluation</text></g>
<g id="semantic-volume" data-pptx-bounds="48 184 560 156"><rect x="48" y="184" width="560" height="156" fill="#102E3A" /><text x="72" y="259" font-size="64" fill="#D5EF8C">20–30K</text><text x="72" y="307" fill="#FFFDF7">tokens of table/column semantics per question</text></g>
<g id="generation-latency" data-pptx-bounds="640 184 592 156"><rect x="640" y="184" width="592" height="156" fill="#E7F0EA" /><text x="664" y="259" font-size="64" fill="#075E52">30–45 sec</text><text x="664" y="307" fill="#132F3B">SQL-model latency; intent/data time is additional</text></g>
<g id="architecture" data-pptx-bounds="48 374 560 112" fill="#132F3B"><text x="48" y="396" font-size="24" font-family="Cambria">Two independent model roles</text><text x="48" y="432">A lightweight LLM intent classifier routes to SQL.</text><text x="48" y="460">Even complex questions remain one shot.</text></g>
<g id="usability" data-pptx-bounds="640 374 592 112" fill="#132F3B"><text x="640" y="396" font-size="24" font-family="Cambria">Users must learn the data surface</text><text x="640" y="432">No conversation or memory. Definition questions</text><text x="640" y="460">such as “What does live mean?” are redirected.</text></g>
<g id="evaluation" data-pptx-bounds="48 518 560 118" fill="#132F3B"><text x="48" y="540" font-size="24" font-family="Cambria">Accuracy needs a wider contract</text><text x="48" y="576">Current checks compare reference/generated row</text><text x="48" y="604">counts and use an LLM to judge returned data.</text></g>
<g id="workflow" data-pptx-bounds="640 518 592 118" fill="#132F3B"><text x="640" y="540" font-size="24" font-family="Cambria">Workflow value is still an open question</text><text x="640" y="576">Salesforce integration is underway; its effect on</text><text x="640" y="604">sales preparation and daily work is unmeasured.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 663 1184 37" fill="#50616A" font-size="12"><text x="48" y="681">User-reported estimates, not measured p50/p95. Fidelity application code and data were not inspected.</text><text x="1232" y="681" text-anchor="end">04 / 28</text></g>
</svg>