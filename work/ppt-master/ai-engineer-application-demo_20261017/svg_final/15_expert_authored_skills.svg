<g><circle cx="76" cy="215" r="23" fill="#075E52" /><text x="76" y="221" font-size="18" fill="#FFFDF7" text-anchor="middle">1</text><text x="118" y="220" font-size="24" font-family="Cambria" fill="#075E52">Pick</text><text x="250" y="215">Choose one repeated preparation workflow</text><text x="250" y="243">with recognizable acceptance.</text></g>
<g><circle cx="76" cy="306" r="23" fill="#075E52" /><text x="76" y="312" font-size="18" fill="#FFFDF7" text-anchor="middle">2</text><text x="118" y="311" font-size="24" font-family="Cambria" fill="#075E52">Teach</text><text x="250" y="306">Capture why the salesperson or product specialist</text><text x="250" y="334">takes each step, including exceptions.</text></g>
<g><circle cx="76" cy="397" r="23" fill="#075E52" /><text x="76" y="403" font-size="18" fill="#FFFDF7" text-anchor="middle">3</text><text x="118" y="402" font-size="24" font-family="Cambria" fill="#075E52">Pack</text><text x="250" y="397">Include facts, definitions, authorized sources,</text><text x="250" y="425">clarifying questions and action limits.</text></g>
<g><circle cx="76" cy="488" r="23" fill="#075E52" /><text x="76" y="494" font-size="18" fill="#FFFDF7" text-anchor="middle">4</text><text x="118" y="493" font-size="24" font-family="Cambria" fill="#075E52">Test</text><text x="250" y="488">Use ordinary, ambiguous and consequential cases.</text><text x="250" y="516">Missing information must change the workflow.</text></g>
<g><circle cx="76" cy="579" r="23" fill="#075E52" /><text x="76" y="585" font-size="18" fill="#FFFDF7" text-anchor="middle">5</text><text x="118" y="584" font-size="24" font-family="Cambria" fill="#075E52">Ship</text><text x="250" y="579">Assign an owner and reviewer; maintain change</text><text x="250" y="607">history and retest revisions.</text></g>
