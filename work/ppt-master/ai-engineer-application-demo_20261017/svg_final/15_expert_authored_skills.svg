<g id="maintained-method" data-pptx-bounds="902 184 330 450"><rect x="902" y="184" width="330" height="450" fill="#102E3A" /><text x="926" y="227" font-size="24" font-family="Cambria" fill="#D5EF8C">The skill is the method</text><text fill="#FFFDF7" x="926" y="281">Domain experts supply</text><text fill="#FFFDF7" x="926" y="309">reasons, questions and</text><text fill="#FFFDF7" x="926" y="337">exceptions, alongside</text><text fill="#FFFDF7" x="926" y="365">the steps.</text><text fill="#E7F0EA" x="926" y="444">Range’s financial-planning</text><text fill="#E7F0EA" x="926" y="472">use case provides the</text><text fill="#E7F0EA" x="926" y="500">method. Sales preparation</text><text fill="#E7F0EA" x="926" y="528">is our proposed transfer.</text></g>
