<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">RANGE’S METHOD / PROPOSED SALES ADAPTATION</text><text font-size="36" font-family="Cambria" x="48" y="98">Sales specialists can encode preparation</text><text font-size="36" font-family="Cambria" x="48" y="141">as a maintained professional skill</text></g>
