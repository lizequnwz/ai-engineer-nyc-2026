<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" font-size="20" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFDF7" />
<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">SEMANTIC CONTEXT ENGINEERING</text><text font-size="36" font-family="Cambria" x="48" y="98">Select definitions by business role,</text><text font-size="36" font-family="Cambria" x="48" y="141">then close their dependencies</text></g>
<g id="authorization" data-pptx-bounds="48 184 1184 61"><rect x="48" y="184" width="1184" height="61" fill="#102E3A" /><text x="72" y="222" font-size="22" fill="#FFFDF7">First boundary: expose only metadata authorized for the user and resource.</text></g>
<g id="role-candidates" data-pptx-bounds="48 270 324 194" fill="#132F3B"><text x="48" y="300" font-size="24" font-family="Cambria" fill="#075E52">1 / Retrieve roles</text><text x="48" y="344">Candidate measures, dimensions,</text><text x="48" y="372">filters, entities and time roles.</text><text x="48" y="400">Keep unresolved ambiguity</text><text x="48" y="428">visible.</text></g>
<g id="p07-retrieval-arrow" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="387 285 48 74" fill="#075E52" stroke="none"><path d="M 387 285 L 411 285 L 435 322 L 411 359 L 387 359 L 411 322 Z" /></g>
<g id="measure-dependencies" data-pptx-bounds="452 270 318 194" fill="#132F3B"><text x="452" y="300" font-size="24" font-family="Cambria" fill="#075E52">2 / Resolve meaning</text><text x="452" y="344">For selected measures, include</text><text x="452" y="372">definitions, denominators,</text><text x="452" y="400">physical mappings and</text><text x="452" y="428">date rules.</text></g>
<g id="p07-closure-arrow" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="785 285 48 74" fill="#075E52" stroke="none"><path d="M 785 285 L 809 285 L 833 322 L 809 359 L 785 359 L 809 322 Z" /></g>
<g id="complete-package" data-pptx-bounds="850 270 382 194" fill="#132F3B"><text x="850" y="300" font-size="24" font-family="Cambria" fill="#075E52">3 / Complete the package</text><text x="850" y="344">Add keys, cardinality and required</text><text x="850" y="372">join routes. A similar column name</text><text x="850" y="400">does not prove the question</text><text x="850" y="428">can be answered.</text></g>
<g id="version-and-test" data-pptx-bounds="48 499 1184 134"><rect x="48" y="499" width="1184" height="134" fill="#E7F0EA" /><text x="72" y="538" font-size="22" fill="#075E52">Reuse versioned catalog metadata; refresh source data independently.</text><text fill="#132F3B" x="72" y="578">As context shrinks, test required-definition and join coverage alongside final result correctness.</text><text fill="#132F3B" x="72" y="606">The goal is the smallest sufficient semantic package; missing definitions still require clarification.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 666 1184 34" font-size="12" fill="#50616A"><text x="48" y="684">Proposed retrieval design. Primary reference patterns: Snowflake VQR and Databricks Genie quality guidance (page 28).</text><text x="1232" y="684" text-anchor="end">07 / 28</text></g>
</svg>