<g id="explain" data-pptx-bounds="1032 233 200 239" fill="#132F3B"><text x="1032" y="261" font-size="24" font-family="Cambria" fill="#075E52">5 / Explain</text><text x="1032" y="309">Report supported</text><text x="1032" y="337">findings, uncertainty</text><text x="1032" y="365">and unresolved</text><text x="1032" y="393">questions.</text></g>
<g id="repair-budget" data-pptx-bounds="48 490 1184 143"><rect x="48" y="490" width="1184" height="143" fill="#E7F0EA" /><text x="72" y="527" font-size="22" fill="#075E52">Make repair a controlled response to evidence</text><text fill="#132F3B" x="72" y="566">Use schema, execution or validation feedback within a predefined attempt and total-time budget.</text><text fill="#132F3B" x="72" y="594">Retain every attempt; finish unresolved or ask for clarification when needed. Check scope and access</text><text fill="#132F3B" x="72" y="622">at every step. Held-out answers stay outside runtime; arithmetic contribution is not a causal driver.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 665 1184 35" font-size="12" fill="#50616A"><text x="48" y="683">Proposed workflow. Evaluate it separately from semantic-context reduction to identify which change helps.</text><text x="1232" y="683" text-anchor="end">12 / 28</text></g>
