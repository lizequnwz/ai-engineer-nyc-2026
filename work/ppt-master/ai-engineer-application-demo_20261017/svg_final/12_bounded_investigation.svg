<g id="p12-step-3-4" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="752 208 20 40" fill="#075E52" stroke="none"><path d="M 752 208 L 762 208 L 772 228 L 762 248 L 752 248 L 762 228 Z" /></g>
<g id="reconcile" data-pptx-bounds="786 233 200 239" fill="#132F3B"><text x="786" y="261" font-size="24" font-family="Cambria" fill="#075E52">4 / Reconcile</text><text x="786" y="309">Check component</text><text x="786" y="337">contributions against</text><text x="786" y="365">the requested</text><text x="786" y="393">total change.</text></g>
