<g id="title" data-pptx-bounds="48 40 1184 120" fill="#102E3A"><text x="48" y="55" font-size="16" fill="#075E52">BOUNDED AGENTIC ANALYSIS</text><text font-size="36" font-family="Cambria" x="48" y="98">Bounded investigation can make</text><text font-size="36" font-family="Cambria" x="48" y="141">complex questions inspectable</text></g>
<g id="investigation-question" data-pptx-bounds="48 178 1184 38"><text x="48" y="204" font-size="22" fill="#075E52">“Which advisors’ net flows fell, and which product families contributed?”</text></g>
<g id="resolve" data-pptx-bounds="48 233 200 239" fill="#132F3B"><text x="48" y="261" font-size="24" font-family="Cambria" fill="#075E52">1 / Resolve</text><text x="48" y="309">Confirm measure,</text><text x="48" y="337">comparison window</text><text x="48" y="365">and intended</text><text x="48" y="393">advisor scope.</text></g>
<g id="p12-step-1-2" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="260 208 20 40" fill="#075E52" stroke="none"><path d="M 260 208 L 270 208 L 280 228 L 270 248 L 260 248 L 270 228 Z" /></g>
<g id="retrieve" data-pptx-bounds="294 233 200 239" fill="#132F3B"><text x="294" y="261" font-size="24" font-family="Cambria" fill="#075E52">2 / Retrieve</text><text x="294" y="309">Find advisor-level</text><text x="294" y="337">change using</text><text x="294" y="365">authorized data</text><text x="294" y="393">and consistent dates.</text></g>
<g id="p12-step-2-3" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="506 208 20 40" fill="#075E52" stroke="none"><path d="M 506 208 L 516 208 L 526 228 L 516 248 L 506 248 L 516 228 Z" /></g>
